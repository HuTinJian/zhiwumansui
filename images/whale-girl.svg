<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="鲸鱼娘 · DeepSeek">
  <title>鲸鱼娘 · DeepSeek V4.1-Flash</title>
  <defs>
    <linearGradient id="wgBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FA5FF"/>
      <stop offset="52%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#2B3EB8"/>
    </linearGradient>
    <linearGradient id="wgHood" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F6FF"/>
      <stop offset="100%" stop-color="#D9E3FF"/>
    </linearGradient>
    <linearGradient id="wgSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEFE0"/>
      <stop offset="100%" stop-color="#FFDCC4"/>
    </linearGradient>
    <radialGradient id="wgGlow" cx="0.32" cy="0.22" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆形底：深蓝渐变，呼应 DeepSeek 的品牌蓝 -->
  <circle cx="32" cy="32" r="32" fill="url(#wgBadge)"/>
  <circle cx="32" cy="32" r="32" fill="url(#wgGlow)"/>

  <!-- 鲸鱼尾鳍：从头顶冒出来的那片小尾巴，是"鲸"的关键辨识点 -->
  <path d="M32 21 C29 13 24 8.5 16.5 6.5 C21.5 13.5 25 17.5 27.5 21 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M32 21 C35 13 40 8.5 47.5 6.5 C42.5 13.5 39 17.5 36.5 21 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- 鲸鱼头套：整体是一个圆润的鲸头 -->
  <path d="M13 44 C13 26 21 18 32 18 C43 18 51 26 51 44 C51 51 46.5 54.5 40 54.5 L24 54.5 C17.5 54.5 13 51 13 44 Z"
        fill="url(#wgHood)"/>
  <!-- 头套左侧的一点体积感 -->
  <path d="M15.5 42 C15.5 29 21 22 27 20.6 C20.5 24 17.5 32 17.5 44 C17.5 48.5 19 51.4 21.5 52.8 C17.9 52.3 15.5 49 15.5 42 Z"
        fill="#C7D6FF" opacity="0.55"/>

  <!-- 脸 -->
  <ellipse cx="32" cy="38.5" rx="12" ry="11" fill="url(#wgSkin)"/>

  <!-- 刘海：额头上那片蓝发，是"娘"的关键辨识点 -->
  <path d="M20 36.5 C20 25.5 25 21.5 32 21.5 C39 21.5 44 25.5 44 36.5
           C41.5 31.5 40 28.5 32 28.5 C24 28.5 22.5 31.5 20 36.5 Z"
        fill="#4D6BFE"/>
  <!-- 两缕垂在脸颊两侧的头发 -->
  <path d="M20.2 36 C18.2 42.5 18.4 48.5 20.6 52.4 C22.6 48.6 23.4 42.6 22.4 36 Z" fill="#4D6BFE"/>
  <path d="M43.8 36 C45.8 42.5 45.6 48.5 43.4 52.4 C41.4 48.6 40.6 42.6 41.6 36 Z" fill="#4D6BFE"/>

  <!-- 眼睛 -->
  <ellipse cx="26.2" cy="39.2" rx="2.7" ry="3.7" fill="#22305C"/>
  <ellipse cx="37.8" cy="39.2" rx="2.7" ry="3.7" fill="#22305C"/>
  <circle cx="25.2" cy="37.7" r="1.05" fill="#FFFFFF"/>
  <circle cx="36.8" cy="37.7" r="1.05" fill="#FFFFFF"/>

  <!-- 腮红 -->
  <ellipse cx="22.4" cy="43.4" rx="2.9" ry="1.8" fill="#FF9FBC" opacity="0.78"/>
  <ellipse cx="41.6" cy="43.4" rx="2.9" ry="1.8" fill="#FF9FBC" opacity="0.78"/>

  <!-- 小嘴 -->
  <path d="M29.4 45.4 Q32 48 34.6 45.4" stroke="#C05577" stroke-width="1.7"
        fill="none" stroke-linecap="round"/>

  <!-- 头顶一颗小水花，点出"海里的鲸" -->
  <circle cx="32" cy="15.6" r="1.5" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="27.6" cy="13.4" r="0.95" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="36.4" cy="13.4" r="0.95" fill="#FFFFFF" opacity="0.65"/>
</svg>
