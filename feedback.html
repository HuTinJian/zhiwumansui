<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意见反馈 - 织雾满穗</title>
  <style>
    /* ========== 全局变量（粉色主题，与主页统一） ========== */
    :root {
      --primary: #dc6b82;          /* 主色：暖粉色 */
      --primary-dark: #c7546a;     /* 深粉，用于悬停 */
      --primary-light: #f0a3b4;    /* 浅粉，用于边框 */
      --secondary: #f8c8d2;        /* 辅助粉 */
      --accent: #e88da1;           /* 强调粉 */
      --bg: #fdf2f5;               /* 页面背景：极浅粉，护眼 */
      --bg-card: #ffffff;          /* 卡片背景：纯白 */
      --text: #4a3f44;             /* 主要文字 */
      --text-light: #6e5f65;       /* 次要文字 */
      --text-muted: #b5a1a8;       /* 辅助文字 */
      --border: #f0d9de;           /* 浅粉边框 */
      --shadow: 0 4px 20px rgba(220, 107, 130, 0.08);
      --shadow-hover: 0 12px 40px rgba(220, 107, 130, 0.15);
      --radius: 20px;
      --radius-sm: 14px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    }

    /* ========== 全局重置 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;                /* 确保页面高度等于视口高度 */
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;            /* 恢复常规行高 */
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ========== 顶部导航栏（与主页一致：高度64px） ========== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(220, 107, 130, 0.05);
      padding: 0 24px;
      height: 64px;               /* 与主页导航栏高度一致 */
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;             /* 导航栏不参与压缩 */
    }

    .navbar .nav-links {
      display: flex;
      gap: 10px;
      list-style: none;
    }

    .navbar .nav-links a {
      padding: 8px 18px;
      border-radius: 50px;
      text-decoration: none;
      color: var(--text-light);
      font-weight: 500;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .navbar .nav-links a:hover {
      background: rgba(220, 107, 130, 0.1);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .navbar .nav-links a.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(220, 107, 130, 0.35);
      font-weight: 600;
    }

    /* ========== 主内容区域 ========== */
    .main-content {
      flex: 1;                    /* 占据导航栏之外的全部高度 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 20px 0;       /* 上方留白充足 */
      min-height: 0;
    }

    /* ========== 反馈卡片（恢复常规大小） ========== */
    .feedback-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 36px;         /* 常规内边距 */
      width: 100%;
      max-width: 600px;
      border-left: 5px solid var(--primary);
      animation: fadeInUp 0.5s ease-out;
      margin-bottom: 40px;        /* 与开发者区域的间隔 */
    }

    .feedback-card h2 {
      font-size: 1.8rem;          /* 恢复标题大小 */
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
    }

    .feedback-card .desc {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* ========== 表单样式（恢复常规大小） ========== */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;         /* 恢复输入框内边距 */
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: var(--font);
      transition: var(--transition);
      background: #fdf8fa;
      color: var(--text);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 120px;          /* 恢复文本框高度 */
    }

    .error-message {
      color: #e74c3c;
      font-size: 0.8rem;
      margin-top: 4px;
      display: none;
    }
    .error-message.show {
      display: block;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      color: #fff;
      padding: 14px 32px;         /* 恢复按钮内边距 */
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
      letter-spacing: 0.5px;
      margin-top: 8px;
      width: 100%;
      box-shadow: 0 6px 16px rgba(220, 107, 130, 0.25);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(220, 107, 130, 0.35);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: var(--transition);
    }
    .back-link:hover {
      text-decoration: underline;
    }

    /* ========== 感谢信息（默认隐藏） ========== */
    .success-message {
      display: none;
      text-align: center;
      padding: 30px 0;
    }
    .success-message .success-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    .success-message h2 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .success-message p {
      color: var(--text-light);
      margin-bottom: 20px;
      font-size: 1rem;
    }
    .success-message a {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      transition: var(--transition);
      font-size: 0.95rem;
    }
    .success-message a:hover {
      background: var(--primary-dark);
      box-shadow: 0 8px 20px rgba(220, 107, 130, 0.35);
      transform: translateY(-2px);
    }

    /* ========== 开发者与支持者展示（低调，固定在底部） ========== */
    .credits-section {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: auto auto 0;        /* 上边距自动，将内容推到底部 */
      max-width: 700px;
      padding: 0 20px 0;
    }

    .credits-card {
      background: rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-sm);
      box-shadow: 0 2px 10px rgba(220, 107, 130, 0.05);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
      border: 1px solid rgba(220, 107, 130, 0.1);
      min-width: 180px;
    }

    .credits-card:hover {
      border-color: rgba(220, 107, 130, 0.2);
      box-shadow: 0 6px 20px rgba(220, 107, 130, 0.12);
      transform: translateY(-2px);
    }

    .credits-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 8px;
    }

    .credits-info {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    .credits-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .credits-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-light);
    }

    .credits-en {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ========== 页脚 ========== */
    .footer {
      text-align: center;
      padding: 16px 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ========== 动画 ========== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 响应式设计 ========== */
    @media (max-width: 768px) {
      .navbar { padding: 0 16px; height: 56px; }  /* 移动端导航栏适当降低 */
      .navbar .nav-links a { padding: 6px 12px; font-size: 0.85rem; }
      .main-content { padding: 24px 16px 0; }
      .feedback-card { padding: 24px 18px; margin-bottom: 30px; }
      .feedback-card h2 { font-size: 1.4rem; }
      .success-message h2 { font-size: 1.4rem; }
      .credits-section { flex-direction: column; align-items: center; gap: 10px; }
      .credits-card { min-width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- ==================== 顶部导航栏 ==================== -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="index.html">🏠 首页</a></li>
      <li><a href="feedback.html" class="active">💬 反馈</a></li>
    </ul>
  </nav>

  <!-- ==================== 主内容区域 ==================== -->
  <div class="main-content">
    <div class="feedback-card">
      <!-- 表单区域 -->
      <div id="formContainer">
        <h2>💬 意见反馈</h2>
        <p class="desc">我们重视你的每一个建议！请填写以下表单，我们会通过邮件收到你的反馈。</p>

        <!-- 表单提交到 FormSubmit 服务 -->
        <!-- action 中的邮箱地址可以改成你自己的接收邮箱 -->
        <form id="feedbackForm" action="https://formsubmit.co/2560803486@qq.com" method="POST">
          <!-- 提交成功后跳转地址（由 JS 动态设置） -->
          <input type="hidden" name="_next" value="">
          <!-- 邮件主题 -->
          <input type="hidden" name="_subject" value="ZhiMist 工作室 - 新的反馈">
          <!-- 禁用验证码（可选） -->
          <input type="hidden" name="_captcha" value="false">

          <div class="form-group">
            <label for="feedbackName">你的称呼</label>
            <input type="text" id="feedbackName" name="name" placeholder="请输入你的名字或昵称" required />
          </div>
          <div class="form-group">
            <label for="feedbackEmail">你的邮箱（必填，用于接收回复）</label>
            <input type="email" id="feedbackEmail" name="email" placeholder="请输入正确的邮箱地址" required />
            <div class="error-message" id="emailError">⚠️ 邮箱格式不正确，请检查后重新输入</div>
          </div>
          <div class="form-group">
            <label for="feedbackMessage">反馈内容</label>
            <textarea id="feedbackMessage" name="message" placeholder="请详细描述你的建议、问题或想法..." required></textarea>
          </div>
          <button type="submit" class="btn-submit">🚀 提交反馈</button>
        </form>
        <a href="index.html" class="back-link">← 返回首页</a>
      </div>

      <!-- 感谢信息区域（默认隐藏） -->
      <div class="success-message" id="successMessage">
        <div class="success-icon">🎉</div>
        <h2>提交成功！</h2>
        <p>感谢你的反馈，我们已经收到你的信息。<br>我们会尽快通过你留下的邮箱联系你。</p>
        <a href="index.html">🏠 返回首页</a>
      </div>
    </div>

    <!-- ==================== 开发者与支持者展示（自动固定在底部） ==================== -->
    <div class="credits-section">
      <!-- 开发者卡片 -->
      <div class="credits-card">
        <!-- 请将 src 改为你实际的开发者图片文件名 -->
        <img class="credits-icon" src="developer.png" alt="开发者图标" />
        <div class="credits-info">
          <span class="credits-label">开发者</span>
          <span class="credits-name">织雾满穗</span>
          <span class="credits-en">HuTinJian</span>
        </div>
      </div>
      <!-- 支持者卡片 -->
      <div class="credits-card">
        <!-- 支持者图标文件名已改为 deepseek.png -->
        <img class="credits-icon" src="deepseek.png" alt="支持者图标" />
        <div class="credits-info">
          <span class="credits-label">支持者</span>
          <span class="credits-name">DeepSeek</span>
          <span class="credits-en">AI Assistant</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 页脚 ==================== -->
  <footer class="footer">
    <p>© 2026 织雾满穗 · 用知识照亮世界</p>
  </footer>

  <!-- ==================== JavaScript 逻辑 ==================== -->
  <script>
    /**
     * 检查 URL 中是否包含 success=true 参数
     * 如果有，则显示感谢信息并隐藏表单
     */
    function checkSuccessParam() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('success') === 'true') {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
        // 清除 URL 中的参数，让地址干净
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }
      } else {
        document.getElementById('formContainer').style.display = 'block';
        document.getElementById('successMessage').style.display = 'none';
      }
    }

    /**
     * 表单提交前处理：
     * 1. 使用严格的正则验证邮箱格式
     * 2. 动态设置 _next 字段为当前页面完整地址 + ?success=true
     */
    document.getElementById('feedbackForm').addEventListener('submit', function(event) {
      // 1. 邮箱验证（严格版）
      const emailInput = document.getElementById('feedbackEmail');
      const emailError = document.getElementById('emailError');
      const emailValue = emailInput.value.trim();

      // 严格邮箱正则：
      // - 用户名部分允许字母、数字、点、下划线、百分号、加号、减号
      // - 必须包含 @
      // - 域名部分允许字母、数字、连字符和点，但至少有一个点，且最后一个点后必须至少有两个字母
      // - 这样可以拒绝 5@5.5 这种域名和顶级域都是数字的不规范邮箱
      const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}$/;

      if (!emailPattern.test(emailValue)) {
        event.preventDefault();          // 阻止提交
        emailError.classList.add('show');
        emailInput.focus();
        return false;
      } else {
        emailError.classList.remove('show');
      }

      // 2. 设置 _next 字段
      var nextInput = this.querySelector('input[name="_next"]');
      if (nextInput) {
        var baseUrl = window.location.href.split('?')[0];
        nextInput.value = baseUrl + '?success=true';
      }

      return true;  // 允许提交
    });

    // 用户输入时自动隐藏错误提示
    document.getElementById('feedbackEmail').addEventListener('input', function() {
      document.getElementById('emailError').classList.remove('show');
    });

    // 页面加载时检查 URL
    window.addEventListener('load', checkSuccessParam);
    window.addEventListener('popstate', checkSuccessParam);
  </script>
</body>
</html>
