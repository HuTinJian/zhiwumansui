<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意见反馈 - 织雾满穗</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* ========== 主内容 ========== */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 0;
      width: 100%;
    }

    /* ========== 反馈卡片 ========== */
    .feedback-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      width: 100%;
      max-width: 600px;
      border-left: 5px solid var(--primary);
      animation: cardRise 0.55s var(--ease-bounce) both;
      will-change: transform;
    }

    .feedback-card h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--primary);
      animation: fadeInUp 0.4s var(--ease-soft) 0.15s both;
    }

    .feedback-card .desc {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 22px;
      animation: fadeInUp 0.4s var(--ease-soft) 0.2s both;
    }

    .form-group { margin-bottom: 16px; }

    /* ========== 自定义下拉 ========== */
    .select-wrapper {
      position: relative;
      margin-top: 4px;
    }

    .select-trigger {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fdf8fa;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-family: var(--font);
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.3s var(--ease-soft), background 0.3s var(--ease-soft), transform 0.3s var(--ease-bounce);
    }

    .select-trigger.selected {
      color: var(--text);
    }

    .select-trigger:hover {
      border-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .select-trigger:active {
      transform: scale(0.97);
      transition: transform 0.1s var(--ease-soft);
    }

    .select-trigger.open {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.12);
    }

    .select-trigger .arrow {
      color: var(--primary);
      font-size: 0.9rem;
      transition: transform 0.35s var(--ease-bounce);
    }

    .select-trigger.open .arrow {
      transform: rotate(180deg);
    }

    .select-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-hover);
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      transition: max-height 0.35s var(--ease-bounce), opacity 0.25s var(--ease-soft);
      z-index: 10;
    }

    .select-dropdown.open {
      max-height: 400px;
      opacity: 1;
      pointer-events: auto;
    }

    .select-option {
      padding: 12px 16px;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s var(--ease-soft), padding-left 0.25s var(--ease-bounce), transform 0.15s var(--ease-soft);
    }

    .select-option:hover {
      background: rgba(220, 107, 130, 0.08);
      padding-left: 24px;
    }

    .select-option:active {
      transform: scale(0.97);
    }

    .select-option.active {
      background: rgba(220, 107, 130, 0.12);
      color: var(--primary);
      font-weight: 600;
    }

    .select-option.active::after {
      content: '✓';
      float: right;
      color: var(--primary);
      font-weight: 700;
    }

    /* ========== 自定义圆形复选框 ========== */
    .checkbox-list {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: var(--gold-bg);
      border: 1px solid var(--gold-light);
      border-radius: var(--radius-sm);
      margin-top: 4px;
    }

    .checkbox-list.show {
      display: flex;
      animation: checkboxSlide 0.35s var(--ease-bounce) both;
    }

    .custom-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
    }

    .custom-checkbox input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .custom-checkbox .box {
      width: 22px;
      height: 22px;
      border: 2px solid var(--primary-light);
      border-radius: 50%;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s var(--ease-bounce);
      flex-shrink: 0;
      position: relative;
    }

    .custom-checkbox .box::after {
      content: '';
      width: 6px;
      height: 11px;
      border-right: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(45deg) scale(0);
      margin-top: -3px;
      transition: transform 0.3s var(--ease-bounce);
    }

    .custom-checkbox:hover .box {
      transform: scale(1.08);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(220, 107, 130, 0.2);
    }

    .custom-checkbox:active .box {
      transform: scale(0.92);
    }

    .custom-checkbox input:checked + .box {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(220, 107, 130, 0.3);
    }

    .custom-checkbox input:checked + .box::after {
      transform: rotate(45deg) scale(1);
    }

    .custom-checkbox .label-text {
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 500;
      line-height: 1.4;
    }

    /* ========== 提交按钮 ========== */
    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 14px 32px;
      font-size: 1rem;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: color 0.25s var(--ease-soft), transform 0.3s var(--ease-bounce);
    }

    .back-link:hover {
      text-decoration: underline;
      transform: translateX(-4px) scale(1.05);
    }

    .back-link:active {
      transform: translateX(-2px) scale(0.95);
      transition: transform 0.1s var(--ease-soft);
    }

    /* ========== 感谢信息 ========== */
    .success-message {
      display: none;
      text-align: center;
      padding: 30px 0;
    }

    .success-message.show { display: block; }

    .success-message .success-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      display: inline-block;
      animation: successBounce 0.9s var(--ease-bounce) both;
    }

    .success-message h2 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 8px;
      animation: fadeInUp 0.5s var(--ease-soft) 0.15s both;
    }

    .success-message p {
      color: var(--text-light);
      margin-bottom: 12px;
      font-size: 1rem;
      animation: fadeInUp 0.5s var(--ease-soft) 0.25s both;
    }

    .success-message .extra-info {
      font-size: 0.9rem;
      color: var(--gold);
      background: var(--gold-bg);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      margin: 12px auto 20px;
      max-width: 400px;
      border: 1px solid var(--gold-light);
      animation: fadeInUp 0.5s var(--ease-soft) 0.4s both;
    }

    .success-message .btn {
      padding: 12px 28px;
      animation: popIn 0.45s var(--ease-bounce) 0.5s both;
    }

    /* ========== 开发者与支持者 ========== */
    .credits-section {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 40px auto 20px;
      max-width: 800px;
      padding: 0 20px;
      width: 100%;
    }

    .credits-card {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.35s var(--ease-bounce), box-shadow 0.3s var(--ease-soft), border-color 0.3s var(--ease-soft);
      border: 2px solid transparent;
      min-width: 220px;
      animation: cardRise 0.55s var(--ease-bounce) 0.4s both;
      will-change: transform;
    }

    .credits-card:nth-child(2) { animation-delay: 0.5s; }

    .credits-card:hover {
      border-color: rgba(220, 107, 130, 0.3);
      box-shadow: var(--shadow-hover);
      transform: translateY(-5px) rotate(-2deg) scale(1.03);
    }

    .credits-card:nth-child(even):hover {
      transform: translateY(-5px) rotate(2deg) scale(1.03);
    }

    .credits-card:active {
      transform: translateY(2px) rotate(0) scale(0.96);
      transition: transform 0.12s var(--ease-soft);
    }

    .credits-card:hover .credits-icon {
      transform: rotate(15deg) scale(1.12);
    }

    .credits-icon {
      width: 48px;
      height: 48px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 50%;
      transition: transform 0.35s var(--ease-bounce);
    }

    .credits-info {
      display: flex;
      flex-direction: column;
      line-height: 1.4;
    }

    .credits-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .credits-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .credits-en {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    /* ========== 动画 ========== */
    @keyframes cardRise {
      0% { opacity: 0; transform: translateY(20px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes checkboxSlide {
      0% { opacity: 0; transform: translateY(-6px); }
      60% { opacity: 1; transform: translateY(2px); }
      100% { transform: translateY(0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      70% { transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes successBounce {
      0% { opacity: 0; transform: scale(0.4) rotate(-20deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(8deg); }
      70% { transform: scale(0.97) rotate(-4deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      .main-content { padding: 20px 16px 0; }
      .feedback-card { padding: 22px 20px; }
      .feedback-card h2 { font-size: 1.35rem; }
      .credits-section {
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .credits-card { min-width: 100%; justify-content: center; }
    }

    @media (max-width: 480px) {
      .feedback-card { padding: 18px 16px; }
      .feedback-card h2 { font-size: 1.2rem; }
      .credits-card { padding: 16px; }
      .credits-icon { width: 40px; height: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== 导航栏 ==================== -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="index.html">🏠 首页</a></li>
      <li><a href="feedback.html" class="active">💬 反馈</a></li>
    </ul>
  </nav>

  <!-- ==================== 主内容 ==================== -->
  <div class="main-content">
    <div class="feedback-card">
      <!-- 表单区域 -->
      <div id="formContainer">
        <h2>💬 意见反馈</h2>
        <p class="desc">我们重视你的每一个建议</p>

        <form id="feedbackForm">
          <!-- 反馈类型 -->
          <div class="form-group">
            <label>反馈类型</label>
            <div class="select-wrapper" id="selectWrapper">
              <button type="button" class="select-trigger" id="selectTrigger">
                <span id="selectedType">请选择反馈类型</span>
                <span class="arrow">▾</span>
              </button>
              <div class="select-dropdown" id="selectDropdown">
                <div class="select-option" data-value="主页">主页</div>
                <div class="select-option" data-value="反馈页">反馈页</div>
                <div class="select-option" data-value="卡片1">卡片1 —— Roblox ID 宝库</div>
                <div class="select-option" data-value="其他">其他</div>
              </div>
            </div>
          </div>

          <!-- 卡片1 专属选项 -->
          <div class="checkbox-list" id="extraOptions">
            <label class="custom-checkbox">
              <input type="checkbox" id="wantThanks">
              <span class="box"></span>
              <span class="label-text">加入鸣谢名单</span>
            </label>
            <label class="custom-checkbox">
              <input type="checkbox" id="uploadQuarantine">
              <span class="box"></span>
              <span class="label-text">上传隔离区ID</span>
            </label>
          </div>

          <!-- 称呼 -->
          <div class="form-group">
            <label for="feedbackName">你的称呼</label>
            <input type="text" id="feedbackName" placeholder="请输入你的名字或昵称" required maxlength="40">
          </div>

          <!-- 邮箱 -->
          <div class="form-group">
            <label for="feedbackEmail">你的邮箱（选填）</label>
            <input type="email" id="feedbackEmail" placeholder="如需回复可留下邮箱">
          </div>

          <!-- 内容 -->
          <div class="form-group">
            <label for="feedbackMessage">反馈内容</label>
            <textarea id="feedbackMessage" placeholder="请详细描述你的建议、问题或想法..." required maxlength="1000"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-submit" id="submitBtn">
            🚀 提交反馈
          </button>
        </form>

        <a href="index.html" class="back-link">← 返回首页</a>
      </div>

      <!-- 感谢信息 -->
      <div class="success-message" id="successMessage">
        <div class="success-icon">🎉</div>
        <h2>提交成功！</h2>
        <p>感谢你的反馈，我们会认真查看每一条建议</p>
        <div class="extra-info" id="extraInfo" style="display:none;"></div>
        <a href="index.html" class="btn btn-primary">🏠 返回首页</a>
      </div>
    </div>

    <!-- 开发者与支持者 -->
    <div class="credits-section">
      <div class="credits-card">
        <img class="credits-icon" src="images/developer.png" alt="开发者图标">
        <div class="credits-info">
          <span class="credits-label">开发者</span>
          <span class="credits-name">织雾满穗</span>
          <span class="credits-en">HuTinJian</span>
        </div>
      </div>
      <div class="credits-card">
        <img class="credits-icon" src="images/deepseek.png" alt="支持者图标">
        <div class="credits-info">
          <span class="credits-label">支持者</span>
          <span class="credits-name">DeepSeek</span>
          <span class="credits-en">AI Assistant</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 页脚 ==================== -->
  <footer class="footer">
    <p>© 2026 织雾满穗 · 用知识照亮世界</p>
  </footer>

  <script src="js/common.js"></script>

  <script>
    /* 版本更新检查 */
    checkPageUpdate('feedback');

    const selectWrapper = document.getElementById('selectWrapper');
    const selectTrigger = document.getElementById('selectTrigger');
    const selectDropdown = document.getElementById('selectDropdown');
    const selectedTypeEl = document.getElementById('selectedType');
    const extraOptions = document.getElementById('extraOptions');
    const wantThanks = document.getElementById('wantThanks');
    const uploadQuarantine = document.getElementById('uploadQuarantine');
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const formContainer = document.getElementById('formContainer');
    const successMessage = document.getElementById('successMessage');
    const extraInfo = document.getElementById('extraInfo');

    let currentType = '';

    /* 下拉展开/收起 */
    selectTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      selectTrigger.classList.toggle('open');
      selectDropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!selectWrapper.contains(e.target)) {
        selectTrigger.classList.remove('open');
        selectDropdown.classList.remove('open');
      }
    });

    /* 选择类型 */
    selectDropdown.querySelectorAll('.select-option').forEach(opt => {
      opt.addEventListener('click', () => {
        selectDropdown.querySelectorAll('.select-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        currentType = opt.dataset.value;
        selectedTypeEl.textContent = opt.textContent;
        selectTrigger.classList.add('selected');

        selectTrigger.classList.remove('open');
        selectDropdown.classList.remove('open');

        /* 仅"卡片1"显示附加选项 */
        if (currentType === '卡片1') {
          extraOptions.classList.add('show');
        } else {
          extraOptions.classList.remove('show');
          wantThanks.checked = false;
          uploadQuarantine.checked = false;
        }
      });
    });

    /* 邮箱校验 */
    function isValidEmail(email) {
      if (!email) return true;
      return /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}$/.test(email);
    }

    /* 读取游客隔离区 */
    function getGuestQuarantine() {
      try {
        const raw = localStorage.getItem('roblox_quarantine_guest');
        if (!raw) return [];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        return arr
          .filter(i => i && i.id)
          .map(i => ({
            id: String(i.id),
            name: String(i.name || '未知歌名').slice(0, 100),
            category: String(i.category || '未分类').slice(0, 30)
          }))
          .slice(0, 500);
      } catch {
        return [];
      }
    }

    /* 提交反馈 */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('feedbackName').value.trim();
      const email = document.getElementById('feedbackEmail').value.trim();
      const message = document.getElementById('feedbackMessage').value.trim();

      if (!currentType) { showToast('请选择反馈类型'); return; }
      if (!name) { showToast('请填写你的称呼'); return; }
      if (!message) { showToast('请填写反馈内容'); return; }
      if (email && !isValidEmail(email)) { showToast('邮箱格式不正确'); return; }

      let quarantineIds = [];
      const willUpload = currentType === '卡片1' && uploadQuarantine.checked;
      if (willUpload) {
        quarantineIds = getGuestQuarantine();
        if (quarantineIds.length === 0) {
          showToast('你的隔离区是空的，无法上传');
          uploadQuarantine.checked = false;
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: currentType,
            name,
            email,
            message,
            wantThanks: currentType === '卡片1' && wantThanks.checked ? 1 : 0,
            uploadQuarantine: willUpload ? 1 : 0,
            quarantineIds
          })
        });

        const data = await res.json();

        if (data.ok) {
          formContainer.style.display = 'none';
          successMessage.classList.add('show');

          if (willUpload && quarantineIds.length > 0) {
            extraInfo.textContent = `📦 已上传 ${quarantineIds.length} 个隔离区 ID，感谢你的贡献！`;
            extraInfo.style.display = 'block';
          }
        } else {
          showToast('提交失败，请稍后重试');
          submitBtn.disabled = false;
          submitBtn.textContent = '🚀 提交反馈';
        }
      } catch (err) {
        showToast('网络异常，请稍后重试');
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 提交反馈';
      }
    });
  </script>
</body>
</html>
