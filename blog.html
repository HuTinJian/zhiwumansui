<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玩家博客 - 织雾满穗</title>

  <meta name="description" content="织雾满穗玩家博客：分享你在 Roblox 里发现的好音乐、好用 ID 和小技巧，也可以提问题和讨论。无需注册，填个昵称就能发。">
  <meta name="theme-color" content="#fdf2f5">

  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('zm_theme');
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <style>
    .blog-wrap { max-width: 820px; margin: 0 auto; padding: 26px 18px 60px; }

    /* ========== 发布卡 ========== */
    .composer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 22px;
      animation: cardRise 0.5s var(--ease-bounce) backwards;
    }
    .composer h2 { font-size: 1.1rem; margin-bottom: 4px; color: var(--text); }
    .composer .hint { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.7; }
    .composer input[type="text"], .composer textarea {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.92rem;
      outline: none;
      transition: border-color var(--dur) var(--ease-soft), box-shadow var(--dur) var(--ease-soft);
    }
    .composer input[type="text"]:focus, .composer textarea:focus {
      border-color: var(--primary);
      box-shadow: var(--shadow-glow);
    }
    .composer textarea { min-height: 104px; resize: vertical; line-height: 1.75; }
    .composer .field { margin-bottom: 10px; position: relative; }
    .composer .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .composer .row .field { flex: 1 1 160px; }
    .composer .counter {
      position: absolute; right: 12px; bottom: 8px;
      font-size: 0.72rem; color: var(--text-muted); pointer-events: none;
    }
    .composer .footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .composer .whoami {
      font-size: 0.78rem; color: var(--text-muted); flex: 1 1 auto;
    }

    /* ========== 工具栏 ========== */
    .blog-toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .blog-toolbar .count { font-size: 0.82rem; color: var(--text-muted); margin-left: auto; }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-light);
      border-radius: var(--radius-pill);
      padding: 7px 15px;
      font-size: 0.82rem;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--dur) var(--ease-soft);
    }
    .chip:hover { border-color: var(--primary-light); color: var(--primary); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ========== 帖子 ========== */
    .post {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: border-color var(--dur) var(--ease-soft), box-shadow var(--dur) var(--ease-soft), transform var(--dur) var(--ease-soft);
      animation: cardRise 0.45s var(--ease-bounce) backwards;
    }
    .post:hover { border-color: var(--primary-light); box-shadow: var(--shadow); }
    .post.flash { border-color: var(--primary); box-shadow: var(--shadow-glow); }

    .post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
      background: linear-gradient(135deg, var(--bg-tint), var(--bg-soft));
      border: 1px solid var(--border);
    }
    .post-who { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
    .post-who .name { font-weight: 700; font-size: 0.9rem; color: var(--text); }
    .post-who .time { font-size: 0.72rem; color: var(--text-muted); }
    .post-head .mine-tag {
      font-size: 0.68rem; font-weight: 700; padding: 2px 9px; border-radius: var(--radius-pill);
      background: var(--bg-tint); color: var(--primary-ink);
    }
    .post-title { font-size: 1.02rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .post-body { font-size: 0.92rem; color: var(--text-light); line-height: 1.85; white-space: pre-wrap; word-break: break-word; }

    .post-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
    .act {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-light);
      border-radius: var(--radius-pill);
      padding: 6px 13px;
      font-size: 0.79rem; font-weight: 600; font-family: var(--font);
      cursor: pointer;
      transition: all var(--dur) var(--ease-soft);
    }
    .act:hover { border-color: var(--primary-light); color: var(--primary); transform: translateY(-1px); }
    .act:active { transform: scale(0.95); }
    .act.liked { background: var(--bg-tint); border-color: var(--primary-light); color: var(--primary); }
    .act.danger:hover { border-color: var(--danger); color: var(--danger); }
    .act[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ========== 回复区 ========== */
    .replies { margin-top: 14px; padding-left: 14px; border-left: 2px solid var(--bg-tint); display: none; }
    .replies.show { display: block; animation: fadeInUp 0.3s var(--ease-soft) both; }
    .reply {
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
    }
    .reply:last-child { border-bottom: none; }
    .reply .r-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .reply .r-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .reply .r-time { font-size: 0.7rem; color: var(--text-muted); }
    .reply .r-body { font-size: 0.86rem; color: var(--text-light); line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
    .reply-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .reply-form input {
      flex: 1 1 200px;
      padding: 9px 13px;
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font); font-size: 0.86rem; outline: none;
    }
    .reply-form input:focus { border-color: var(--primary); }

    .blog-empty {
      text-align: center; padding: 54px 20px; color: var(--text-muted);
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .blog-empty .big { display: block; font-size: 2.4rem; margin-bottom: 10px; }

    @media (max-width: 768px) {
      .blog-wrap { padding: 18px 13px 48px; }
      .composer { padding: 16px; }
      .post { padding: 15px 16px; }
      .post-actions .act { padding: 7px 11px; }
    }
    @media (max-width: 480px) {
      .composer .row { gap: 8px; }
    }
  </style>
</head>

  <!-- ==================== 主内容 ==================== -->
  <main class="blog-wrap" id="main">

    <!-- 发布 -->
    <section class="composer">
      <h2>📝 发一条</h2>
      <p class="hint">
        分享你找到的好音乐、好用的 ID，或者随便聊聊都行。<b>不需要注册</b>，
        填个昵称就能发；发过的帖子会记在这个浏览器上，随时可以自己删掉。
      </p>

      <div class="row">
        <div class="field">
          <input type="text" id="postName" placeholder="你的昵称（最多 20 字）" maxlength="20" autocomplete="nickname">
        </div>
        <div class="field">
          <input type="text" id="postTitle" placeholder="标题（选填，最多 60 字）" maxlength="60">
        </div>
      </div>

      <div class="field">
        <textarea id="postContent" placeholder="写点什么吧…（最多 1000 字）" maxlength="1000"></textarea>
        <span class="counter" id="postCounter">0 / 1000</span>
      </div>

      <div class="footer">
        <button type="button" class="btn btn-primary" id="postBtn" aria-busy="false">🚀 发布</button>
        <span class="whoami" id="whoami"></span>
      </div>
    </section>

    <!-- 工具栏 -->
    <div class="blog-toolbar">
      <button type="button" class="chip active" data-sort="new">🕒 最新</button>
      <button type="button" class="chip" data-sort="hot">🔥 最热</button>
      <button type="button" class="chip" id="refreshBtn">🔄 刷新</button>
      <span class="count" id="postCount"></span>
    </div>

    <!-- 列表 -->
    <div id="postList">
      <div class="blog-empty"><span class="big" aria-hidden="true">⏳</span>正在加载…</div>
    </div>
  </main>

  <!-- ==================== 页脚 ==================== -->
  <footer class="footer">
    <p>© <span id="footerYear">2026</span> 织雾满穗 · 用知识照亮世界</p>
    <div class="footer-links">
      <a href="index.html">首页</a>
      <a href="roblox_music.html">ID 宝库</a>
      <a href="feedback.html">意见反馈</a>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script>
    (function () {
      'use strict';

      var $ = function (id) { return document.getElementById(id); };

      $('footerYear').textContent = new Date().getFullYear();

      /* 版本更新检查：博客页也有自己的公告 */
      checkPageUpdate('blog');

      var CLIENT = getClientId();
      var NAME_KEY = 'zm_blog_name';
      var posts = [];
      var sortMode = 'new';

      /* ---------- 昵称记忆 ---------- */
      try {
        var savedName = localStorage.getItem(NAME_KEY);
        if (savedName) $('postName').value = savedName;
      } catch (e) {}

      $('whoami').textContent = '你的浏览器身份：' + CLIENT.slice(0, 6) + '…（只用来认领你自己的帖子）';

      /* ---------- 小工具 ---------- */
      var AVATARS = ['🎵', '🎧', '🎮', '🌾', '🌸', '⭐', '🔥', '🍀', '🌙', '🐳', '🎹', '🎤'];

      function avatarOf(name) {
        var h = 0, s = String(name || '');
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return AVATARS[h % AVATARS.length];
      }

      /* 数据库存的是 'YYYY-MM-DD HH:MM:SS'（本地时间），Safari 不认这种写法，
         把空格换成 T 才能稳定解析 */
      function parseTime(s) {
        if (!s) return null;
        var d = new Date(String(s).replace(' ', 'T'));
        return isNaN(d.getTime()) ? null : d;
      }

      function timeAgo(s) {
        var d = parseTime(s);
        if (!d) return s || '';
        var diff = Math.floor((Date.now() - d.getTime()) / 1000);
        if (diff < 0) diff = 0;
        if (diff < 60) return '刚刚';
        if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
        if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
        if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
        return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      }

      function sorted(list) {
        var out = list.slice();
        if (sortMode === 'hot') {
          out.sort(function (a, b) {
            return (b.likes * 3 + b.replies * 2) - (a.likes * 3 + a.replies * 2) || b.id - a.id;
          });
        }
        return out;
      }

      /* ---------- 渲染 ---------- */
      function renderEmpty(text) {
        $('postList').innerHTML = '<div class="blog-empty"><span class="big" aria-hidden="true">🌱</span>' +
          escapeHtml(text) + '</div>';
      }

      function renderPosts() {
        var box = $('postList');
        $('postCount').textContent = posts.length ? '共 ' + posts.length + ' 条' : '';

        if (posts.length === 0) {
          renderEmpty('还没有人发帖 —— 你可以是第一个。');
          return;
        }

        var frag = document.createDocumentFragment();

        sorted(posts).forEach(function (p, i) {
          var el = document.createElement('article');
          el.className = 'post';
          el.dataset.id = String(p.id);
          el.style.animationDelay = Math.min(i * 40, 320) + 'ms';

          /* 用 DOM 拼，外部内容一律走 textContent，避免 XSS */
          var head = document.createElement('div');
          head.className = 'post-head';

          var av = document.createElement('span');
          av.className = 'avatar';
          av.setAttribute('aria-hidden', 'true');
          av.textContent = avatarOf(p.name);
          head.appendChild(av);

          var who = document.createElement('div');
          who.className = 'post-who';
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = p.name;
          var tm = document.createElement('span');
          tm.className = 'time';
          tm.textContent = timeAgo(p.createdAt);
          who.appendChild(nm);
          who.appendChild(tm);
          head.appendChild(who);

          if (p.mine) {
            var tag = document.createElement('span');
            tag.className = 'mine-tag';
            tag.textContent = '我发的';
            tag.style.marginLeft = 'auto';
            head.appendChild(tag);
          }
          el.appendChild(head);

          if (p.title) {
            var h = document.createElement('h3');
            h.className = 'post-title';
            h.textContent = p.title;
            el.appendChild(h);
          }

          var body = document.createElement('div');
          body.className = 'post-body';
          body.textContent = p.content;
          el.appendChild(body);

          /* 操作行 */
          var acts = document.createElement('div');
          acts.className = 'post-actions';

          var likeBtn = document.createElement('button');
          likeBtn.type = 'button';
          likeBtn.className = 'act' + (p.liked ? ' liked' : '');
          likeBtn.dataset.act = 'like';
          likeBtn.textContent = (p.liked ? '👍 已赞 ' : '👍 ') + p.likes;
          if (p.liked) likeBtn.disabled = true;
          acts.appendChild(likeBtn);

          var replyBtn = document.createElement('button');
          replyBtn.type = 'button';
          replyBtn.className = 'act';
          replyBtn.dataset.act = 'reply';
          replyBtn.textContent = '💬 回复' + (p.replies ? ' ' + p.replies : '');
          acts.appendChild(replyBtn);

          var reportBtn = document.createElement('button');
          reportBtn.type = 'button';
          reportBtn.className = 'act danger';
          reportBtn.dataset.act = 'report';
          reportBtn.textContent = '⚠️ 举报';
          acts.appendChild(reportBtn);

          if (p.mine) {
            var delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'act danger';
            delBtn.dataset.act = 'delete';
            delBtn.textContent = '🗑️ 删除';
            acts.appendChild(delBtn);
          }
          el.appendChild(acts);

          /* 回复区（点开才加载，省流量） */
          var replies = document.createElement('div');
          replies.className = 'replies';
          replies.id = 'replies-' + p.id;
          el.appendChild(replies);

          frag.appendChild(el);
        });

        box.innerHTML = '';
        box.appendChild(frag);
      }

      async function loadPosts(keepScroll) {
        try {
          var res = await fetch('/api/blog/list?client=' + encodeURIComponent(CLIENT) + '&t=' + Date.now(), { cache: 'no-store' });
          var data = await res.json();
          if (!data || !data.ok) {
            renderEmpty('博客暂时不可用（后端没启用或数据库还没建表）。');
            return;
          }
          posts = Array.isArray(data.data) ? data.data : [];
          renderPosts();
          if (!keepScroll) { /* 首次加载不用滚 */ }
        } catch (e) {
          renderEmpty('博客加载失败，请稍后重试。');
        }
      }

      /* ---------- 回复 ---------- */
      async function toggleReplies(postId, btn) {
        var box = $('replies-' + postId);
        if (!box) return;

        if (box.classList.contains('show')) {
          box.classList.remove('show');
          return;
        }
        if (box.dataset.loaded === '1') {
          box.classList.add('show');
          return;
        }

        box.innerHTML = '<div class="reply"><span class="r-body">加载中…</span></div>';
        box.classList.add('show');

        try {
          var res = await fetch('/api/blog/list?parent=' + postId + '&client=' + encodeURIComponent(CLIENT) + '&t=' + Date.now(), { cache: 'no-store' });
          var data = await res.json();
          var list = (data && data.ok && Array.isArray(data.data)) ? data.data : [];
          renderReplies(box, postId, list);
          box.dataset.loaded = '1';
        } catch (e) {
          box.innerHTML = '<div class="reply"><span class="r-body">回复加载失败</span></div>';
        }
      }

      function renderReplies(box, postId, list) {
        box.innerHTML = '';

        if (list.length === 0) {
          var none = document.createElement('div');
          none.className = 'reply';
          var nb = document.createElement('span');
          nb.className = 'r-body';
          nb.textContent = '还没有人回复，来说两句吧。';
          none.appendChild(nb);
          box.appendChild(none);
        }

        list.forEach(function (r) {
          var el = document.createElement('div');
          el.className = 'reply';

          var head = document.createElement('div');
          head.className = 'r-head';
          var nm = document.createElement('span');
          nm.className = 'r-name';
          nm.textContent = avatarOf(r.name) + ' ' + r.name;
          var tm = document.createElement('span');
          tm.className = 'r-time';
          tm.textContent = timeAgo(r.createdAt);
          head.appendChild(nm);
          head.appendChild(tm);
          el.appendChild(head);

          var body = document.createElement('div');
          body.className = 'r-body';
          body.textContent = r.content;
          el.appendChild(body);

          box.appendChild(el);
        });

        /* 回复输入框 */
        var form = document.createElement('div');
        form.className = 'reply-form';
        var input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '写下你的回复…（最多 500 字）';
        input.maxLength = 500;
        var send = document.createElement('button');
        send.type = 'button';
        send.className = 'btn btn-primary';
        send.textContent = '回复';
        send.onclick = function () { submitReply(postId, input, send, box); };
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); send.click(); }
        });
        form.appendChild(input);
        form.appendChild(send);
        box.appendChild(form);
      }

      async function submitReply(postId, input, btn, box) {
        var text = input.value.trim();
        if (!text) { showToast('回复内容不能为空'); return; }

        var name = $('postName').value.trim();
        if (!name) { showToast('请先在上面填一个昵称'); $('postName').focus(); return; }

        btn.disabled = true;
        btn.textContent = '发送中…';

        try {
          var res = await fetch('/api/blog/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId: CLIENT, name: name, content: text, parentId: postId })
          });
          var data = await res.json();

          if (data && data.ok) {
            rememberName(name);
            input.value = '';
            await reloadReplies(postId, box);
            bumpReplyCount(postId);
            showToast('✅ 回复成功');
          } else {
            showToast(explainError(data));
          }
        } catch (e) {
          showToast('网络异常，请稍后重试');
        }

        btn.disabled = false;
        btn.textContent = '回复';
      }

      async function reloadReplies(postId, box) {
        var res = await fetch('/api/blog/list?parent=' + postId + '&client=' + encodeURIComponent(CLIENT) + '&t=' + Date.now(), { cache: 'no-store' });
        var data = await res.json();
        var list = (data && data.ok && Array.isArray(data.data)) ? data.data : [];
        renderReplies(box, postId, list);
        box.dataset.loaded = '1';
        box.classList.add('show');
      }

      /* 回复成功后只改那一个按钮上的数字，不重画整个列表 ——
         重画会把刚展开的回复区一起关掉，体验很差 */
      function bumpReplyCount(postId) {
        var target = null;
        for (var i = 0; i < posts.length; i++) {
          if (posts[i].id === postId) { posts[i].replies = (posts[i].replies || 0) + 1; target = posts[i]; break; }
        }
        if (!target) return;

        var el = document.querySelector('.post[data-id="' + postId + '"]');
        if (!el) return;
        var btn = el.querySelector('[data-act="reply"]');
        if (btn) btn.textContent = '💬 回复 ' + target.replies;
      }

      function explainError(data) {
        var err = (data && data.error) || '';
        if (err === 'blocked_word') return '⚠️ 内容里含有不适合发布的词：' + ((data && data.word) || '');
        if (err === 'too_many_requests') return '⏳ 发得太快了，休息一会儿再发';
        if (err === 'too_long') return '内容太长了';
        if (err === 'banned') return '🚫 你的浏览器身份已被限制发言';
        if (err === 'parent_gone') return '这条帖子已经被删除了';
        if (err === 'empty content') return '内容不能为空';
        return '发布失败：' + (err || '请稍后重试');
      }

      /* ---------- 发布 ---------- */
      function rememberName(name) {
        try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
      }

      async function publish() {
        var btn = $('postBtn');
        var name = $('postName').value.trim();
        var title = $('postTitle').value.trim();
        var content = $('postContent').value.trim();

        if (!name) { showToast('请先填一个昵称'); $('postName').focus(); return; }
        if (!content) { showToast('内容不能为空'); $('postContent').focus(); return; }

        btn.disabled = true;
        btn.setAttribute('aria-busy', 'true');
        btn.textContent = '⏳ 发布中…';

        try {
          var res = await fetch('/api/blog/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId: CLIENT, name: name, title: title, content: content })
          });
          var data = await res.json();

          if (data && data.ok) {
            rememberName(name);
            $('postContent').value = '';
            $('postTitle').value = '';
            $('postCounter').textContent = '0 / 1000';
            showToast('🎉 发布成功');
            await loadPosts(true);
            var first = document.querySelector('#postList .post');
            if (first) {
              first.classList.add('flash');
              first.scrollIntoView({ behavior: 'smooth', block: 'center' });
              setTimeout(function () { first.classList.remove('flash'); }, 2000);
            }
          } else {
            showToast(explainError(data));
          }
        } catch (e) {
          showToast('网络异常，请稍后重试');
        }

        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
        btn.textContent = '🚀 发布';
      }

      /* ---------- 点赞 / 举报 / 删除 ---------- */
      async function likePost(postId, btn) {
        btn.disabled = true;
        try {
          var res = await fetch('/api/blog/like', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ postId: postId, clientId: CLIENT })
          });
          var data = await res.json();
          if (data && data.ok) {
            btn.classList.add('liked');
            btn.textContent = '👍 已赞 ' + data.likes;
            for (var i = 0; i < posts.length; i++) {
              if (posts[i].id === postId) { posts[i].likes = data.likes; posts[i].liked = true; break; }
            }
            showToast('👍 已点赞');
          } else {
            btn.disabled = false;
            showToast('点赞失败，请稍后重试');
          }
        } catch (e) {
          btn.disabled = false;
          showToast('网络异常');
        }
      }

      async function reportPost(postId, btn) {
        var ok = await showConfirm('举报这条内容', '确认举报吗？如果有人举报同一条内容，它会先自动隐藏，等站长复核。恶意举报同样会被记录。');
        if (!ok) return;

        btn.disabled = true;
        try {
          var res = await fetch('/api/blog/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ postId: postId, clientId: CLIENT })
          });
          var data = await res.json();
          if (data && data.ok) {
            showToast(data.already ? '你已经举报过这条了' : (data.hidden ? '⚠️ 已提交举报，这条内容已被暂时隐藏' : '⚠️ 已提交举报，感谢反馈'));
          } else {
            btn.disabled = false;
            showToast('举报失败，请稍后重试');
          }
        } catch (e) {
          btn.disabled = false;
          showToast('网络异常');
        }
      }

      async function deletePost(postId) {
        var ok = await showConfirm('删除帖子', '确定删除这条帖子吗？它下面的回复也会一起删掉，且无法恢复。');
        if (!ok) return;

        try {
          var res = await fetch('/api/blog/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ postId: postId, clientId: CLIENT })
          });
          var data = await res.json();
          if (data && data.ok) {
            showToast('🗑️ 已删除');
            await loadPosts(true);
          } else {
            showToast('删除失败：' + ((data && data.error) || '请稍后重试'));
          }
        } catch (e) {
          showToast('网络异常');
        }
      }

      /* ---------- 事件委托 ---------- */
      $('postList').addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('[data-act]') : null;
        if (!btn) return;
        var post = btn.closest('.post');
        if (!post) return;
        var id = Number(post.dataset.id);

        var act = btn.dataset.act;
        if (act === 'like') likePost(id, btn);
        else if (act === 'reply') toggleReplies(id, btn);
        else if (act === 'report') reportPost(id, btn);
        else if (act === 'delete') deletePost(id);
      });

      /* ---------- 其它 ---------- */
      $('postContent').addEventListener('input', function () {
        var n = $('postContent').value.length;
        $('postCounter').textContent = n + ' / 1000';
        $('postCounter').style.color = n > 900 ? 'var(--danger)' : '';
      });

      $('postBtn').addEventListener('click', publish);

      document.querySelectorAll('.blog-toolbar .chip[data-sort]').forEach(function (chip) {
        chip.addEventListener('click', function () {
          document.querySelectorAll('.blog-toolbar .chip[data-sort]').forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
          sortMode = chip.dataset.sort;
          renderPosts();
        });
      });

      $('refreshBtn').addEventListener('click', function () {
        showToast('🔄 正在刷新…');
        loadPosts(true);
      });

      loadPosts(false);
    })();
  </script>
</body>
</html>
