<?xml version="1.0" encoding="UTF-8"?>
<!--
  临界 112 · 应用图标（矢量源文件）
  （注意：XML 注释里不能出现连续两个减号，所以本节用等号分隔线）

  设计：深色圆角底（与站点 theme_color #070b12 一致）+ 四段青色调度表盘弧
        + 居中的青色 112 数字。构图全部落在画面中央 80% 内，
        即使被 Android 的 maskable 圆形遮罩裁切，数字也不会被切掉。

  回退办法：本文件是新增文件，删除即可；PNG 由
  .verify/game-test/pwa-icons.mjs 用无头 Edge 从本文件栅格化生成。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-label="临界 112 · 城市应急调度">
  <defs>
    <!-- 顶部青色辉光：模拟指挥台屏幕的反光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="64%">
      <stop offset="0" stop-color="#67dcff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#2b9dff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2b9dff" stop-opacity="0"/>
    </radialGradient>

    <!-- 数字渐变：上亮下深，让 112 有一点金属字牌感 -->
    <linearGradient id="digits" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f6ff"/>
      <stop offset="0.55" stop-color="#67dcff"/>
      <stop offset="1" stop-color="#2b9dff"/>
    </linearGradient>

    <!-- 数字外发光 -->
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#67dcff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. 深色圆角底：与站点背景/主题色一致 -->
  <rect width="512" height="512" rx="104" fill="#070b12"/>

  <!-- 2. 辉光 -->
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- 3. 内描边：白色桌面上也能看出图标轮廓 -->
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none"
        stroke="#67dcff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- 4. 调度表盘：淡色整圈 + 四段亮弧（右上/右下/左下/左上），表示「值班中」 -->
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="192" stroke="#67dcff" stroke-opacity="0.14" stroke-width="8"/>
    <g stroke="#67dcff" stroke-width="10" stroke-opacity="0.9">
      <path d="M321.7 75.6 A192 192 0 0 1 413.3 145.9"/>
      <path d="M436.4 321.7 A192 192 0 0 1 366.1 413.3"/>
      <path d="M190.3 436.4 A192 192 0 0 1 98.7 366.1"/>
      <path d="M75.6 190.3 A192 192 0 0 1 145.9 98.7"/>
    </g>
  </g>

  <!-- 5. 主体：青色 112 -->
  <text x="256" y="324" text-anchor="middle"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="188" font-weight="800" letter-spacing="2"
        fill="url(#digits)" filter="url(#halo)">112</text>
</svg>
