<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 合并工具 - 织雾满穗</title>

  <!-- 登录保护：先藏起来，确认已登录再显示，避免未登录时闪一下工具界面 -->
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>

  <style>
    :root {
      --primary: #dc6b82;
      --primary-dark: #c7546a;
      --primary-light: #f0a3b4;
      --accent: #e88da1;
      --bg: #fdf2f5;
      --bg-card: #ffffff;
      --text: #4a3f44;
      --text-light: #6e5f65;
      --text-muted: #b5a1a8;
      --border: #f0d9de;
      --success: #8cb8a8;
      --success-dark: #72a392;
      --radius: 20px;
      --radius-sm: 14px;
      --shadow: 0 4px 20px rgba(220, 107, 130, 0.08);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    .page-title {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeInUp 0.5s var(--ease-soft) both;
    }
    .page-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .page-title .subtitle {
      color: var(--text-light);
      font-size: 0.88rem;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
      animation: fadeInUp 0.5s var(--ease-soft) both;
    }
    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.10s; }
    .card:nth-child(4) { animation-delay: 0.15s; }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card .hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .upload-box {
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s var(--ease-soft);
      background: #fdf8fa;
      margin-bottom: 12px;
      display: block;
      position: relative;
    }
    .upload-box:hover {
      border-color: var(--primary-light);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 107, 130, 0.08);
    }
    .upload-box.dragover {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.12);
    }
    .upload-box .upload-icon { font-size: 1.7rem; margin-bottom: 6px; }
    .upload-box .upload-text {
      font-size: 0.88rem;
      color: var(--text-light);
      font-weight: 500;
    }
    .upload-box .upload-text strong { color: var(--primary); }
    .upload-box .file-info {
      font-size: 0.8rem;
      color: var(--success-dark);
      margin-top: 6px;
      font-weight: 600;
      min-height: 18px;
    }
    /* 视觉隐藏但保留在 Tab 顺序与无障碍树里（display:none 会把 input 整个摘掉） */
    .upload-box input[type="file"] {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap;
    }
    .upload-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(220,107,130,.12);
    }

    .preview {
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      background: #fdf8fa;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-light);
      white-space: pre;
      word-break: break-all;
    }

    .actions {
      text-align: center;
      margin: 18px 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 30px;
      border: none;
      border-radius: 50px;
      font-family: var(--font);
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s var(--ease-bounce);
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.93); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 6px 16px rgba(220, 107, 130, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(220, 107, 130, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn-success {
      background: linear-gradient(135deg, var(--success), var(--success-dark));
      color: #fff;
      box-shadow: 0 6px 16px rgba(140, 184, 168, 0.25);
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(140, 184, 168, 0.35);
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .stat-item {
      background: linear-gradient(135deg, #fde8ef, #f8d0db);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
    }
    .stat-item .num {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }
    .stat-item .label {
      font-size: 0.76rem;
      color: var(--text-light);
      margin-top: 2px;
    }
    .stat-item.gold {
      background: linear-gradient(135deg, #fbf3e8, #f0e0c8);
    }
    .stat-item.gold .num { color: #d4a06a; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .page-title h1 { font-size: 1.4rem; }
      .card { padding: 16px; }
      .btn { padding: 10px 22px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="page-title">
      <h1>📦 JSON 合并工具</h1>
      <p class="subtitle">把 D1 里的新歌合并到主数据 roblox_music.json</p>
    </div>

    <div class="card">
      <h2>📁 原有数据（data/roblox_music.json）</h2>
      <p class="hint">点下面方框，选择你网站文件夹里的 roblox_music.json；也可以直接把文件拖进去。</p>
      <label class="upload-box" id="uploadBoxA">
        <input type="file" id="fileA" accept=".json,application/json">
        <div class="upload-icon">📂</div>
        <div class="upload-text">点击这里选择 <strong>roblox_music.json</strong></div>
        <div class="upload-text" style="font-size:0.76rem;color:var(--text-muted);margin-top:2px;">（也可以拖拽文件到方框里）</div>
        <div class="file-info" id="fileInfoA"></div>
      </label>
      <div class="preview" id="previewA">等待上传...</div>
    </div>

    <div class="card">
      <h2>📁 D1 导出的新歌（songs_extra_xxx.json）</h2>
      <p class="hint">点下面方框，选择后台刚导出的 songs_extra_xxx.json；也可以直接把文件拖进去。</p>
      <label class="upload-box" id="uploadBoxB">
        <input type="file" id="fileB" accept=".json,application/json">
        <div class="upload-icon">📂</div>
        <div class="upload-text">点击这里选择 <strong>songs_extra_xxx.json</strong></div>
        <div class="upload-text" style="font-size:0.76rem;color:var(--text-muted);margin-top:2px;">（也可以拖拽文件到方框里）</div>
        <div class="file-info" id="fileInfoB"></div>
      </label>
      <div class="preview" id="previewB">等待上传...</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="mergeBtn" disabled>🔀 合并</button>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <h2>✅ 合并结果</h2>
      <div class="result-stats">
        <div class="stat-item">
          <div class="num" id="statOriginal">0</div>
          <div class="label">原有条数</div>
        </div>
        <div class="stat-item gold">
          <div class="num" id="statExtra">0</div>
          <div class="label">新歌条数</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statMerged">0</div>
          <div class="label">合并后总条数</div>
        </div>
        <div class="stat-item gold">
          <div class="num" id="statOverwritten">0</div>
          <div class="label">重复覆盖</div>
        </div>
      </div>
      <div class="preview" id="previewResult" style="max-height:200px;"></div>
      <div class="actions" style="margin-bottom:0;">
        <button class="btn btn-success" id="downloadBtn">💾 下载合并后的 JSON</button>
      </div>
    </div>

  </div>

  <script>
    let dataA = null;
    let dataB = null;
    let merged = null;

    const fileA = document.getElementById('fileA');
    const fileB = document.getElementById('fileB');
    const uploadBoxA = document.getElementById('uploadBoxA');
    const uploadBoxB = document.getElementById('uploadBoxB');
    const fileInfoA = document.getElementById('fileInfoA');
    const fileInfoB = document.getElementById('fileInfoB');
    const previewA = document.getElementById('previewA');
    const previewB = document.getElementById('previewB');
    const mergeBtn = document.getElementById('mergeBtn');
    const resultCard = document.getElementById('resultCard');
    const previewResult = document.getElementById('previewResult');
    const downloadBtn = document.getElementById('downloadBtn');

    function readFile(file, callback) {
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          callback(null, JSON.parse(e.target.result));
        } catch (err) {
          callback(err, null);
        }
      };
      reader.onerror = function () { callback(new Error('读取文件失败'), null); };
      reader.readAsText(file, 'UTF-8');
    }

    function handleFileA(file) {
      readFile(file, function (err, data) {
        if (err) {
          dataA = null;
          fileInfoA.textContent = '';
          previewA.textContent = '等待上传...';
          checkReady();
          alert('❌ 原有数据文件解析失败：' + err.message);
          return;
        }
        if (!Array.isArray(data)) {
          dataA = null;
          fileInfoA.textContent = '';
          previewA.textContent = '等待上传...';
          checkReady();
          alert('❌ 必须是一个 JSON 数组（用 [ ] 包起来）');
          return;
        }
        dataA = data;
        fileInfoA.textContent = '✅ 已加载 ' + data.length + ' 条';
        previewA.textContent = JSON.stringify(data.slice(0, 3), null, 2) + (data.length > 3 ? '\n...' : '');
        checkReady();
      });
    }

    function handleFileB(file) {
      readFile(file, function (err, data) {
        if (err) {
          dataB = null;
          fileInfoB.textContent = '';
          previewB.textContent = '等待上传...';
          checkReady();
          alert('❌ 新歌文件解析失败：' + err.message);
          return;
        }
        if (!Array.isArray(data)) {
          dataB = null;
          fileInfoB.textContent = '';
          previewB.textContent = '等待上传...';
          checkReady();
          alert('❌ 必须是一个 JSON 数组（用 [ ] 包起来）');
          return;
        }
        dataB = data;
        fileInfoB.textContent = '✅ 已加载 ' + data.length + ' 条';
        previewB.textContent = JSON.stringify(data.slice(0, 3), null, 2) + (data.length > 3 ? '\n...' : '');
        checkReady();
      });
    }

    function checkReady() {
      mergeBtn.disabled = !(dataA && dataB);
    }

    fileA.addEventListener('change', function () {
      const file = this.files[0];
      this.value = ''; /* 先清空，重新选同一个文件时才还会触发 change */
      if (file) handleFileA(file);
    });
    fileB.addEventListener('change', function () {
      const file = this.files[0];
      this.value = '';
      if (file) handleFileB(file);
    });

    function setupDragDrop(box, handler) {
      ['dragenter', 'dragover'].forEach(function (evt) {
        box.addEventListener(evt, function (e) {
          e.preventDefault(); e.stopPropagation();
          box.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach(function (evt) {
        box.addEventListener(evt, function (e) {
          e.preventDefault(); e.stopPropagation();
          box.classList.remove('dragover');
        });
      });
      box.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (e.dataTransfer.files[0]) handler(e.dataTransfer.files[0]);
      });
    }
    setupDragDrop(uploadBoxA, handleFileA);
    setupDragDrop(uploadBoxB, handleFileB);

    mergeBtn.addEventListener('click', function () {
      if (!dataA || !dataB) return;
      const map = new Map();

      dataA.forEach(function (item) {
        if (!item || !item.id) return;
        const id = String(item.id);
        map.set(id, {
          id: id,
          name: item.name || '未知歌名',
          category: item.category || '未分类',
          lineIndex: typeof item.lineIndex === 'number' ? item.lineIndex : 0
        });
      });

      const originalCount = map.size;
      let overwritten = 0;
      const inB = new Set(); /* B 文件内部重复的 id 不该算成"覆盖了 A" */

      dataB.forEach(function (item) {
        if (!item || !item.id) return;
        const id = String(item.id);
        if (map.has(id) && !inB.has(id)) overwritten++;
        inB.add(id);
        map.set(id, {
          id: id,
          name: item.name || '未知歌名',
          category: item.category || '未分类',
          lineIndex: typeof item.lineIndex === 'number' ? item.lineIndex : 0
        });
      });

      merged = [...map.values()].sort(function (a, b) {
        return (a.lineIndex || 0) - (b.lineIndex || 0);
      });

      document.getElementById('statOriginal').textContent = originalCount;
      document.getElementById('statExtra').textContent = inB.size;
      document.getElementById('statMerged').textContent = merged.length;
      document.getElementById('statOverwritten').textContent = overwritten;

      previewResult.textContent = JSON.stringify(merged.slice(0, 5), null, 2) + (merged.length > 5 ? '\n...' : '');
      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    downloadBtn.addEventListener('click', function () {
      if (!merged || merged.length === 0) { alert('❌ 合并结果为空，已取消下载'); return; }
      if (!confirm('确定下载并覆盖 data/roblox_music.json 吗？共 ' + merged.length + ' 条')) return;
      const content = JSON.stringify(merged, null, 2);
      const blob = new Blob([content], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'roblox_music.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      alert('✅ 已下载！\n\n接下来：\n1. 覆盖网站文件夹里的 data/roblox_music.json\n2. 重新上传整个网站到 Cloudflare');
    });
  </script>

  <!-- ============================================================
       登录保护：本工具属于后台功能。
       即使有人直接猜到 tools/ 下的地址打开，没登录也只会看到一句提示，
       拿不到工具界面。
       ============================================================ -->
  <script>
  (function () {
    'use strict';

    /* 未登录时用一个友好提示替换整个页面（在后台的 iframe 里也一样适用） */
    function showGate(title, detail) {
      document.documentElement.classList.remove('auth-pending');
      document.body.innerHTML = '';

      var wrap = document.createElement('div');
      wrap.setAttribute('style',
        'min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'text-align:center;padding:40px 24px;line-height:1.8;' +
        "font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#4a3f44;");

      var icon = document.createElement('div');
      icon.setAttribute('style', 'font-size:2.6rem;margin-bottom:10px;');
      icon.textContent = '🔒';

      var t = document.createElement('div');
      t.setAttribute('style', 'font-size:1.05rem;font-weight:700;margin-bottom:8px;');
      t.textContent = title;

      var d = document.createElement('div');
      d.setAttribute('style', 'font-size:0.86rem;color:#8d7c86;max-width:380px;margin-bottom:18px;');
      d.textContent = detail;

      var link = document.createElement('a');
      link.href = '/index.html';
      link.setAttribute('style',
        'display:inline-block;padding:10px 26px;border-radius:50px;text-decoration:none;' +
        'font-weight:600;font-size:0.9rem;color:#fff;' +
        'background:linear-gradient(135deg,#c7546a,#b84460);');
      link.textContent = '返回首页';

      wrap.appendChild(icon);
      wrap.appendChild(t);
      wrap.appendChild(d);
      wrap.appendChild(link);
      document.body.appendChild(wrap);
    }

    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, 6000) : null;

    fetch('/api/auth/check', {
      credentials: 'include',
      cache: 'no-store',
      signal: controller ? controller.signal : undefined
    })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (timer) clearTimeout(timer);
        if (data && data.ok === true) {
          document.documentElement.classList.remove('auth-pending');
          return;
        }
        showGate('这个工具需要先登录后台',
                 '它是后台专用的数据整理工具，请从「后台管理」页进入。');
      })
      .catch(function () {
        if (timer) clearTimeout(timer);
        showGate('暂时无法确认登录状态',
                 '可能是网络问题，或者当前部署没有启用后端接口。');
      });
  })();
  </script>
</body>
</html>
