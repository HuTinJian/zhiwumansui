<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更新公告生成 - 织雾满穗</title>

  <!-- 登录保护：先藏起来，确认已登录再显示，避免未登录时闪一下工具界面 -->
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>

  <style>
    :root {
      --primary: #dc6b82;
      --primary-dark: #c7546a;
      --primary-light: #f0a3b4;
      --accent: #e88da1;
      --bg: #fdf2f5;
      --bg-card: #ffffff;
      --text: #4a3f44;
      --text-light: #6e5f65;
      --text-muted: #b5a1a8;
      --border: #f0d9de;
      --success: #8cb8a8;
      --success-dark: #72a392;
      --danger: #c0392b;
      --radius: 20px;
      --radius-sm: 14px;
      --shadow: 0 4px 20px rgba(220, 107, 130, 0.08);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    .page-title {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeInUp 0.5s var(--ease-soft) both;
    }
    .page-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .page-title .subtitle {
      color: var(--text-light);
      font-size: 0.88rem;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
      animation: fadeInUp 0.5s var(--ease-soft) both;
    }
    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.10s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.20s; }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card .hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .page-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .page-tab {
      padding: 10px 20px;
      border: 2px solid var(--border);
      border-radius: 50px;
      background: #fdf8fa;
      color: var(--text-light);
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s var(--ease-soft);
    }
    .page-tab:hover {
      border-color: var(--primary-light);
      color: var(--primary);
      transform: translateY(-2px);
    }
    .page-tab:active { transform: scale(0.95); }
    .page-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 6px 16px rgba(220, 107, 130, 0.28);
    }
    .page-sub-tabs {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      gap: 8px;
      flex-wrap: wrap;
      animation: fadeInUp 0.3s var(--ease-soft) both;
    }
    .page-sub-tabs.show { display: flex; }
    .page-sub-tabs .page-tab {
      font-size: 0.85rem;
      padding: 8px 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .form-group.full-width { grid-column: 1 / -1; }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-light);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 9px 13px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.88rem;
      background: #fdf8fa;
      color: var(--text);
      outline: none;
      transition: border-color 0.25s var(--ease-soft), box-shadow 0.25s var(--ease-soft);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.7;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.12);
      background: #fff;
    }
    .form-tip {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .preview-wrap {
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding: 8px 0;
    }
    .preview-scaler {
      width: 960px;
      height: 340px;
      transform-origin: top center;
      flex-shrink: 0;
    }

    #canvas {
      width: 960px;
      height: 340px;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #canvas.theme-pink   { background: linear-gradient(135deg, #f0a3b4 0%, #dc6b82 50%, #b84460 100%); }
    #canvas.theme-purple { background: linear-gradient(135deg, #a89ce8 0%, #7b68c7 50%, #5544a6 100%); }
    #canvas.theme-blue   { background: linear-gradient(135deg, #8bc7e8 0%, #5aa5d8 50%, #2d6f9c 100%); }
    #canvas.theme-gold   { background: linear-gradient(135deg, #eed4a8 0%, #d4a06a 50%, #926a3a 100%); }
    #canvas.theme-green  { background: linear-gradient(135deg, #a8d4c0 0%, #72a392 50%, #567a6c 100%); }

    /* 柔光层 */
    #canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,0.20) 0%, transparent 45%),
        radial-gradient(circle at 88% 85%, rgba(255,255,255,0.10) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    /* 网格点纹（中间清晰，边缘淡出） */
    #canvas::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
      -webkit-mask-image: radial-gradient(ellipse at center, transparent 20%, black 80%);
      mask-image: radial-gradient(ellipse at center, transparent 20%, black 80%);
    }

    /* ---- 斜向光带 ---- */
    .light-band {
      position: absolute;
      top: -40%;
      left: 32%;
      width: 180px;
      height: 180%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
      transform: rotate(20deg);
      pointer-events: none;
      z-index: 2;
    }

    /* ---- 两处光晕 ----
       不用 filter: blur()：大面积高斯模糊很吃性能。
       这两处本来就是径向渐变，把渐变的"透明过渡"拉长一点，
       效果几乎一样，但不需要额外一层模糊运算。 */
    .glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .glow-left {
      width: 260px;
      height: 260px;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.06) 45%, transparent 78%);
    }
    .glow-right {
      width: 320px;
      height: 320px;
      right: -80px;
      bottom: -80px;
      background: radial-gradient(circle, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.05) 45%, transparent 78%);
    }

    /* ---- 内边框 + 角部装饰 ---- */
    .canvas-frame {
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      pointer-events: none;
      z-index: 3;
    }
    .canvas-frame::before,
    .canvas-frame::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(255, 235, 200, 0.6);
      border-style: solid;
      border-width: 0;
    }
    .canvas-frame::before {
      top: -1px;
      left: -1px;
      border-top-width: 2px;
      border-left-width: 2px;
      border-top-left-radius: 10px;
    }
    .canvas-frame::after {
      bottom: -1px;
      right: -1px;
      border-bottom-width: 2px;
      border-right-width: 2px;
      border-bottom-right-radius: 10px;
    }
    /* 内边框左右中点的小装饰 */
    .frame-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,235,200,0.5);
      box-shadow: 0 0 8px rgba(255,235,200,0.5);
      z-index: 4;
      pointer-events: none;
    }
    .frame-dot.left {
      left: -3px;
      top: 50%;
      transform: translateY(-50%);
    }
    .frame-dot.right {
      right: -3px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* ---- 上下文字带 ---- */
    .strip {
      position: absolute;
      left: 0; right: 0;
      height: 30px;
      line-height: 30px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 8px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-align: center;
      z-index: 5;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
    }
    .strip-top {
      top: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.10), transparent);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-top: 1px;
    }
    .strip-bottom {
      bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.10), transparent);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 1px;
    }

    /* ---- 稻穗 ---- */
    .wheat-deco {
      position: absolute;
      font-size: 120px;
      line-height: 1;
      z-index: 2;
      pointer-events: none;
      color: #fff;
      opacity: 0.13;
      /* 去掉无意义的 0.3px 模糊：看不出差别，但会白白多一层合成 */
    }
    .wheat-deco.left {
      left: -12px;
      bottom: 20px;
      transform: rotate(-22deg);
      transform-origin: bottom left;
    }
    .wheat-deco.right {
      right: -12px;
      top: 20px;
      transform: rotate(-22deg) scaleX(-1);
      transform-origin: top right;
    }

    /* ---- 漂浮光点 ---- */
    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.7);
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      animation: sparkle 3.4s ease-in-out infinite;
    }
    .sparkle.s1  { top: 42px;    left: 180px;  animation-delay: 0s;    }
    .sparkle.s2  { top: 55px;    left: 360px;  animation-delay: 0.4s;  }
    .sparkle.s3  { top: 48px;    right: 130px; animation-delay: 0.8s;  }
    .sparkle.s4  { top: 58px;    right: 280px; animation-delay: 1.2s;  }
    .sparkle.s5  { bottom: 42px; left: 200px;  animation-delay: 1.6s;  }
    .sparkle.s6  { bottom: 55px; left: 380px;  animation-delay: 2.0s;  }
    .sparkle.s7  { bottom: 48px; right: 140px; animation-delay: 2.4s;  }
    .sparkle.s8  { bottom: 58px; right: 300px; animation-delay: 2.8s;  }
    .sparkle.s9  { top: 155px;   left: 34px;   animation-delay: 3.2s;  }
    .sparkle.s10 { top: 165px;   right: 34px;  animation-delay: 3.6s;  }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50%      { opacity: 1; transform: scale(1); }
    }

    /* ---- 内容区（5 段式） ---- */
    .canvas-inner {
      position: absolute;
      top: 30px;
      bottom: 30px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 44px;
      gap: 26px;
      z-index: 6;
    }

    /* 左块 */
    .left-block {
      flex: 0 1 auto;
      min-width: 0;
      text-align: right;
      color: #fff;
    }
    .left-block .title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 5px;
      line-height: 1.15;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #fff5d8 45%, #ffd98a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter:
        drop-shadow(0 1px 0 rgba(0,0,0,0.20))
        drop-shadow(0 3px 10px rgba(0,0,0,0.25));
    }
    /* gold 主题标题用亮金 */
    #canvas.theme-gold .left-block .title {
      background: linear-gradient(180deg, #ffffff 0%, #fffbf0 55%, #ffeeda 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .left-block .title-rule {
      width: 56px;
      height: 2px;
      margin: 0 0 10px auto;
      background: linear-gradient(90deg, transparent, rgba(255,240,200,0.85), transparent);
      border-radius: 2px;
    }
    .left-block .version-pill {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #fff;
      padding: 6px 16px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 20px;
      white-space: nowrap;
    }

    /* 分隔线 */
    .divider {
      width: 1px;
      height: 52%;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.45), transparent);
      flex-shrink: 0;
    }

    /* 中央圆环 logo */
    .logo-center {
      position: relative;
      flex: 0 0 116px;
      width: 116px;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.38);
      animation: rotate-slow 34s linear infinite;
    }
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16);
    }
    @keyframes rotate-slow {
      from { transform: rotate(0); }
      to   { transform: rotate(360deg); }
    }
    .logo-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.30),
        0 3px 12px rgba(0,0,0,0.35);
      background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.15) 30%, transparent 65%),
        radial-gradient(circle at 50% 55%, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 70%, rgba(0,0,0,0.12) 100%);
      border: 1.5px solid rgba(255,255,255,0.52);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.22),
        0 0 0 6px rgba(255,255,255,0.05),
        inset 0 -6px 15px rgba(0,0,0,0.15),
        inset 0 6px 15px rgba(255,255,255,0.28);
    }

    /* 右块 */
    .right-block {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      color: #fff;
      min-width: 0;
    }
    .right-block .right-line {
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.5;
      padding-left: 18px;
      position: relative;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.22);
      word-break: break-word;
    }
    .right-block .right-line::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    /* ---- 保存栏 ---- */
    .save-bar {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fadeInUp 0.5s var(--ease-soft) 0.2s both;
    }
    .save-bar .btn-save {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 44px;
      border: none;
      border-radius: 50px;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 8px 22px rgba(220, 107, 130, 0.32);
      transition: all 0.3s var(--ease-bounce);
      white-space: nowrap;
      min-width: 220px;
    }
    .save-bar .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(220, 107, 130, 0.42);
    }
    .save-bar .btn-save:active { transform: scale(0.95); }
    .save-bar .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    .save-status {
      width: 100%;
      text-align: center;
      font-size: 0.86rem;
      min-height: 20px;
      font-weight: 600;
    }
    .save-status.ok { color: var(--success-dark); }
    .save-status.err { color: var(--danger); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .page-title h1 { font-size: 1.35rem; }
      .page-title .subtitle { font-size: 0.82rem; }
      .card { padding: 16px; margin-bottom: 12px; }
      .card h2 { font-size: 1rem; }
      .page-tab { padding: 8px 14px; font-size: 0.82rem; }
      .page-sub-tabs .page-tab { font-size: 0.78rem; padding: 7px 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .save-bar .btn-save {
        padding: 12px 30px;
        font-size: 0.95rem;
        min-width: 180px;
        width: 100%;
      }
    }
    @media (max-width: 480px) {
      body { padding: 10px; }
      .page-title h1 { font-size: 1.15rem; }
      .page-title .subtitle { font-size: 0.78rem; }
      .card { padding: 14px; }
      .card h2 { font-size: 0.95rem; }
      .page-tab { padding: 7px 12px; font-size: 0.78rem; }
      .form-group input,
      .form-group select,
      .form-group textarea {
        font-size: 0.85rem;
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="page-title">
      <h1>📢 更新公告生成</h1>
      <p class="subtitle">编辑内容 → 实时预览 → 保存，用户下次打开对应页面就会看到新弹窗</p>
    </div>

    <div class="card">
      <h2>📌 选择目标页面</h2>
      <p class="hint">选择要更新的页面，然后编辑下方内容</p>
      <div class="page-tabs" id="pageTabs">
        <button class="page-tab active" data-page="index">🏠 主页</button>
        <button class="page-tab" data-page="feedback">💬 反馈</button>
        <button class="page-tab" data-page="card">🎮 卡片</button>
      </div>
      <div class="page-sub-tabs" id="cardSubTabs">
        <button class="page-tab active" data-page="roblox">🎵 Roblox ID 宝库</button>
      </div>
    </div>

    <div class="card">
      <h2>✏️ 内容编辑</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>主题色（同时决定左侧主标题）</label>
          <select id="themeInput">
            <option value="theme-pink" selected>🌸 玫瑰 · 日常更新</option>
            <option value="theme-purple">💜 紫罗兰 · 重大更新</option>
            <option value="theme-blue">💙 天青 · 体验优化</option>
            <option value="theme-gold">⭐ 香槟金 · 活动更新</option>
            <option value="theme-green">🌿 苔绿 · 修复更新</option>
          </select>
          <span class="form-tip" id="titlePreviewTip">当前主标题：日常更新</span>
        </div>
        <div class="form-group">
          <label>中央 Logo 文字</label>
          <input type="text" id="logoInput" value="穗" maxlength="2">
        </div>
        <div class="form-group">
          <label>左侧版本号</label>
          <input type="text" id="versionInput" value="v1.5.0 → v1.6.0" maxlength="22">
        </div>
        <div class="form-group full-width">
          <label>右侧更新内容（每行一条，最多 6 行）</label>
          <textarea id="linesInput" maxlength="300" placeholder="每行一条更新内容">🎨 更新弹窗全面升级
✨ 5 种主题色可选
📢 后台可直接生成公告图
🐛 修复部分显示异常</textarea>
          <span class="form-tip" id="linesTip">已输入 4 条，字号 16px</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>👀 实时预览</h2>
      <div class="preview-wrap" id="previewWrap">
        <div class="preview-scaler" id="previewScaler">
          <div id="canvas" class="theme-pink">
            <div class="light-band"></div>
            <div class="glow glow-left"></div>
            <div class="glow glow-right"></div>
            <div class="canvas-frame">
              <div class="frame-dot left"></div>
              <div class="frame-dot right"></div>
            </div>
            <div class="strip strip-top">织雾满穗 · ZHIWU · 织雾满穗 · ZHIWU · 织雾满穗 · ZHIWU · 织雾满穗 · ZHIWU</div>
            <div class="wheat-deco left">🌾</div>
            <div class="wheat-deco right">🌾</div>
            <div class="sparkle s1"></div>
            <div class="sparkle s2"></div>
            <div class="sparkle s3"></div>
            <div class="sparkle s4"></div>
            <div class="sparkle s5"></div>
            <div class="sparkle s6"></div>
            <div class="sparkle s7"></div>
            <div class="sparkle s8"></div>
            <div class="sparkle s9"></div>
            <div class="sparkle s10"></div>
            <div class="canvas-inner">
              <div class="left-block">
                <div class="title" id="canvasTitle">日常更新</div>
                <div class="title-rule"></div>
                <div class="version-pill" id="canvasVersion">v1.5.0 → v1.6.0</div>
              </div>
              <div class="divider"></div>
              <div class="logo-center">
                <div class="logo-ring"></div>
                <div class="logo-circle" id="canvasLogo">穗</div>
              </div>
              <div class="divider"></div>
              <div class="right-block" id="canvasRight"></div>
            </div>
            <div class="strip strip-bottom">织雾满穗 · ZHIWU · 织雾满穗 · ZHIWU · 织雾满穗 · ZHIWU · 织雾满穗 · ZHIWU</div>
          </div>
        </div>
      </div>
    </div>

    <div class="save-bar">
      <button class="btn-save" id="saveBtn">💾 保存并生效</button>
      <div class="save-status" id="saveStatus"></div>
    </div>

  </div>

  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('canvas');
    const previewWrap = $('previewWrap');
    const previewScaler = $('previewScaler');
    const titlePreviewTip = $('titlePreviewTip');
    const linesTip = $('linesTip');
    const cardSubTabs = $('cardSubTabs');

    let currentPage = 'index';
    let dirty = false; /* 有未保存的编辑时为 true */

    const inputs = {
      theme:   $('themeInput'),
      logo:    $('logoInput'),
      version: $('versionInput'),
      lines:   $('linesInput')
    };
    const targets = {
      title:   $('canvasTitle'),
      logo:    $('canvasLogo'),
      version: $('canvasVersion'),
      right:   $('canvasRight')
    };

    const THEME_TITLES = {
      'theme-pink':   '日常更新',
      'theme-purple': '重大更新',
      'theme-blue':   '体验优化',
      'theme-gold':   '活动更新',
      'theme-green':  '修复更新'
    };

    const DEFAULTS = {
      theme: 'theme-pink',
      logo: '穗',
      version: 'v1.5.0 → v1.6.0',
      lines: '🎨 更新弹窗全面升级\n✨ 5 种主题色可选\n📢 后台可直接生成公告图\n🐛 修复部分显示异常'
    };

    function notifyParentHeight() {
      try {
        var h = Math.max(
          document.body.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.scrollHeight,
          document.documentElement.offsetHeight
        );
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'iframe-resize', height: h }, location.origin);
        }
      } catch (e) {}
    }

    function fitCanvas() {
      const w = previewWrap.clientWidth;
      if (w <= 0) return;
      const scale = Math.min(1, w / 960);
      previewScaler.style.transform = `scale(${scale})`;
      previewScaler.style.transformOrigin = 'top center';
      previewScaler.style.width = '960px';
      previewScaler.style.height = '340px';
      previewWrap.style.height = (340 * scale + 16) + 'px'; /* +16 = .preview-wrap 的 padding: 8px 0，否则底部会被裁掉 */
      previewWrap.style.overflow = 'hidden';
      notifyParentHeight();
    }

    function applyTheme(t) { canvas.className = t; }

    function updateAutoTitle() {
      const t = inputs.theme.value;
      const autoTitle = THEME_TITLES[t] || '更新';
      targets.title.textContent = autoTitle;
      if (titlePreviewTip) titlePreviewTip.textContent = '当前主标题：' + autoTitle;
    }

    function getRightFontSize(count) {
      if (count >= 6) return 14;
      if (count === 5) return 15;
      if (count === 4) return 16;
      if (count === 3) return 18;
      return 20;
    }

    function renderRightLines(text) {
      const lines = String(text || '')
        .split('\n')
        .map(s => s.trim())
        .filter(s => s);

      targets.right.innerHTML = '';

      if (lines.length === 0) {
        const div = document.createElement('div');
        div.className = 'right-line';
        div.style.fontSize = '16px';
        div.style.opacity = '0.55';
        div.textContent = '（暂无更新内容）';
        targets.right.appendChild(div);
        if (linesTip) linesTip.textContent = '已输入 0 条';
        notifyParentHeight();
        return;
      }

      const display = lines.slice(0, 6);
      const size = getRightFontSize(display.length);
      display.forEach(line => {
        const div = document.createElement('div');
        div.className = 'right-line';
        div.style.fontSize = size + 'px';
        div.textContent = line;
        targets.right.appendChild(div);
      });

      if (linesTip) {
        const extra = lines.length > 6 ? '（超出 6 行会被截断）' : '';
        linesTip.textContent = `已输入 ${lines.length} 条，字号 ${size}px${extra}`;
      }

      notifyParentHeight();
    }

    inputs.logo.addEventListener('input', function (e) {
      dirty = true;
      targets.logo.textContent = e.target.value || '穗';
    });
    inputs.version.addEventListener('input', function (e) {
      dirty = true;
      /* 清空输入框时回落到默认版本号，预览里的版本胶囊才不会是空的 */
      targets.version.textContent = e.target.value || DEFAULTS.version;
    });
    inputs.lines.addEventListener('input', function (e) {
      dirty = true;
      renderRightLines(e.target.value);
    });
    inputs.theme.addEventListener('change', function (e) {
      dirty = true;
      applyTheme(e.target.value);
      updateAutoTitle();
      notifyParentHeight();
    });

    window.addEventListener('resize', function () {
      fitCanvas();
      notifyParentHeight();
    });
    window.addEventListener('load', function () {
      fitCanvas();
      notifyParentHeight();
    });
    setTimeout(function () { fitCanvas(); notifyParentHeight(); }, 50);
    setTimeout(function () { fitCanvas(); notifyParentHeight(); }, 200);
    setTimeout(function () { fitCanvas(); notifyParentHeight(); }, 600);

    if (window.ResizeObserver) {
      try {
        var ro = new ResizeObserver(function () {
          notifyParentHeight();
        });
        ro.observe(document.body);
      } catch (e) {}
    }

    function collectConfig() {
      let linesValue = inputs.lines.value;
      if (!linesValue || !linesValue.trim()) {
        linesValue = DEFAULTS.lines;
        inputs.lines.value = linesValue;
        renderRightLines(linesValue);
      }
      return {
        theme: inputs.theme.value,
        logo: inputs.logo.value,
        version: inputs.version.value || DEFAULTS.version,
        title: targets.title.textContent,
        lines: linesValue
      };
    }

    function applyConfig(cfg) {
      inputs.theme.value   = cfg.theme   || DEFAULTS.theme;
      inputs.logo.value    = cfg.logo    || DEFAULTS.logo;
      inputs.version.value = cfg.version || DEFAULTS.version;

      if (cfg.lines && String(cfg.lines).trim()) {
        inputs.lines.value = cfg.lines;
      } else if (cfg.line1 || cfg.line2) {
        inputs.lines.value = [cfg.line1 || '', cfg.line2 || ''].filter(s => String(s).trim()).join('\n');
      } else {
        inputs.lines.value = DEFAULTS.lines;
      }

      applyTheme(inputs.theme.value);
      targets.logo.textContent    = inputs.logo.value;
      targets.version.textContent = inputs.version.value;
      renderRightLines(inputs.lines.value);

      if (cfg.title && String(cfg.title).trim()) {
        targets.title.textContent = cfg.title;
        titlePreviewTip.textContent = '当前主标题：' + cfg.title;
      } else {
        updateAutoTitle();
      }

      dirty = false; /* 表单已经被服务端配置覆盖，没有未保存的修改了 */
      setTimeout(function () { fitCanvas(); notifyParentHeight(); }, 50);
    }

    async function loadConfigFromServer(pageKey) {
      try {
        const res = await fetch('/api/updates?page=' + pageKey + '&t=' + Date.now());
        const data = await res.json();
        if (!data.ok || !data.data || !Array.isArray(data.data.updates) || data.data.updates.length === 0) {
          return null;
        }
        const first = data.data.updates[0];
        if (typeof first !== 'string') return null;
        try {
          const cfg = JSON.parse(first);
          if (cfg && typeof cfg === 'object' && cfg.theme) return cfg;
        } catch (e) {}
        return null;
      } catch (e) {
        return null;
      }
    }

    document.querySelectorAll('#pageTabs .page-tab').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (dirty && !confirm('切换页面会丢弃未保存的修改，确定继续？')) return;

        document.querySelectorAll('#pageTabs .page-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const page = btn.dataset.page;

        if (page === 'card') {
          cardSubTabs.classList.add('show');
          const subBtns = cardSubTabs.querySelectorAll('.page-tab');
          subBtns.forEach(b => b.classList.remove('active'));
          const first = subBtns[0];
          if (first) {
            first.classList.add('active');
            currentPage = first.dataset.page;
          }
        } else {
          cardSubTabs.classList.remove('show');
          currentPage = page;
        }

        setStatus('', '');
        /* 请求发出后用户可能又切了页面，回来时用它判断这次结果是否已经过期 */
        const requested = currentPage;
        const cfg = await loadConfigFromServer(requested);
        if (requested !== currentPage) return;
        applyConfig(cfg || DEFAULTS);
      });
    });

    document.querySelectorAll('#cardSubTabs .page-tab').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (dirty && !confirm('切换页面会丢弃未保存的修改，确定继续？')) return;

        document.querySelectorAll('#cardSubTabs .page-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPage = btn.dataset.page;
        setStatus('', '');
        const requested = currentPage;
        const cfg = await loadConfigFromServer(requested);
        if (requested !== currentPage) return;
        applyConfig(cfg || DEFAULTS);
      });
    });

    function setStatus(text, type) {
      const el = $('saveStatus');
      el.textContent = text;
      el.className = 'save-status' + (type ? ' ' + type : '');
    }

    $('saveBtn').addEventListener('click', async function () {
      const btn = this;
      btn.disabled = true;
      btn.textContent = '保存中...';
      setStatus('', '');

      const cfg = collectConfig();
      const realVersion = 'v' + Date.now();

      /* 服务端对 updates 单条有长度上限（目前 2000），先在前端拦下，避免只看到保存失败 */
      const payload = JSON.stringify(cfg);
      if (payload.length > 2000) {
        setStatus('❌ 内容过长（' + payload.length + '/2000），请精简更新内容', 'err');
        btn.disabled = false;
        btn.textContent = '💾 保存并生效';
        return;
      }

      try {
        const res = await fetch('/api/updates', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            page: currentPage,
            version: realVersion,
            updates: [payload]
          })
        });
        const data = await res.json();

        if (data.ok) {
          dirty = false;
          const pageName = { index: '主页', feedback: '反馈', roblox: 'Roblox ID 宝库' }[currentPage] || currentPage;
          setStatus('✅ 已保存到「' + pageName + '」，用户下次打开会看到新弹窗', 'ok');
        } else {
          setStatus('❌ 保存失败：' + (data.error || '未知错误'), 'err');
        }
      } catch (e) {
        setStatus('❌ 网络异常：' + e.message, 'err');
      }

      btn.disabled = false;
      btn.textContent = '💾 保存并生效';
    });

    (async function init() {
      applyConfig(DEFAULTS);
      const requested = currentPage;
      const cfg = await loadConfigFromServer(requested);
      if (requested !== currentPage) return;
      if (cfg) applyConfig(cfg);
      setTimeout(function () { fitCanvas(); notifyParentHeight(); }, 100);
    })();
  </script>

  <!-- ============================================================
       登录保护：本工具属于后台功能。
       即使有人直接猜到 tools/ 下的地址打开，没登录也只会看到一句提示，
       拿不到工具界面。
       ============================================================ -->
  <script>
  (function () {
    'use strict';

    /* 未登录时用一个友好提示替换整个页面（在后台的 iframe 里也一样适用） */
    function showGate(title, detail) {
      document.documentElement.classList.remove('auth-pending');
      document.body.innerHTML = '';

      var wrap = document.createElement('div');
      wrap.setAttribute('style',
        'min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'text-align:center;padding:40px 24px;line-height:1.8;' +
        "font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#4a3f44;");

      var icon = document.createElement('div');
      icon.setAttribute('style', 'font-size:2.6rem;margin-bottom:10px;');
      icon.textContent = '🔒';

      var t = document.createElement('div');
      t.setAttribute('style', 'font-size:1.05rem;font-weight:700;margin-bottom:8px;');
      t.textContent = title;

      var d = document.createElement('div');
      d.setAttribute('style', 'font-size:0.86rem;color:#8d7c86;max-width:380px;margin-bottom:18px;');
      d.textContent = detail;

      var link = document.createElement('a');
      link.href = '/index.html';
      link.setAttribute('style',
        'display:inline-block;padding:10px 26px;border-radius:50px;text-decoration:none;' +
        'font-weight:600;font-size:0.9rem;color:#fff;' +
        'background:linear-gradient(135deg,#c7546a,#b84460);');
      link.textContent = '返回首页';

      wrap.appendChild(icon);
      wrap.appendChild(t);
      wrap.appendChild(d);
      wrap.appendChild(link);
      document.body.appendChild(wrap);
    }

    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, 6000) : null;

    fetch('/api/auth/check', {
      credentials: 'include',
      cache: 'no-store',
      signal: controller ? controller.signal : undefined
    })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (timer) clearTimeout(timer);
        if (data && data.ok === true) {
          document.documentElement.classList.remove('auth-pending');
          return;
        }
        showGate('这个工具需要先登录后台',
                 '它是后台专用的数据整理工具，请从「后台管理」页进入。');
      })
      .catch(function () {
        if (timer) clearTimeout(timer);
        showGate('暂时无法确认登录状态',
                 '可能是网络问题，或者当前部署没有启用后端接口。');
      });
  })();
  </script>
</body>
</html>
