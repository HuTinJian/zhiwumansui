<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识分享平台 - 织雾满穗</title>
  <style>
    /* ========== 全局变量（粉色主题，护眼配色） ========== */
    :root {
      --primary: #dc6b82;          /* 主色：暖粉色 */
      --primary-dark: #c7546a;     /* 深粉，用于悬停 */
      --primary-light: #f0a3b4;    /* 浅粉，用于边框 */
      --secondary: #f8c8d2;        /* 辅助粉 */
      --accent: #e88da1;           /* 强调粉 */
      --bg: #fdf2f5;               /* 页面背景：极浅粉，护眼 */
      --bg-card: #ffffff;          /* 卡片背景：纯白 */
      --text: #4a3f44;             /* 主要文字 */
      --text-light: #6e5f65;       /* 次要文字 */
      --text-muted: #b5a1a8;       /* 辅助文字 */
      --border: #f0d9de;           /* 浅粉边框 */
      --shadow: 0 4px 20px rgba(220, 107, 130, 0.08);
      --shadow-hover: 0 12px 40px rgba(220, 107, 130, 0.15);
      --radius: 20px;
      --radius-sm: 14px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    }

    /* ========== 全局重置 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth; /* 平滑滚动 */
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ========== 顶部导航栏 ========== */
    .navbar {
      position: sticky;           /* 滚动时固定在顶部 */
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); /* 毛玻璃效果 */
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(220, 107, 130, 0.05);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;  /* 链接靠右 */
    }

    .navbar .nav-links {
      display: flex;
      gap: 10px;
      list-style: none;
    }

    .navbar .nav-links a {
      padding: 8px 18px;
      border-radius: 50px;
      text-decoration: none;
      color: var(--text-light);
      font-weight: 500;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .navbar .nav-links a:hover {
      background: rgba(220, 107, 130, 0.1);
      color: var(--primary);
      transform: translateY(-1px);
    }

    /* 当前页面高亮 */
    .navbar .nav-links a.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(220, 107, 130, 0.35);
      font-weight: 600;
    }

    /* ========== 主容器 ========== */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* ========== 搜索区域 ========== */
    .search-section {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeInUp 0.6s ease-out;
    }

    .search-section h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-section .subtitle {
      color: var(--text-light);
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .search-box {
      display: flex;
      align-items: center;
      max-width: 560px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(220, 107, 130, 0.1);
      padding: 6px 6px 6px 20px;
      border: 2px solid transparent;
      transition: var(--transition);
    }

    .search-box:focus-within {
      border-color: var(--primary-light);
      box-shadow: 0 8px 30px rgba(220, 107, 130, 0.2);
    }

    .search-box .search-icon {
      color: var(--text-muted);
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 10px 14px;
      font-size: 1rem;
      font-family: var(--font);
      color: var(--text);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box button {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
      white-space: nowrap;
    }

    .search-box button:hover {
      background: var(--primary-dark);
      box-shadow: 0 6px 16px rgba(220, 107, 130, 0.35);
      transform: translateY(-1px);
    }

    /* 无结果提示 */
    .no-results {
      display: none;
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    .no-results.show {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }

    /* ========== 内容卡片区域 ========== */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      transition: var(--transition);
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    /* 卡片顶部装饰条 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      opacity: 0;
      transition: var(--transition);
    }

    .card:hover {
      box-shadow: 0 12px 40px rgba(220, 107, 130, 0.18);
      transform: translateY(-4px);
      border-color: rgba(220, 107, 130, 0.2);
    }
    .card:hover::before {
      opacity: 1;
    }

    .card .card-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* 分类标签颜色 */
    .card .tag-tech { background: #fde8ef; color: #dc6b82; }
    .card .tag-science { background: #f0e8ff; color: #6c5ce7; }
    .card .tag-art { background: #ffe8ef; color: #fd79a8; }
    .card .tag-life { background: #fff8e8; color: #e17055; }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
      line-height: 1.4;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .card .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 搜索匹配时的高亮边框 */
    .card.highlight-result {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(232, 141, 161, 0.2), var(--shadow-hover);
    }

    /* 搜索关键词高亮 */
    mark {
      background: #ffdae3;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: 600;
    }

    /* ========== 开发者与支持者展示 ========== */
    .credits-section {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 40px auto 20px;
      max-width: 800px;
      padding: 0 20px;
    }

    .credits-card {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: var(--transition);
      border: 2px solid transparent;
      min-width: 220px;
    }

    .credits-card:hover {
      border-color: rgba(220, 107, 130, 0.2);
      box-shadow: 0 12px 40px rgba(220, 107, 130, 0.18);
      transform: translateY(-3px);
    }

    /* 图标图片样式（圆形） */
    .credits-icon {
      width: 48px;
      height: 48px;
      object-fit: cover;          /* 确保图片填充为圆形 */
      flex-shrink: 0;
      border-radius: 50%;         /* 圆形 */
    }

    .credits-info {
      display: flex;
      flex-direction: column;
      line-height: 1.4;
    }

    .credits-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .credits-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .credits-en {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    /* ========== 页脚 ========== */
    .footer {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

    /* ========== 动画 ========== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ========== 响应式设计 ========== */

    /* 平板和手机横屏（768px 以下） */
    @media (max-width: 768px) {
      .navbar { padding: 0 16px; height: 56px; }
      .navbar .nav-links a { padding: 6px 12px; font-size: 0.85rem; }
      .search-section h1 { font-size: 1.8rem; }
      .search-box {
        flex-wrap: nowrap;
        padding: 6px 6px 6px 12px;
        border-radius: 30px;
        margin: 0 16px;
        max-width: 100%;
      }
      .search-box input {
        min-width: 0;
        flex: 1;
        order: 0;
        padding: 10px 8px;
      }
      .search-box button {
        order: 0;
        width: auto;
        margin-top: 0;
        padding: 8px 16px;
        white-space: nowrap;
      }
      .content-grid { grid-template-columns: 1fr; }
      .credits-section { flex-direction: column; align-items: center; gap: 12px; }
      .credits-card { min-width: 100%; justify-content: center; }
    }

    /* 手机竖屏（480px 以下） */
    @media (max-width: 480px) {
      .container { padding: 24px 12px 40px; }
      .search-section h1 { font-size: 1.5rem; }
      .search-section .subtitle { font-size: 0.9rem; }
      .card { padding: 20px; }
      .card h3 { font-size: 1.05rem; }
      .credits-card { padding: 16px; }
      .credits-icon { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>

  <!-- ==================== 顶部导航栏 ==================== -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="index.html" class="active">🏠 首页</a></li>
      <li><a href="feedback.html">💬 反馈</a></li>
    </ul>
  </nav>

  <!-- ==================== 主内容 ==================== -->
  <div class="container">
    <!-- 搜索区域 -->
    <div class="search-section" id="search">
      <h1>织雾满穗</h1>
      <p class="subtitle">织梦疾追星斗近，拨云终揽霁光欣</p>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="输入关键词搜索文章..." autocomplete="off" />
        <button id="searchBtn">搜索</button>
      </div>
      <div class="no-results" id="noResults">
        😕 没有找到匹配的内容，试试其他关键词吧！
      </div>
    </div>

    <!-- 内容卡片列表（目前只有一张卡片） -->
    <div class="content-grid" id="contentGrid">
      <!-- 卡片 1：Roblox ID 宝库（仅音乐ID） -->
      <!-- data-title：卡片标题，用于搜索匹配 -->
      <!-- data-category：分类（游戏） -->
      <!-- data-tags：标签，用于搜索匹配，便于用户搜索相关关键词 -->
      <!-- data-link：点击卡片后跳转的目标页面 -->
      <div class="card" 
           data-title="Roblox ID 宝库" 
           data-category="游戏" 
           data-tags="Roblox 音乐ID 游戏 音乐 代码 宝库" 
           data-link="roblox_music.html">
        <span class="card-tag tag-tech">🎮 游戏</span>
        <h3>Roblox ID 宝库</h3>
        <p>收录数千个 Roblox 游戏内可用的音乐ID，支持一键复制，帮助玩家快速为游戏添加背景音乐或音效。</p>
        <div class="card-meta">📅 持续更新 &nbsp;·&nbsp; ⏱ 点击进入</div>
      </div>
    </div>
  </div>

  <!-- ==================== 开发者与支持者展示 ==================== -->
  <div class="credits-section">
    <!-- 开发者卡片 -->
    <div class="credits-card">
      <!-- 请将 src 改为你实际的开发者图片文件名 -->
      <img class="credits-icon" src="developer.png" alt="开发者图标" />
      <div class="credits-info">
        <span class="credits-label">开发者</span>
        <span class="credits-name">织雾满穗</span>
        <span class="credits-en">HuTinJian</span>
      </div>
    </div>
    <!-- 支持者卡片 -->
    <div class="credits-card">
      <!-- 支持者图标文件名已改为 deepseek.png -->
      <img class="credits-icon" src="deepseek.png" alt="支持者图标" />
      <div class="credits-info">
        <span class="credits-label">支持者</span>
        <span class="credits-name">DeepSeek</span>
        <span class="credits-en">AI Assistant</span>
      </div>
    </div>
  </div>

  <!-- ==================== 页脚 ==================== -->
  <footer class="footer">
    <p>© 2026 织雾满穗 · 用知识照亮世界</p>
  </footer>

  <!-- ==================== JavaScript 逻辑 ==================== -->
  <script>
    // 获取页面元素
    const cards = document.querySelectorAll('.card');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const noResults = document.getElementById('noResults');
    const contentGrid = document.getElementById('contentGrid');

    /**
     * 执行搜索过滤
     * - 检查输入关键词是否出现在卡片的标题、分类、标签或正文中
     */
    function performSearch() {
      const query = searchInput.value.trim().toLowerCase();
      let matchCount = 0;

      cards.forEach(function(card) {
        const title = card.getAttribute('data-title') || '';
        const category = card.getAttribute('data-category') || '';
        const tags = card.getAttribute('data-tags') || '';
        const bodyText = card.querySelector('p') ? card.querySelector('p').textContent : '';
        const searchableText = (title + ' ' + category + ' ' + tags + ' ' + bodyText).toLowerCase();

        if (query === '') {
          card.style.display = '';
          card.classList.remove('highlight-result');
          removeHighlights(card);
          matchCount++;
        } else if (searchableText.includes(query)) {
          card.style.display = '';
          card.classList.add('highlight-result');
          highlightKeyword(card, query);
          matchCount++;
        } else {
          card.style.display = 'none';
          card.classList.remove('highlight-result');
          removeHighlights(card);
        }
      });

      if (matchCount === 0 && query !== '') {
        noResults.classList.add('show');
        contentGrid.style.display = 'none';
      } else {
        noResults.classList.remove('show');
        contentGrid.style.display = '';
      }

      if (query === '') {
        cards.forEach(function(card) {
          card.style.display = '';
          card.classList.remove('highlight-result');
          removeHighlights(card);
        });
        contentGrid.style.display = '';
        noResults.classList.remove('show');
      }
    }

    /**
     * 高亮关键词
     */
    function highlightKeyword(card, keyword) {
      removeHighlights(card);
      const textElements = card.querySelectorAll('h3, p, .card-meta, .card-tag');
      textElements.forEach(function(el) {
        if (el.querySelector('mark')) return;
        const text = el.textContent;
        const lowerText = text.toLowerCase();
        const lowerKeyword = keyword.toLowerCase();

        if (lowerText.includes(lowerKeyword)) {
          const regex = new RegExp('(' + escapeRegex(keyword) + ')', 'gi');
          el.innerHTML = text.replace(regex, '<mark>$1</mark>');
        }
      });
    }

    /**
     * 移除高亮
     */
    function removeHighlights(card) {
      card.querySelectorAll('mark').forEach(function(mark) {
        const parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      });
    }

    /**
     * 转义正则特殊字符
     */
    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // 输入实时搜索
    searchInput.addEventListener('input', performSearch);
    // 点击搜索按钮
    searchBtn.addEventListener('click', function(e) {
      e.preventDefault();
      performSearch();
    });
    // 按回车搜索
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

    // 卡片点击：有链接则跳转
    cards.forEach(function(card) {
      card.addEventListener('click', function() {
        const link = card.getAttribute('data-link');
        if (link) {
          window.location.href = link;
        } else {
          const title = card.getAttribute('data-title');
          alert('📖 你点击了：《' + title + '》\n\n（演示站点：此处可跳转到文章详情页）');
        }
      });
    });

    // 页面加载后自动聚焦搜索框
    window.addEventListener('load', function() {
      searchInput.focus();
    });
  </script>
</body>
</html>
