<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🎵 Roblox 音乐ID 宝库 · 分组管理</title>

    <!-- =============================================================
    样式部分：粉色主题 + 全面适配
    ============================================================= -->
    <style>
        /* ============================================================
           1. 粉色主题 CSS 变量（全局）
           ============================================================ */
        :root {
            /* 主色系 */
            --primary: #dc6b82;
            --primary-dark: #c7546a;
            --primary-light: #f0a3b4;
            --secondary: #f8c8d2;
            --accent: #e88da1;

            /* 背景与卡片 */
            --bg: #fdf2f5;
            --bg-card: #ffffff;

            /* 文字颜色 */
            --text: #4a3f44;
            --text-light: #6e5f65;
            --text-muted: #b5a1a8;

            /* 边框与阴影 */
            --border: #f0d9de;
            --shadow: 0 4px 20px rgba(220, 107, 130, 0.08);
            --shadow-hover: 0 12px 40px rgba(220, 107, 130, 0.15);

            /* 圆角 */
            --radius: 20px;
            --radius-sm: 14px;

            /* 动画 */
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            /* 字体 */
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
        }

        /* ============================================================
           2. 全局重置
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           3. 头部（粉色渐变 + 深色文字）
           ============================================================ */
        .header {
            background: linear-gradient(145deg, #f8d7de, #f0c4cd);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 16px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 10;
            transition: box-shadow var(--transition);
        }

        .header:hover {
            box-shadow: var(--shadow-hover);
        }

        .header-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .header h1 {
            font-size: clamp(18px, 2.8vw, 24px);
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: opacity var(--transition);
            flex: 1 1 auto;
            min-width: 160px;
            color: var(--text);
        }

        .header h1:hover {
            opacity: 0.75;
        }

        .header h1 small {
            font-size: clamp(11px, 1.4vw, 14px);
            font-weight: 400;
            opacity: 0.7;
            margin-left: 8px;
            white-space: nowrap;
            color: var(--text-light);
        }

        /* 统计信息行 */
        .header .stats {
            margin-top: 8px;
            font-size: clamp(12px, 1.2vw, 14px);
            opacity: 0.85;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            color: var(--text);
        }

        .stats .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* 管理按钮（粉色系） */
        .stats .btn-import,
        .stats .btn-danger,
        .stats .btn-success,
        .stats .btn-recycle {
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: clamp(11px, 1vw, 13px);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            gap: 4px;
        }

        .stats .btn-import {
            background: var(--primary);
            color: #fff;
        }
        .stats .btn-import:hover {
            background: var(--primary-dark);
            transform: scale(1.03);
        }

        .stats .btn-danger {
            background: #e8747a;
            color: #fff;
        }
        .stats .btn-danger:hover {
            background: #d45c62;
            transform: scale(1.03);
        }

        .stats .btn-success {
            background: #8cb8a8;
            color: #fff;
        }
        .stats .btn-success:hover {
            background: #72a392;
            transform: scale(1.03);
        }

        .stats .btn-recycle {
            background: #e8b07a;
            color: #fff;
        }
        .stats .btn-recycle:hover {
            background: #d99d62;
            transform: scale(1.03);
        }

        .stats .admin-hint {
            font-size: clamp(10px, 0.9vw, 12px);
            opacity: 0.5;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .stats .admin-hint strong {
            color: var(--primary-dark);
        }

        /* 回收站徽章 */
        #recycleCount {
            font-size: 12px;
            background: var(--primary);
            color: #fff;
            padding: 0 10px;
            border-radius: 30px;
            line-height: 22px;
            display: none;
            font-weight: 500;
        }

        /* ============================================================
           4. 导航栏（毛玻璃胶囊 · 粉色适配）
           ============================================================ */
        .header-nav {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(220, 107, 130, 0.2);
            border-radius: 40px;
            padding: 4px 6px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 12px rgba(220, 107, 130, 0.08);
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .header-nav:hover {
            border-color: rgba(220, 107, 130, 0.35);
            box-shadow: 0 4px 20px rgba(220, 107, 130, 0.12);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: clamp(12px, 1vw, 13px);
            font-weight: 500;
            text-decoration: none;
            transition: all var(--transition);
            height: 30px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(220, 107, 130, 0.12);
            color: var(--text);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(220, 107, 130, 0.05);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        #homeBtn:hover {
            background: rgba(220, 107, 130, 0.18);
        }
        #feedbackBtn:hover {
            background: rgba(140, 184, 168, 0.2);
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(220, 107, 130, 0.15);
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* ============================================================
           5. 搜索栏与筛选
           ============================================================ */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box input {
            flex: 1 1 200px;
            min-width: 160px;
            padding: 10px 18px;
            border: 2px solid var(--border);
            border-radius: 60px;
            font-size: clamp(14px, 1.2vw, 16px);
            background: var(--bg-card);
            color: var(--text);
            transition: all var(--transition);
            outline: none;
            height: 46px;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.12);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .filter-tabs button {
            padding: 6px 14px;
            border: 2px solid var(--border);
            border-radius: 60px;
            background: var(--bg-card);
            font-size: clamp(12px, 1vw, 13px);
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 38px;
            display: inline-flex;
            align-items: center;
        }

        .filter-tabs button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .filter-tabs button:hover:not(.active) {
            border-color: var(--primary-light);
            background: rgba(220, 107, 130, 0.04);
            transform: translateY(-1px);
        }

        .btn-multi {
            background: var(--bg-card);
            color: var(--text-light);
            border: 2px solid var(--border);
            padding: 6px 16px;
            border-radius: 60px;
            font-size: clamp(12px, 1vw, 13px);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 38px;
            display: inline-flex;
            align-items: center;
        }

        .btn-multi.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(220, 107, 130, 0.2);
        }

        .btn-multi:hover:not(.active) {
            border-color: var(--primary-light);
            background: rgba(220, 107, 130, 0.04);
        }

        /* ============================================================
           6. 鸣谢名单（粉色柔和卡片）
           ============================================================ */
        .credit-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            margin-bottom: 16px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }

        .credit-section:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-hover);
        }

        .credit-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px 12px;
            flex-wrap: wrap;
            color: var(--text);
            font-size: clamp(12px, 1vw, 14px);
        }

        .credit-icon {
            font-size: clamp(16px, 1.4vw, 20px);
        }

        .credit-text {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
        }

        .credit-text strong {
            color: var(--primary);
            font-weight: 600;
        }

        .credit-item {
            color: var(--text-light);
            transition: color var(--transition);
        }

        .credit-item:hover {
            color: var(--text);
        }

        .credit-divider {
            color: var(--text-muted);
            user-select: none;
        }

        /* ============================================================
           7. 歌曲分组卡片
           ============================================================ */
        .song-group {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 10px;
            padding: 12px 16px;
            transition: all var(--transition);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .song-group:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        .group-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 12px;
            margin-bottom: 8px;
        }

        .group-name {
            font-size: clamp(16px, 1.6vw, 19px);
            font-weight: 600;
            word-break: break-word;
            flex: 1 1 140px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            color: var(--text);
        }

        .badge-multi {
            background: var(--primary);
            color: #fff;
            font-size: clamp(10px, 0.8vw, 11px);
            font-weight: 600;
            padding: 0 10px;
            border-radius: 30px;
            line-height: 22px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .group-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .group-category {
            font-size: clamp(10px, 0.8vw, 11px);
            background: var(--secondary);
            color: var(--text-light);
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            white-space: nowrap;
            line-height: 22px;
        }

        /* ============================================================
           8. ID 列表
           ============================================================ */
        .id-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        .id-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 12px;
            padding: 4px 6px;
            border-radius: 8px;
            background: rgba(253, 242, 245, 0.4);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }

        .id-row:hover {
            background: rgba(253, 242, 245, 0.8);
        }

        .id-number {
            font-family: 'Courier New', monospace;
            font-size: clamp(13px, 1vw, 15px);
            font-weight: 500;
            color: var(--primary-dark);
            word-break: break-all;
            flex: 1 1 120px;
            min-width: 80px;
            padding: 2px 0;
        }

        .id-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-copy-id {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: clamp(11px, 0.9vw, 13px);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-copy-id:hover {
            background: var(--primary-dark);
            transform: scale(1.03);
        }

        .btn-copy-id:active {
            transform: scale(0.92);
        }

        .btn-copy-id.copied {
            background: #8cb8a8;
        }

        .btn-delete-id {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: clamp(14px, 1vw, 16px);
            cursor: pointer;
            padding: 0 4px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            transition: all var(--transition);
            border-radius: 40px;
        }

        .btn-delete-id:hover {
            color: #d45c62;
            background: rgba(232, 116, 122, 0.12);
            padding: 0 10px;
        }

        .btn-delete-id:active {
            transform: scale(0.85);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        /* ============================================================
           9. 弹窗（通用）
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(74, 63, 68, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-hover);
            animation: modalFadeIn 0.25s ease;
            border: 1px solid var(--border);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-content h2 {
            font-size: clamp(18px, 2vw, 22px);
            margin-bottom: 10px;
            color: var(--text);
        }

        .modal-content textarea {
            flex: 1;
            min-height: 200px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            resize: vertical;
            width: 100%;
            transition: border-color var(--transition);
            background: var(--bg);
            color: var(--text);
        }

        .modal-content textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 8px 22px;
            border: none;
            border-radius: 40px;
            font-size: clamp(14px, 1vw, 16px);
            cursor: pointer;
            transition: all var(--transition);
            min-height: 42px;
            font-weight: 500;
        }

        .modal-actions .btn-confirm {
            background: var(--primary);
            color: #fff;
        }
        .modal-actions .btn-confirm:hover {
            background: var(--primary-dark);
        }

        .modal-actions .btn-cancel {
            background: var(--border);
            color: var(--text);
        }
        .modal-actions .btn-cancel:hover {
            background: #e6c9cf;
        }

        .modal-actions .btn-danger {
            background: #e8747a;
            color: #fff;
        }
        .modal-actions .btn-danger:hover {
            background: #d45c62;
        }

        #importStatus {
            margin-top: 6px;
            font-size: 14px;
            color: #8cb8a8;
            word-break: break-all;
        }

        /* 密码弹窗 */
        .password-modal .modal-content {
            max-width: 400px;
        }

        .password-modal input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            margin: 12px 0;
            transition: border-color var(--transition);
            background: var(--bg);
            color: var(--text);
        }

        .password-modal input[type="password"]:focus {
            border-color: var(--primary);
            outline: none;
        }

        .password-modal .error {
            color: #d45c62;
            font-size: 14px;
            margin-top: 4px;
        }

        /* 回收站弹窗 */
        .recycle-modal .modal-content {
            max-width: 800px;
        }

        .recycle-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            gap: 8px 12px;
        }

        .recycle-item .info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            flex: 1 1 200px;
        }

        .recycle-item .info .name {
            font-weight: 500;
            color: var(--text);
        }

        .recycle-item .info .id {
            color: var(--primary-dark);
            font-family: monospace;
        }

        .recycle-item .info .time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .recycle-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .recycle-actions button {
            padding: 4px 14px;
            border: none;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-weight: 500;
        }

        .recycle-actions .restore-btn {
            background: #8cb8a8;
            color: #fff;
        }
        .recycle-actions .restore-btn:hover {
            background: #72a392;
        }

        .recycle-actions .delete-btn {
            background: rgba(232, 116, 122, 0.12);
            color: #d45c62;
        }
        .recycle-actions .delete-btn:hover {
            background: rgba(232, 116, 122, 0.2);
        }

        .recycle-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
        }

        /* ============================================================
           10. Toast 提示
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg-card);
            padding: 10px 24px;
            border-radius: 60px;
            font-size: clamp(13px, 1vw, 15px);
            box-shadow: var(--shadow-hover);
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
            z-index: 1000;
            text-align: center;
            max-width: 92%;
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
        }

        /* ============================================================
           11. 权限控制
           ============================================================ */
        .admin-only {
            display: none !important;
        }

        .mode-manage .admin-only {
            display: inline-flex !important;
        }
        .mode-manage .btn-delete-id {
            display: inline-flex !important;
        }

        /* ============================================================
           12. 响应式适配
           ============================================================ */

        /* --- 小型手机 (< 400px) --- */
        @media (max-width: 400px) {
            body {
                padding: 6px;
            }
            .header {
                padding: 12px 14px;
            }
            .header h1 {
                font-size: 17px;
                min-width: 120px;
            }
            .header h1 small {
                font-size: 10px;
            }
            .header-top {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .header-nav {
                align-self: flex-start;
                padding: 3px 4px;
            }
            .nav-btn {
                font-size: 11px;
                padding: 4px 10px;
                height: 26px;
            }
            .nav-divider {
                height: 14px;
            }
            .search-box input {
                height: 40px;
                font-size: 15px;
                padding: 8px 14px;
                min-width: 120px;
            }
            .filter-tabs button,
            .btn-multi {
                height: 32px;
                font-size: 11px;
                padding: 4px 10px;
            }
            .song-group {
                padding: 10px 12px;
            }
            .group-name {
                font-size: 15px;
            }
            .id-number {
                font-size: 12px;
                min-width: 60px;
            }
            .btn-copy-id {
                font-size: 11px;
                padding: 2px 10px;
                height: 26px;
            }
            .btn-delete-id {

            </div>

    <!-- =============================================================
    JavaScript 核心逻辑（完整注释）
    ============================================================= -->
    <script>
        /**
         * ============================================================
         * 1. 配置区（您只需修改这些变量）
         * ============================================================
         */
        const USE_EXTERNAL_JSON = true; // true=从外部JSON加载，false=使用硬编码后备
        const EXTERNAL_JSON_URL = 'roblox_music_id.json'; // 外部数据文件
        const DATA_VERSION = 'v5.2'; // 数据版本号（递增可强制刷新用户缓存）
        const ADMIN_PASSWORD = 'HuTinJianZW'; // 管理模式密码

        // 硬编码后备数据（仅用作外部加载失败时的应急）
        const DEFAULT_DATA_JSON = `[
            {"id":"119764702259846","name":"七里香","category":"中文流行","lineIndex":0}
        ]`;

        /**
         * ============================================================
         * 2. 核心数据
         * ============================================================
         */
        let songDatabase = []; // 主数据
        let recycleBin = []; // 回收站
        let isAdmin = false; // 是否管理模式

        /**
         * ============================================================
         * 3. 辅助函数
         * ============================================================
         */

        /** 转义HTML防止XSS */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /** 清洗歌名：去除竖线、括号、末尾标点 */
        function cleanName(name) {
            if (!name) return '未知歌名';
            name = name.replace(/\s*[｜\|]\s*/g, '');
            name = name.replace(/\s*[（(][^）)]*[）)]\s*$/, '');
            name = name.replace(/[，。、：；！？\.,;:!?]+$/, '');
            return name.trim() || '未知歌名';
        }

        /** Toast 提示 */
        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        /**
         * ============================================================
         * 4. 数据加载与持久化
         * ============================================================
         */

        /** 保存数据到 localStorage */
        function saveData() {
            localStorage.setItem('songDB', JSON.stringify(songDatabase));
            localStorage.setItem('recycleBin', JSON.stringify(recycleBin));
            updateRecycleBadge();
        }

        /** 更新回收站徽章 */
        function updateRecycleBadge() {
            const badge = document.getElementById('recycleCount');
            const num = document.getElementById('recycleNum');
            if (recycleBin.length > 0) {
                badge.style.display = 'inline-block';
                num.textContent = recycleBin.length;
            } else {
                badge.style.display = 'none';
            }
        }

        /** 从硬编码加载（后备） */
        function loadHardcodedData() {
            try {
                const raw = JSON.parse(DEFAULT_DATA_JSON);
                const recycleIds = new Set(recycleBin.map(i => i.id));
                songDatabase = raw
                    .filter(i => !recycleIds.has(i.id))
                    .map(i => ({ ...i, name: cleanName(i.name || '未知歌名') }));
                saveData();
                localStorage.setItem('songDBVersion', DATA_VERSION);
                console.log(`✅ 硬编码数据加载成功，共 ${songDatabase.length} 首`);
            } catch (e) {
                console.error('❌ 硬编码数据解析失败:', e);
                songDatabase = [];
            }
            updateRecycleBadge();
            renderAll();
        }

        /** 主加载入口 */
        function loadData() {
            // 加载回收站
            const recycleStored = localStorage.getItem('recycleBin');
            if (recycleStored) {
                try { recycleBin = JSON.parse(recycleStored); } catch (e) { recycleBin = []; }
            }

            // 检查缓存
            const stored = localStorage.getItem('songDB');
            const storedVersion = localStorage.getItem('songDBVersion');
            if (stored && storedVersion === DATA_VERSION) {
                try {
                    songDatabase = JSON.parse(stored);
                    updateRecycleBadge();
                    renderAll();
                    return;
                } catch (e) { /* 缓存损坏，重新加载 */ }
            }

            // 外部加载或硬编码
            if (USE_EXTERNAL_JSON) {
                fetch(EXTERNAL_JSON_URL)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        const recycleIds = new Set(recycleBin.map(i => i.id));
                        songDatabase = data
                            .filter(i => !recycleIds.has(i.id))
                            .map(i => ({ ...i, name: cleanName(i.name || '未知歌名') }));
                        saveData();
                        localStorage.setItem('songDBVersion', DATA_VERSION);
                        console.log(`✅ 外部数据加载成功，共 ${songDatabase.length} 首（跳过回收站 ${recycleBin.length} 个ID）`);
                        updateRecycleBadge();
                        renderAll();
                    })
                    .catch(err => {
                        console.error('❌ 外部JSON加载失败，使用后备数据:', err);
                        loadHardcodedData();
                    });
            } else {
                loadHardcodedData();
            }
        }

        /**
         * ============================================================
         * 5. 模式管理（游客/管理员）
         * ============================================================
         */
        function loadMode() {
            isAdmin = localStorage.getItem('adminMode') === 'true';
            applyMode();
        }

        function applyMode() {
            const container = document.getElementById('appContainer');
            const label = document.getElementById('modeLabel');
            const hint = document.getElementById('modeHint');
            if (isAdmin) {
                container.classList.remove('mode-readonly');
                container.classList.add('mode-manage');
                label.textContent = '管理模式';
                hint.innerHTML = '双击标题 <strong>退出</strong> 管理';
            } else {
                container.classList.remove('mode-manage');
                container.classList.add('mode-readonly');
                label.textContent = '游客模式';
                hint.textContent = '双击标题切换管理';
            }
            updateRecycleBadge();
        }

        /** 双击标题切换 */
        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                localStorage.setItem('adminMode', 'false');
                applyMode();
                showToast('已退出管理模式');
                renderList();
            } else {
                document.getElementById('passwordModal').classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordError').style.display = 'none';
                document.getElementById('passwordInput').focus();
            }
        }

        /** 验证密码 */
        function verifyPassword(pwd) {
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('adminMode', 'true');
                applyMode();
                document.getElementById('passwordModal').classList.remove('show');
                showToast('✅ 已进入管理模式');
                renderList();
            } else {
                document.getElementById('passwordError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        /**
         * ============================================================
         * 6. 回收站操作
         * ============================================================
         */

        /** 移入回收站 */
        function moveToRecycle(name, id) {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            const idx = songDatabase.findIndex(i => i.name === name && i.id === id);
            if (idx === -1) { showToast('⚠️ 未找到该ID'); return; }
            const item = songDatabase[idx];
            if (!confirm(`确定将 ID ${id}（歌名：${name}）移入回收站吗？\n您可以在回收站中恢复它。`)) return;

            songDatabase.splice(idx, 1);
            recycleBin.push({ ...item, deletedAt: new Date().toISOString() });
            saveData();
            showToast(`✅ ID ${id} 已移入回收站`);
            renderAll();
        }

        /** 从回收站恢复 */
        function restoreFromRecycle(id) {
            const idx = recycleBin.findIndex(i => i.id === id);
            if (idx === -1) { showToast('⚠️ 回收站中未找到该ID'); return; }
            const item = recycleBin[idx];
            if (songDatabase.some(i => i.id === id)) {
                showToast('⚠️ 该ID已存在于主列表中，已从回收站删除');
                recycleBin.splice(idx, 1);
                saveData();
                renderRecycleList();
                return;
            }
            recycleBin.splice(idx, 1);
            const maxLine = songDatabase.reduce((m, i) => i.lineIndex > m ? i.lineIndex : m, 0);
            item.lineIndex = maxLine + 1;
            songDatabase.push(item);
            saveData();
            showToast(`✅ 已恢复 ID ${id}（${item.name}）`);
            renderAll();
            renderRecycleList();
        }

        /** 永久删除（不可恢复） */
        function permanentlyDeleteFromRecycle(id) {
            if (!confirm(`确定要永久删除回收站中的 ID ${id} 吗？此操作不可恢复！`)) return;
            const idx = recycleBin.findIndex(i => i.id === id);
            if (idx === -1) return;
            recycleBin.splice(idx, 1);
            saveData();
            showToast(`🗑️ 已永久删除 ID ${id}`);
            renderRecycleList();
            updateRecycleBadge();
        }

        /** 清空回收站 */
        function emptyRecycleBin() {
            if (recycleBin.length === 0) { showToast('回收站已是空的'); return; }
            if (!confirm(`⚠️ 确定要清空回收站吗？将永久删除 ${recycleBin.length} 个ID，此操作不可恢复！`)) return;
            recycleBin = [];
            saveData();
            showToast('🗑️ 回收站已清空');
            renderRecycleList();
            updateRecycleBadge();
        }

        /** 渲染回收站列表 */
        function renderRecycleList() {
            const container = document.getElementById('recycleList');
            const title = document.getElementById('recycleCountTitle');
            if (recycleBin.length === 0) {
                container.innerHTML = '<div class="recycle-empty">回收站是空的 🗑️</div>';
                title.textContent = '(空)';
                return;
            }
            title.textContent = `(${recycleBin.length} 个ID)`;
            const sorted = [...recycleBin].sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt));
            let html = '';
            sorted.forEach(item => {
                const time = item.deletedAt ? new Date(item.deletedAt).toLocaleString() : '未知时间';
                html += `
                    <div class="recycle-item">
                        <div class="info">
                            <span class="name">${escapeHtml(item.name)}</span>
                            <span class="id">${escapeHtml(item.id)}</span>
                            <span class="time">🗑️ ${time}</span>
                        </div>
                        <div class="recycle-actions">
                            <button class="restore-btn" data-id="${escapeHtml(item.id)}">♻️ 恢复</button>
                            <button class="delete-btn" data-id="${escapeHtml(item.id)}">✕ 永久删除</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.restore-btn').forEach(btn => {
                btn.onclick = () => restoreFromRecycle(btn.dataset.id);
            });
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = () => permanentlyDeleteFromRecycle(btn.dataset.id);
            });
        }

        /**
         * ============================================================
         * 7. 导入功能（自动跳过回收站中的ID）
         * ============================================================
         */
        function parseRawText(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            const idSet = new Set();
            const idRegex = /\b(\d{10,})\b/g;
            let lineIndex = 0;
            for (let line of lines) {
                line = line.trim();
                if (!line) { lineIndex++; continue; }
                const ids = line.match(idRegex);
                if (!ids) { lineIndex++; continue; }
                const id = ids[0];
                if (idSet.has(id)) { lineIndex++; continue; }
                idSet.add(id);
                let name = line.replace(id, '').trim();
                name = name.replace(/^[\d]+[\.\、\s]+/, '');
                name = name.replace(/^[\d]+[\s]*[\)）]/, '');
                name = name.replace(/^[\|•·\-\s]+/, '');
                name = name.replace(/[\|•·\-]+$/, '');
                name = cleanName(name);

                let category = '其他';
                const lower = name.toLowerCase();
                if (lower.includes('phonk') || lower.includes('drift') || lower.includes('卡点') || lower.includes('dj'))
                    category = 'Phonk/DJ';
                else if (lower.includes('古风') || lower.includes('国风') || lower.includes('琵琶') || lower.includes(
                        '古筝') ||
                    lower.includes('二胡') || lower.includes('箫') || lower.includes('笛') || lower.includes('琴') ||
                    lower.includes('红昭愿') || lower.includes('牵丝戏') || lower.includes('赤伶')) category = '古风国风';
                else if (lower.includes('搞笑') || lower.includes('音效') || lower.includes('惨叫') || lower.includes(
                        '笑声') ||
                    lower.includes('魔性') || lower.includes('鬼畜') || lower.includes('沙雕') || lower.includes('梗'))
                    category = '搞笑音效';
                else if (lower.includes('周杰伦') || lower.includes('杰伦')) category = '周杰伦';
                else if (lower.includes('英文') || /[a-zA-Z]/.test(name) && !lower.includes('中文')) category = '英文热门';
                else category = '中文流行';

                result.push({ id, name, category, lineIndex });
                lineIndex++;
            }
            return result;
        }

        function importData(rawText) {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            const parsed = parseRawText(rawText);
            if (parsed.length === 0) {
                document.getElementById('importStatus').textContent = '⚠️ 未解析到任何有效条目';
                return;
            }

            const recycleIds = new Set(recycleBin.map(i => i.id));
            const toAdd = parsed.filter(i => !recycleIds.has(i.id));
            const skipped = parsed.length - toAdd.length;

            const existingMap = {};
            songDatabase.forEach(i => { existingMap[i.id] = i; });
            let added = 0,
                updated = 0;
            toAdd.forEach(newItem => {
                if (existingMap[newItem.id]) {
                    const old = existingMap[newItem.id];
                    if (old.name !== newItem.name || old.category !== newItem.category || old.lineIndex !== newItem
                        .lineIndex) {
                        old.name = newItem.name;
                        old.category = newItem.category;
                        old.lineIndex = newItem.lineIndex;
                        updated++;
                    }
                } else {
                    songDatabase.push(newItem);
                    existingMap[newItem.id] = newItem;
                    added++;
                }
            });

            saveData();
            let msg = `✅ 导入完成！新增 ${added} 首，更新 ${updated} 首`;
            if (skipped > 0) msg += `，跳过 ${skipped} 个已在回收站中的ID`;
            document.getElementById('importStatus').textContent = msg;
            renderAll();
            setTimeout(() => document.getElementById('importModal').classList.remove('show'), 1500);
        }

        /**
         * ============================================================
         * 8. 其他管理员操作
         * ============================================================
         */
        function clearAllData() {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            if (!confirm('⚠️ 确定要清空所有数据吗？此操作不可恢复！')) return;
            songDatabase = [];
            recycleBin = [];
            saveData();
            renderAll();
            showToast('已清空所有数据');
        }

        function exportData() {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            const blob = new Blob([JSON.stringify(songDatabase, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `roblox_ids_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        /**
         * ============================================================
         * 9. 渲染引擎
         * ============================================================
         */
        let currentCategory = 'all';
        let currentKeyword = '';
        let showMultiOnly = false;

        function renderAll() {
            // 统计
            const uniqueNames = new Set(songDatabase.map(i => i.name));
            document.getElementById('totalGroupCount').textContent = uniqueNames.size;
            document.getElementById('totalIdCount').textContent = songDatabase.length;

            const nameCountMap = {};
            songDatabase.forEach(i => { nameCountMap[i.name] = (nameCountMap[i.name] || 0) + 1; });
            let multiCount = Object.values(nameCountMap).filter(c => c > 1).length;
            document.getElementById('multiGroupCount').textContent = multiCount;

            // 分类按钮
            const tabsContainer = document.getElementById('categoryTabs');
            while (tabsContainer.children.length > 1) tabsContainer.removeChild(tabsContainer.lastChild);
            const categories = new Set(songDatabase.map(i => i.category));
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.dataset.cat = cat;
                btn.textContent = cat;
                btn.setAttribute('role', 'tab');
                tabsContainer.appendChild(btn);
            });

            const allBtns = tabsContainer.querySelectorAll('button');
            allBtns.forEach(btn => {
                btn.onclick = function() {
                    const cat = this.dataset.cat;
                    if (cat === 'all') {
                        if (showMultiOnly) {
                            showMultiOnly = false;
                            document.getElementById('multiToggleBtn').classList.remove('active');
                        }
                        currentCategory = 'all';
                    } else {
                        currentCategory = cat;
                    }
                    allBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderList();
                };
            });
            allBtns.forEach(b => {
                if (b.dataset.cat === currentCategory) b.classList.add('active');
                else b.classList.remove('active');
            });

            // 搜索
            document.getElementById('searchInput').oninput = function() {
                currentKeyword = this.value;
                renderList();
            };

            // 多ID切换
            const multiBtn = document.getElementById('multiToggleBtn');
            multiBtn.onclick = function() {
                showMultiOnly = !showMultiOnly;
                this.classList.toggle('active');
                this.setAttribute('aria-pressed', showMultiOnly);
                renderList();
            };
            if (showMultiOnly) {
                multiBtn.classList.add('active');
                multiBtn.setAttribute('aria-pressed', 'true');
            }

            renderList();
        }

        function renderList() {
            const keyword = currentKeyword.trim().toLowerCase();

            // 过滤
            let filtered = songDatabase.filter(item => {
                const catMatch = currentCategory === 'all' || item.category === currentCategory;
                const kwMatch = !keyword || item.name.toLowerCase().includes(keyword) || item.id.includes(keyword);
                return catMatch && kwMatch;
            });

            // 分组
            const groupMap = {};
            filtered.forEach(item => {
                if (!groupMap[item.name]) {
                    groupMap[item.name] = { name: item.name, ids: [], categories: new Set(), firstLine: Infinity };
                }
                groupMap[item.name].ids.push(item.id);
                groupMap[item.name].categories.add(item.category);
                if (item.lineIndex < groupMap[item.name].firstLine) {
                    groupMap[item.name].firstLine = item.lineIndex;
                }
            });

            let groups = Object.values(groupMap);
            groups.sort((a, b) => a.firstLine - b.firstLine);

            if (showMultiOnly) {
                groups = groups.filter(g => g.ids.length > 1);
            }

            const container = document.getElementById('songListContainer');
            const empty = document.getElementById('emptyState');

            if (groups.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            let html = '';
            groups.forEach(group => {
                const catStr = Array.from(group.categories).join(' / ');
                const safeName = escapeHtml(group.name);
                const isMulti = group.ids.length > 1;

                let nameHtml = safeName;
                if (isMulti) nameHtml += ` <span class="badge-multi">多ID</span>`;

                let rowsHtml = '';
                group.ids.forEach(id => {
                    rowsHtml += `
                        <div class="id-row">
                            <span class="id-number">${escapeHtml(id)}</span>
                            <div class="id-actions">
                                <button class="btn-copy-id" data-id="${escapeHtml(id)}">📋 复制</button>
                                <button class="btn-delete-id admin-only" data-name="${safeName}" data-id="${escapeHtml(id)}" title="移入回收站">✕</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="song-group" data-group-name="${safeName}">
                        <div class="group-header">
                            <div class="group-name">${nameHtml}</div>
                            <div class="group-right">
                                <span class="group-category">${escapeHtml(catStr)}</span>
                            </div>
                        </div>
                        <div class="id-list">${rowsHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // 事件委托
            container.onclick = function(e) {
                const target = e.target.closest('button');
                if (!target) return;

                if (target.classList.contains('btn-copy-id')) {
                    e.stopPropagation();
                    copyToClipboard(target.dataset.id, target);
                    showToast('✅ 已复制ID，可搜索歌名查看所有版本');
                    return;
                }

                if (target.classList.contains('btn-delete-id')) {
                    e.stopPropagation();
                    moveToRecycle(target.dataset.name, target.dataset.id);
                    return;
                }
            };
        }

        /**
         * ============================================================
         * 10. 复制功能
         * ============================================================
         */
        function copyToClipboard(text, btn) {
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text).then(() => showCopiedFeedback(btn))
                    .catch(() => fallbackCopy(text, btn));
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showCopiedFeedback(btn);
            } catch (e) {
                alert('复制失败，请手动复制: ' + text);
            }
            document.body.removeChild(ta);
        }

        function showCopiedFeedback(btn) {
            const orig = btn.textContent;
            btn.textContent = '✅ 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = orig;
                btn.classList.remove('copied');
            }, 1500);
        }

        /**
         * ============================================================
         * 11. 初始化
         * ============================================================
         */
        document.addEventListener('DOMContentLoaded', function() {
            loadMode();
            loadData();

            // 双击标题
            document.getElementById('mainTitle').addEventListener('dblclick', toggleAdminMode);

            // 导入
            document.getElementById('openImportBtn').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                document.getElementById('importModal').classList.add('show');
                document.getElementById('rawText').value = '';
                document.getElementById('importStatus').textContent = '';
            });
            document.getElementById('cancelImport').addEventListener('click', function() {
                document.getElementById('importModal').classList.remove('show');
            });
            document.getElementById('confirmImport').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                const raw = document.getElementById('rawText').value;
                if (!raw.trim()) {
                    document.getElementById('importStatus').textContent = '⚠️ 请粘贴数据';
                    return;
                }
                importData(raw);
            });

            // 回收站
            document.getElementById('openRecycleBtn').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                document.getElementById('recycleModal').classList.add('show');
                renderRecycleList();
            });
            document.getElementById('closeRecycleBtn').addEventListener('click', function() {
                document.getElementById('recycleModal').classList.remove('show');
            });
            document.getElementById('emptyRecycleBtn').addEventListener('click', emptyRecycleBin);
            document.getElementById('recycleModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });

            // 导出 & 清空
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('clearAllBtn').addEventListener('click', clearAllData);

            // 密码弹窗
            document.getElementById('cancelPassword').addEventListener('click', function() {
                document.getElementById('passwordModal').classList.remove('show');
                document.getElementById('passwordError').style.display = 'none';
            });
            document.getElementById('confirmPassword').addEventListener('click', function() {
                verifyPassword(document.getElementById('passwordInput').value);
            });
            document.getElementById('passwordInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('confirmPassword').click();
            });
            document.getElementById('passwordModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                    document.getElementById('passwordError').style.display = 'none';
                }
            });

            // 导入弹窗外部关闭
            document.getElementById('importModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });
        });
    </script>
</body>
