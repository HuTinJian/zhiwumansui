<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🎵 Roblox 音乐ID 宝库 · 分组管理</title>

    <style>
        /* ============================================================
           1. 全局主题颜色（粉色护眼系）
           ============================================================ */
        :root {
            --primary: #dc6b82;
            --primary-dark: #c7546a;
            --primary-light: #f0a3b4;
            --secondary: #f8c8d2;
            --bg: #fdf2f5;
            --bg-card: #ffffff;
            --text: #3d2f34;
            --text-light: #5e4a50;
            --text-muted: #b5a1a8;
            --border: #f0d9de;
            --shadow: 0 4px 20px rgba(220, 107, 130, 0.08);
            --shadow-hover: 0 12px 40px rgba(220, 107, 130, 0.15);
            --radius: 20px;
            --radius-sm: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           2. 页面头部（两行布局，无计数徽章）
           ============================================================ */
        .header {
            background: linear-gradient(145deg, #f8d7de, #f0c4cd);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 16px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition);
        }

        .header:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ---- 第一行：标题 + 统计 + 导航（含双击提示） ---- */
        .header-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 20px;
        }

        .header h1 {
            font-size: clamp(18px, 2.8vw, 24px);
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: opacity var(--transition);
            flex: 0 0 auto;
            color: var(--text);
        }

        .header h1:hover {
            opacity: 0.75;
        }

        .header h1 small {
            font-size: clamp(11px, 1.4vw, 14px);
            font-weight: 400;
            opacity: 0.7;
            margin-left: 8px;
            white-space: nowrap;
            color: var(--text-light);
        }

        /* 统计信息（组/ID/多ID） */
        .header-stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            font-size: clamp(12px, 1.2vw, 14px);
            color: var(--text);
            flex: 1 1 auto;
            justify-content: flex-start;
        }

        /* 导航 + 双击提示 容器（右侧） */
        .header-nav-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            margin-left: auto;
        }

        /* 导航栏毛玻璃 */
        .header-nav {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(220, 107, 130, 0.2);
            border-radius: 40px;
            padding: 4px 6px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 12px rgba(220, 107, 130, 0.08);
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .header-nav:hover {
            border-color: rgba(220, 107, 130, 0.35);
            box-shadow: 0 4px 20px rgba(220, 107, 130, 0.12);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: clamp(12px, 1vw, 13px);
            font-weight: 500;
            text-decoration: none;
            transition: all var(--transition);
            height: 30px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(220, 107, 130, 0.12);
            color: var(--text);
            transform: translateY(-1px);
        }

        #homeBtn:hover {
            background: rgba(220, 107, 130, 0.18);
        }
        #feedbackBtn:hover {
            background: rgba(140, 184, 168, 0.2);
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(220, 107, 130, 0.15);
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* 双击提示文字（白底半透明） */
        .admin-hint {
            font-size: clamp(12px, 1.1vw, 14px);
            font-weight: 500;
            color: #fff;
            background: rgba(220, 107, 130, 0.25);
            padding: 2px 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .admin-hint strong {
            color: #fff;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.15);
            padding: 0 6px;
            border-radius: 20px;
        }

        /* ---- 第二行：管理按钮（顺序：导入、导出、清空、回收站、隔离区、批量删除） ---- */
        .header-actions {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            border-top: 1px solid rgba(220, 107, 130, 0.2);
            padding-top: 12px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* 所有管理按钮统一样式 */
        .btn-group .btn-import,
        .btn-group .btn-danger,
        .btn-group .btn-success,
        .btn-group .btn-recycle,
        .btn-group .btn-quarantine,
        .btn-group .btn-batch {
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: clamp(11px, 1vw, 13px);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            gap: 4px;
        }

        .btn-group .btn-import {
            background: var(--primary);
            color: #fff;
        }
        .btn-group .btn-import:hover {
            background: var(--primary-dark);
            transform: scale(1.03);
        }

        .btn-group .btn-danger {
            background: #e8747a;
            color: #fff;
        }
        .btn-group .btn-danger:hover {
            background: #d45c62;
            transform: scale(1.03);
        }

        .btn-group .btn-success {
            background: #8cb8a8;
            color: #fff;
        }
        .btn-group .btn-success:hover {
            background: #72a392;
            transform: scale(1.03);
        }

        .btn-group .btn-recycle {
            background: #e8b07a;
            color: #fff;
        }
        .btn-group .btn-recycle:hover {
            background: #d99d62;
            transform: scale(1.03);
        }

        .btn-group .btn-quarantine {
            background: #f472b6;
            color: #fff;
        }
        .btn-group .btn-quarantine:hover {
            background: #ec4899;
            transform: scale(1.03);
        }

        .btn-group .btn-batch {
            background: #a78bfa;
            color: #fff;
        }
        .btn-group .btn-batch:hover {
            background: #8b5cf6;
            transform: scale(1.03);
        }
        .btn-group .btn-batch.active {
            background: var(--primary-dark);
            box-shadow: 0 0 0 2px rgba(199, 84, 106, 0.3);
        }

        /* ============================================================
           3. 搜索与筛选
           ============================================================ */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box input {
            flex: 1 1 200px;
            min-width: 160px;
            padding: 10px 18px;
            border: 2px solid var(--border);
            border-radius: 60px;
            font-size: clamp(14px, 1.2vw, 16px);
            background: var(--bg-card);
            color: var(--text);
            transition: all var(--transition);
            outline: none;
            height: 46px;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.12);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .filter-tabs button {
            padding: 6px 14px;
            border: 2px solid var(--border);
            border-radius: 60px;
            background: var(--bg-card);
            font-size: clamp(12px, 1vw, 13px);
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 38px;
            display: inline-flex;
            align-items: center;
        }

        .filter-tabs button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .filter-tabs button:hover:not(.active) {
            border-color: var(--primary-light);
            background: rgba(220, 107, 130, 0.04);
            transform: translateY(-1px);
        }

        /* 多ID切换按钮 */
        .btn-multi {
            background: var(--bg-card);
            color: var(--text-light);
            border: 2px solid var(--border);
            padding: 6px 16px;
            border-radius: 60px;
            font-size: clamp(12px, 1vw, 13px);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 38px;
            display: inline-flex;
            align-items: center;
        }

        .btn-multi.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(220, 107, 130, 0.2);
        }

        .btn-multi:hover:not(.active) {
            border-color: var(--primary-light);
            background: rgba(220, 107, 130, 0.04);
        }

        /* ============================================================
           4. 鸣谢区域
           ============================================================ */
        .credit-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            margin-bottom: 16px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }

        .credit-section:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-hover);
        }

        .credit-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px 12px;
            flex-wrap: wrap;
            color: var(--text);
            font-size: clamp(12px, 1vw, 14px);
        }

        .credit-icon {
            font-size: clamp(16px, 1.4vw, 20px);
        }

        .credit-text {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
        }

        .credit-text strong {
            color: var(--primary);
            font-weight: 600;
        }
        .credit-item {
            color: var(--text-light);
            transition: color var(--transition);
        }
        .credit-item:hover {
            color: var(--text);
        }
        .credit-divider {
            color: var(--text-muted);
            user-select: none;
        }

        /* ============================================================
           5. 歌曲分组卡片
           ============================================================ */
        .song-group {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 10px;
            padding: 12px 16px;
            transition: all var(--transition);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .song-group:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        .group-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 12px;
            margin-bottom: 8px;
        }

        .group-name {
            font-size: clamp(16px, 1.6vw, 19px);
            font-weight: 600;
            word-break: break-word;
            flex: 1 1 140px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            color: var(--text);
        }

        .badge-multi {
            background: var(--primary);
            color: #fff;
            font-size: clamp(10px, 0.8vw, 11px);
            font-weight: 600;
            padding: 0 10px;
            border-radius: 30px;
            line-height: 22px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .group-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .group-category {
            font-size: clamp(10px, 0.8vw, 11px);
            background: var(--secondary);
            color: var(--text-light);
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            white-space: nowrap;
            line-height: 22px;
        }

        /* ============================================================
           6. ID 列表
           ============================================================ */
        .id-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        .id-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            padding: 4px 6px;
            border-radius: 8px;
            background: rgba(253, 242, 245, 0.4);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }

        .id-row:hover {
            background: rgba(253, 242, 245, 0.8);
        }

        .id-checkbox {
            display: none;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .batch-mode .id-checkbox {
            display: inline-block;
        }

        .id-number {
            font-family: 'Courier New', monospace;
            font-size: clamp(13px, 1vw, 15px);
            font-weight: 500;
            color: var(--primary-dark);
            word-break: break-all;
            flex: 1 1 120px;
            min-width: 80px;
            padding: 2px 0;
        }

        .id-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-copy-id {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: clamp(11px, 0.9vw, 13px);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-copy-id:hover {
            background: var(--primary-dark);
            transform: scale(1.03);
        }
        .btn-copy-id:active {
            transform: scale(0.92);
        }
        .btn-copy-id.copied {
            background: #8cb8a8;
        }

        .btn-delete-id {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: clamp(14px, 1vw, 16px);
            cursor: pointer;
            padding: 0 4px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            transition: all var(--transition);
            border-radius: 40px;
        }

        .btn-delete-id:hover {
            color: #d45c62;
            background: rgba(232, 116, 122, 0.12);
            padding: 0 10px;
        }
        .btn-delete-id:active {
            transform: scale(0.85);
        }

        /* ============================================================
           7. 批量操作栏（主列表）
           ============================================================ */
        .batch-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--primary-light);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .batch-bar.show {
            display: flex;
        }

        .batch-bar .info {
            font-size: 14px;
            color: var(--text-light);
        }
        .batch-bar .info strong {
            color: var(--text);
        }

        .batch-bar .actions {
            display: flex;
            gap: 8px;
        }

        .batch-bar .actions button {
            padding: 4px 16px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .batch-bar .actions .btn-batch-delete {
            background: #e8747a;
            color: #fff;
        }
        .batch-bar .actions .btn-batch-delete:hover {
            background: #d45c62;
            transform: scale(1.02);
        }

        .batch-bar .actions .btn-batch-clear {
            background: var(--border);
            color: var(--text);
        }
        .batch-bar .actions .btn-batch-clear:hover {
            background: #e6c9cf;
        }

        /* ============================================================
           8. 弹窗（通用）
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(74, 63, 68, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-hover);
            animation: modalFadeIn 0.25s ease;
            border: 1px solid var(--border);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-content h2 {
            font-size: clamp(18px, 2vw, 22px);
            margin-bottom: 10px;
            color: var(--text);
        }

        .modal-content p {
            color: var(--text-light);
            font-size: 15px;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 8px 22px;
            border: none;
            border-radius: 40px;
            font-size: clamp(14px, 1vw, 16px);
            cursor: pointer;
            transition: all var(--transition);
            min-height: 42px;
            font-weight: 500;
        }

        .modal-actions .btn-confirm {
            background: var(--primary);
            color: #fff;
        }
        .modal-actions .btn-confirm:hover {
            background: var(--primary-dark);
        }

        .modal-actions .btn-cancel {
            background: var(--border);
            color: var(--text);
        }
        .modal-actions .btn-cancel:hover {
            background: #e6c9cf;
        }

        .modal-actions .btn-danger {
            background: #e8747a;
            color: #fff;
        }
        .modal-actions .btn-danger:hover {
            background: #d45c62;
        }

        /* ---- 密码输入框 ---- */
        .password-modal .modal-content {
            max-width: 400px;
        }

        .password-modal input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            margin: 12px 0;
            transition: border-color var(--transition), box-shadow var(--transition);
            background: var(--bg);
            color: var(--text);
            outline: none;
        }

        .password-modal input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.15);
        }

        .password-modal input[type="password"]::placeholder {
            color: var(--text-muted);
        }

        .password-modal .error {
            color: #d45c62;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ---- 导入弹窗文本框 ---- */
        .import-modal .modal-content textarea {
            width: 100%;
            min-height: 260px;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            transition: border-color var(--transition), box-shadow var(--transition);
            resize: vertical;
            outline: none;
            margin: 12px 0;
            line-height: 1.6;
        }

        .import-modal .modal-content textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220, 107, 130, 0.15);
        }

        .import-modal .modal-content textarea::placeholder {
            color: var(--text-muted);
        }

        /* ---- 回收站弹窗 ---- */
        .recycle-modal .modal-content {
            max-width: 800px;
        }

        .recycle-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            gap: 8px 12px;
        }

        .recycle-item .info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            flex: 1 1 200px;
        }

        .recycle-item .info .name {
            font-weight: 500;
            color: var(--text);
        }
        .recycle-item .info .id {
            color: var(--primary-dark);
            font-family: monospace;
        }
        .recycle-item .info .time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .recycle-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .recycle-actions button {
            padding: 4px 14px;
            border: none;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);

<body>
    <div class="container" id="appContainer">

        <!-- ==========================================================
             页面头部（两行布局）
             ========================================================== -->
        <header class="header">
            <!-- 第一行：标题 + 统计 + 导航 + 双击提示 -->
            <div class="header-top">
                <h1 id="mainTitle">🎵 Roblox 音乐ID 宝库 <small id="modeLabel">游客模式</small></h1>
                <div class="header-stats">
                    <span>📚 <strong id="totalGroupCount">0</strong> 组</span>
                    <span>🎶 <strong id="totalIdCount">0</strong> 个ID</span>
                    <span>🔁 <strong id="multiGroupCount">0</strong> 组多ID</span>
                </div>
                <div class="header-nav-wrapper">
                    <nav class="header-nav" aria-label="主导航">
                        <a href="index.html" class="nav-btn" id="homeBtn">🏠 首页</a>
                        <span class="nav-divider" aria-hidden="true"></span>
                        <a href="feedback.html" class="nav-btn" id="feedbackBtn">📩 反馈</a>
                    </nav>
                    <span class="admin-hint" id="modeHint">双击标题 <strong>切换管理</strong></span>
                </div>
            </div>

            <!-- 第二行：管理按钮（顺序：导入、导出、清空、回收站、隔离区、批量删除） -->
            <div class="header-actions">
                <div class="btn-group">
                    <button class="btn-import admin-only" id="openImportBtn">📥 导入</button>
                    <button class="btn-success admin-only" id="exportBtn">💾 导出</button>
                    <button class="btn-danger admin-only" id="clearAllBtn">🧹 清空</button>
                    <button class="btn-recycle admin-only" id="openRecycleBtn">♻️ 回收站</button>
                    <button class="btn-quarantine admin-only" id="openQuarantineBtn">⛔ 隔离区</button>
                    <button class="btn-batch admin-only" id="batchToggleBtn">📦 批量删除</button>
                </div>
            </div>
        </header>

        <!-- ==========================================================
             鸣谢名单
             ========================================================== -->
        <section class="credit-section" aria-label="鸣谢">
            <div class="credit-content">
                <span class="credit-icon">🙏</span>
                <div class="credit-text">
                    <strong>特别鸣谢</strong>
                    <span class="credit-item">🎬 视频平台 UP主 的精彩内容</span>
                    <span class="credit-divider">·</span>
                    <span class="credit-item">📋 Duck 整理本歌单的所有歌曲</span>
                </div>
            </div>
        </section>

        <!-- ==========================================================
             搜索与筛选
             ========================================================== -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索歌名或ID..." aria-label="搜索歌曲">
            <div class="filter-tabs" id="categoryTabs" role="tablist">
                <button class="active" data-cat="all" role="tab">全部</button>
            </div>
            <button class="btn-multi" id="multiToggleBtn" aria-pressed="false">🔁 多ID</button>
        </div>

        <!-- ==========================================================
             批量操作栏（主列表）
             ========================================================== -->
        <div class="batch-bar" id="batchBar">
            <span class="info">已选 <strong id="selectedCount">0</strong> 个ID</span>
            <div class="actions">
                <button class="btn-batch-clear" id="batchClearBtn">取消选择</button>
                <button class="btn-batch-delete" id="batchDeleteBtn">🗑️ 删除选中</button>
            </div>
        </div>

        <!-- ==========================================================
             歌曲列表（由 JavaScript 动态渲染）
             ========================================================== -->
        <div id="songListContainer" role="list"></div>
        <div class="empty-state" id="emptyState" style="display:none;">😕 没有找到匹配的歌曲</div>
    </div>

    <!-- ==========================================================
         页脚：开发者与支持者（不显眼）

            <img src="developer.png" alt="开发者图标" loading="lazy">

            <span class="label">(HuTinJian)</span>

    <!-- ===== Toast 提示 ===== -->

                <button class="btn-cancel" id="cancelPassword">取消</button>

    <div class="modal recycle-modal" id="recycleModal" role="dialog" aria-modal="true">

            <h2>♻️ 回收站 <span id="recycleCountTitle" style="font-size:14px; color:var(--text-muted); font-weight:400;"></span></h2>
            <div id="recycleList" style="overflow-y:auto; flex:1; margin:12px 0;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="closeRecycleBtn">关闭</button>
                <button class="btn-danger" id="emptyRecycleBtn">🗑️ 全部移入隔离区</button>
            </div>
        </div>
    </div>

    <!-- ===== 隔离区弹窗 ===== -->
    <div class="modal quarantine-modal" id="quarantineModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h2>⛔ 隔离区 <span id="quarantineCountTitle" style="font-size:14px; color:var(--text-muted); font-weight:400;"></span></h2>
            <!-- 隔离区批量操作栏 -->
            <div class="quarantine-batch-bar" id="quarantineBatchBar">
                <span class="info">已选 <strong id="quarantineSelectedCount">0</strong> 个ID</span>
                <div class="actions">
                    <button class="btn-batch-clear" id="quarantineBatchClearBtn">取消选择</button>

            <div class="modal-actions">
                <button class="btn-cancel" id="closeQuarantineBtn">关闭</button>
                <button class="btn-danger" id="emptyQuarantineBtn">🧹 清空隔离区</button>
            </div>
        </div>
    </div>

    <!-- ===== 自定义确认对话框 ===== -->
    <div class="modal" id="confirmModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h2 id="confirmTitle">确认操作</h2>
            <p id="confirmMessage">确定要继续吗？</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="confirmCancel">取消</button>
                <button class="btn-confirm" id="confirmOk">确定</button>
            </div>
        </div>

    <!-- =============================================================
     JavaScript 核心逻辑（完整注释）
     ============================================================= -->
    <script>
        /**
         * ============================================================
         * 1. 配置区
         * ============================================================
         */
        const USE_EXTERNAL_JSON = true; // 是否从外部JSON加载数据
        const EXTERNAL_JSON_URL = 'roblox_music_id.json'; // 外部数据文件名
        const DATA_VERSION = 'v5.7'; // 数据版本号（修改后强制刷新用户缓存）
        const ADMIN_PASSWORD = 'HuTinJianZW'; // 管理模式密码

        /**
         * ============================================================
         * 2. 全局变量
         * ============================================================
         */
        let songDatabase = []; // 主数据（所有歌曲ID）
        let recycleBin = []; // 回收站（可恢复的删除）
        let quarantineBin = []; // 隔离区（彻底删除前黑名单）
        let isAdmin = false; // 是否处于管理模式
        let batchMode = false; // 主列表批量模式
        let selectedIds = new Set(); // 主列表选中的ID集合

        let quarantineBatchMode = false; // 隔离区批量模式
        let selectedQuarantineIds = new Set(); // 隔离区选中的ID集合

        let currentCategory = 'all'; // 当前筛选的分类
        let currentKeyword = ''; // 当前搜索关键词
        let showMultiOnly = false; // 是否只显示多ID组

        let toastTimer = null; // Toast计时器

        /**
         * ============================================================
         * 3. 辅助函数
         * ============================================================
         */

        // 转义HTML防止XSS注入
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 清洗歌名：去除竖线、括号内容、末尾标点
        function cleanName(name) {
            if (!name) return '未知歌名';
            name = name.replace(/\s*[｜\|]\s*/g, '');
            name = name.replace(/\s*[（(][^）)]*[）)]\s*$/, '');
            name = name.replace(/[，。、：；！？\.,;:!?]+$/, '');
            return name.trim() || '未知歌名';
        }

        // 显示Toast提示（自动消失）
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        /**
         * ============================================================
         * 4. 自定义确认框（替代原生confirm，更美观）
         * ============================================================
         */
        function showConfirm(title, message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;
                modal.classList.add('show');

                const okBtn = document.getElementById('confirmOk');
                const cancelBtn = document.getElementById('confirmCancel');

                const cleanup = () => {
                    modal.classList.remove('show');
                    okBtn.removeEventListener('click', okHandler);
                    cancelBtn.removeEventListener('click', cancelHandler);
                };

                const okHandler = () => { cleanup();
                    resolve(true); };
                const cancelHandler = () => { cleanup();
                    resolve(false); };

                okBtn.addEventListener('click', okHandler);
                cancelBtn.addEventListener('click', cancelHandler);

                // 点击背景也视为取消
                modal.addEventListener('click', function outer(e) {
                    if (e.target === modal) {
                        cleanup();
                        resolve(false);
                        modal.removeEventListener('click', outer);
                    }
                });
            });
        }

        /**
         * ============================================================
         * 5. 数据持久化（存储到localStorage）
         * ============================================================
         */
        function saveData() {
            localStorage.setItem('songDB', JSON.stringify(songDatabase));
            localStorage.setItem('recycleBin', JSON.stringify(recycleBin));
            localStorage.setItem('quarantineBin', JSON.stringify(quarantineBin));
        }

        /**
         * ============================================================
         * 6. 数据加载（优先缓存，否则从外部JSON读取）
         * ============================================================
         */
        function loadData() {
            // 读取回收站和隔离区
            const recycleStored = localStorage.getItem('recycleBin');
            if (recycleStored) {
                try { recycleBin = JSON.parse(recycleStored); } catch (e) { recycleBin = []; }
            }
            const quarantineStored = localStorage.getItem('quarantineBin');
            if (quarantineStored) {
                try { quarantineBin = JSON.parse(quarantineStored); } catch (e) { quarantineBin = []; }
            }

            // 检查主数据缓存是否有效且版本匹配
            const stored = localStorage.getItem('songDB');
            const storedVersion = localStorage.getItem('songDBVersion');
            if (stored && storedVersion === DATA_VERSION) {
                try {
                    songDatabase = JSON.parse(stored);
                    renderAll();
                    return;
                } catch (e) { /* 缓存损坏，重新加载 */ }
            }

            // 从外部JSON加载
            if (USE_EXTERNAL_JSON) {
                fetch(EXTERNAL_JSON_URL)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        // 过滤掉回收站和隔离区中的ID
                        const recycleIds = new Set(recycleBin.map(i => i.id));
                        const quarantineIds = new Set(quarantineBin.map(i => i.id));
                        songDatabase = data
                            .filter(i => !recycleIds.has(i.id) && !quarantineIds.has(i.id))
                            .map(i => ({ ...i, name: cleanName(i.name || '未知歌名') }));
                        saveData();
                        localStorage.setItem('songDBVersion', DATA_VERSION);
                        console.log(`✅ 外部数据加载成功，共 ${songDatabase.length} 首（跳过回收站 ${recycleBin.length} 个，隔离区 ${quarantineBin.length} 个）`);
                        renderAll();
                    })
                    .catch(err => {
                        console.error('❌ 外部JSON加载失败:', err);
                        songDatabase = [];
                        renderAll();
                        showToast('⚠️ 数据加载失败，请检查外部JSON文件');
                    });
            } else {
                songDatabase = [];
                renderAll();
            }
        }

        /**
         * ============================================================
         * 7. 模式管理（游客/管理员）
         * ============================================================
         */
        function loadMode() {
            isAdmin = localStorage.getItem('adminMode') === 'true';
            applyMode();
        }

        function applyMode() {
            const container = document.getElementById('appContainer');
            const label = document.getElementById('modeLabel');
            const hint = document.getElementById('modeHint');
            if (isAdmin) {
                container.classList.remove('mode-readonly');
                container.classList.add('mode-manage');
                label.textContent = '管理模式';
                hint.innerHTML = '双击标题 <strong>退出管理</strong>';
                if (batchMode) toggleBatchMode(false);
                if (quarantineBatchMode) toggleQuarantineBatchMode(false);
            } else {
                container.classList.remove('mode-manage');
                container.classList.add('mode-readonly');
                label.textContent = '游客模式';
                hint.innerHTML = '双击标题 <strong>切换管理</strong>';
                if (batchMode) toggleBatchMode(false);
                if (quarantineBatchMode) toggleQuarantineBatchMode(false);
            }
            renderList();
        }

        // 双击标题切换管理模式
        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                localStorage.setItem('adminMode', 'false');
                applyMode();
                showToast('已退出管理模式');
                renderList();
            } else {
                document.getElementById('passwordModal').classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordError').style.display = 'none';
                document.getElementById('passwordInput').focus();
            }
        }

        // 验证密码
        function verifyPassword(pwd) {
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('adminMode', 'true');
                applyMode();
                document.getElementById('passwordModal').classList.remove('show');
                showToast('✅ 已进入管理模式');
                renderList();
            } else {
                document.getElementById('passwordError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        /**
         * ============================================================
         * 8. 主列表批量操作
         * ============================================================
         */
        function toggleBatchMode(forceState) {
            const newState = (forceState !== undefined) ? forceState : !batchMode;
            if (newState === batchMode) return;
            batchMode = newState;

            const container = document.getElementById('appContainer');
            const bar = document.getElementById('batchBar');
            const btn = document.getElementById('batchToggleBtn');

            if (batchMode) {
                container.classList.add('batch-mode');
                bar.classList.add('show');
                btn.classList.add('active');
                btn.textContent = '📦 退出批量';
                selectedIds.clear();
                updateSelectedCount();
            } else {
                container.classList.remove('batch-mode');
                bar.classList.remove('show');
                btn.classList.remove('active');
                btn.textContent = '📦 批量删除';
                selectedIds.clear();
                updateSelectedCount();
            }
            renderList(); // 重新渲染以显示/隐藏复选框
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedIds.size;
        }

        function clearSelected() {
            selectedIds.clear();
            updateSelectedCount();
            document.querySelectorAll('.id-checkbox').forEach(cb => cb.checked = false);
        }

        // 批量删除（移入回收站）
        async function batchDelete() {
            if (selectedIds.size === 0) { showToast('⚠️ 请先选择要删除的ID'); return; }
            const confirmed = await showConfirm('批量删除', `确定将选中的 ${selectedIds.size} 个ID移入回收站吗？`);
            if (!confirmed) return;

            const toDelete = [];
            const newDb = [];
            for (let item of songDatabase) {
                if (selectedIds.has(item.id)) {
                    toDelete.push(item);
                } else {
                    newDb.push(item);
                }
            }
            toDelete.forEach(item => {
                recycleBin.push({ ...item, deletedAt: new Date().toISOString() });
            });
            songDatabase = newDb;
            selectedIds.clear();
            saveData();
            showToast(`🗑️ 已移入回收站 ${toDelete.length} 个ID`);
            if (batchMode) toggleBatchMode(false);
            renderAll();
            updateSelectedCount();
        }

        /**
         * ============================================================
         * 9. 回收站操作
         * ============================================================
         */

        // 单个移入回收站（由✕按钮触发）
        async function moveToRecycle(name, id) {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            const idx = songDatabase.findIndex(i => i.name === name && i.id === id);
            if (idx === -1) { showToast('⚠️ 未找到该ID'); return; }
            const item = songDatabase[idx];
            const confirmed = await showConfirm('移入回收站', `确定将 ID ${id}（歌名：${name}）移入回收站吗？\n您可以在回收站中恢复它。`);
            if (!confirmed) return;

            songDatabase.splice(idx, 1);
            recycleBin.push({ ...item, deletedAt: new Date().toISOString() });
            saveData();
            showToast(`✅ ID ${id} 已移入回收站`);
            renderAll();
        }

        // 从回收站恢复
        async function restoreFromRecycle(id) {
            const idx = recycleBin.findIndex(i => i.id === id);
            if (idx === -1) { showToast('⚠️ 回收站中未找到该ID'); return; }
            const item = recycleBin[idx];
            if (songDatabase.some(i => i.id === id)) {
                showToast('⚠️ 该ID已存在于主列表中，已从回收站删除');
                recycleBin.splice(idx, 1);
                saveData();
                renderRecycleList();
                return;
            }
            recycleBin.splice(idx, 1);
            const maxLine = songDatabase.reduce((m, i) => i.lineIndex > m ? i.lineIndex : m, 0);
            item.lineIndex = maxLine + 1;
            songDatabase.push(item);
            saveData();
            showToast(`✅ 已恢复 ID ${id}（${item.name}）`);
            renderAll();
            renderRecycleList();
        }

        // 从回收站移入隔离区
        async function moveToQuarantineFromRecycle(id) {
            const idx = recycleBin.findIndex(i => i.id === id);
            if (idx === -1) { showToast('⚠️ 回收站中未找到该ID'); return; }
            const item = recycleBin[idx];
            const confirmed = await showConfirm('移入隔离区', `确定将 ID ${id}（歌名：${item.name}）移入隔离区吗？\n隔离区中的ID在导入时将被自动跳过。`);
            if (!confirmed) return;

            recycleBin.splice(idx, 1);
            if (!quarantineBin.some(q => q.id === id)) {
                quarantineBin.push({ ...item, quarantinedAt: new Date().toISOString() });
            }
            saveData();
            showToast(`⛔ ID ${id} 已移入隔离区`);
            renderRecycleList();
            renderAll();
        }

        // 清空回收站（全部移入隔离区）
        async function emptyRecycleBin() {
            if (recycleBin.length === 0) { showToast('回收站已是空的'); return; }
            const confirmed = await showConfirm('清空回收站', `确定将回收站中所有 ${recycleBin.length} 个ID移入隔离区吗？\n移入隔离区后，导入时将自动跳过这些ID。`);
            if (!confirmed) return;

            recycleBin.forEach(item => {
                if (!quarantineBin.some(q => q.id === item.id)) {
                    quarantineBin.push({ ...item, quarantinedAt: new Date().toISOString() });
                }
            });
            recycleBin = [];
            saveData();
            showToast(`🗑️ 已将所有回收站ID移入隔离区`);
            renderRecycleList();
            renderAll();
        }

        // 渲染回收站列表
        function renderRecycleList() {
            const container = document.getElementById('recycleList');
            const title = document.getElementById('recycleCountTitle');
            if (recycleBin.length === 0) {
                container.innerHTML = '<div class="recycle-empty">回收站是空的 🗑️</div>';
                title.textContent = '(空)';

            const sorted = [...recycleBin].sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt));
            let html = '';
            sorted.forEach(item => {
                const time = item.deletedAt ? new Date(item.deletedAt).toLocaleString() : '未知时间';
                html += `
                    <div class="recycle-item">
                        <div class="info">
                            <span class="name">${escapeHtml(item.name)}</span>

                        </div>

                            <button class="restore-btn" data-id="${escapeHtml(item.id)}">♻️ 恢复</button>

                        </div>
                    </div>
                `;

            container.querySelectorAll('.restore-btn').forEach(btn => {

            });

        /**
         * ============================================================
         * 10. 隔离区操作（含批量取消隔离）
         * ============================================================
         */

        // 切换隔离区批量模式
        function toggleQuarantineBatchMode(forceState) {
            const newState = (forceState !== undefined) ? forceState : !quarantineBatchMode;
            if (newState === quarantineBatchMode) return;
            quarantineBatchMode = newState;

            const container = document.querySelector('#quarantineModal .modal-content');
            const bar = document.getElementById('quarantineBatchBar');

            if (quarantineBatchMode) {
                container.classList.add('quarantine-batch-mode');
                bar.classList.add('show');
                selectedQuarantineIds.clear();
                updateQuarantineSelectedCount();
            } else {
                container.classList.remove('quarantine-batch-mode');
                bar.classList.remove('show');
                selectedQuarantineIds.clear();
                updateQuarantineSelectedCount();
            }
            renderQuarantineList();
        }

        function updateQuarantineSelectedCount() {
            document.getElementById('quarantineSelectedCount').textContent = selectedQuarantineIds.size;
        }

        function clearQuarantineSelected() {
            selectedQuarantineIds.clear();
            updateQuarantineSelectedCount();
            document.querySelectorAll('.quarantine-checkbox').forEach(cb => cb.checked = false);
        }

        // 切换单个隔离区ID的选中状态
        function toggleQuarantineSelect(id) {
            if (selectedQuarantineIds.has(id)) {
                selectedQuarantineIds.delete(id);
            } else {
                selectedQuarantineIds.add(id);
            }
            updateQuarantineSelectedCount();
            document.querySelectorAll('.quarantine-checkbox').forEach(cb => {
                if (cb.dataset.id === id) {
                    cb.checked = selectedQuarantineIds.has(id);
                }
            });
        }

        // 批量取消隔离（从隔离区移除）
        async function batchReleaseFromQuarantine() {
            if (selectedQuarantineIds.size === 0) { showToast('⚠️ 请先选择要取消隔离的ID'); return; }
            const confirmed = await showConfirm('批量取消隔离', `确定将选中的 ${selectedQuarantineIds.size} 个ID从隔离区移除吗？\n移除后，下次导入时这些ID将可重新加入。`);
            if (!confirmed) return;

            const toRelease = [];
            const newQuarantine = [];
            for (let item of quarantineBin) {
                if (selectedQuarantineIds.has(item.id)) {
                    toRelease.push(item);
                } else {
                    newQuarantine.push(item);
                }
            }
            quarantineBin = newQuarantine;
            selectedQuarantineIds.clear();
            saveData();
            showToast(`🔓 已取消隔离 ${toRelease.length} 个ID`);
            if (quarantineBatchMode) toggleQuarantineBatchMode(false);
            renderQuarantineList();
        }

        // 单个取消隔离
        async function releaseFromQuarantine(id) {
            const idx = quarantineBin.findIndex(i => i.id === id);
            if (idx === -1) { showToast('⚠️ 隔离区中未找到该ID'); return; }
            const item = quarantineBin[idx];
            const confirmed = await showConfirm('取消隔离', `确定将 ID ${id}（歌名：${item.name}）从隔离区移除吗？\n移除后，下次导入时该ID将被重新加入。`);
            if (!confirmed) return;

            quarantineBin.splice(idx, 1);

        // 彻底删除隔离区条目（永久移除黑名单记录）
        async function permanentlyDeleteFromQuarantine(id) {
            const confirmed = await showConfirm('彻底删除', `确定要彻底删除隔离区中的 ID ${id} 吗？\n此操作将永久移除该记录，之后导入不再跳过。`);
            if (!confirmed) return;
            const idx = quarantineBin.findIndex(i => i.id === id);
            if (idx === -1) return;
            quarantineBin.splice(idx, 1);
            saveData();
            showToast(`🗑️ 已彻底删除 ID ${id}`);

        }

        // 清空隔离区（彻底删除所有黑名单记录）
        async function emptyQuarantineBin() {
            if (quarantineBin.length === 0) { showToast('隔离区已是空的'); return; }
            const confirmed = await showConfirm('清空隔离区', `确定要清空隔离区吗？将永久删除 ${quarantineBin.length} 条黑名单记录，之后导入将不再跳过这些ID。`);
            if (!confirmed) return;
            quarantineBin = [];
            saveData();
            showToast('🗑️ 隔离区已清空');
            renderQuarantineList();
        }

        // 渲染隔离区列表
        function renderQuarantineList() {
            const container = document.getElementById('quarantineList');
            const title = document.getElementById('quarantineCountTitle');
            if (quarantineBin.length === 0) {
                container.innerHTML = '<div class="quarantine-empty">隔离区是空的 ⛔</div>';
                title.textContent = '(空)';
                return;
            }
            title.textContent = `(${quarantineBin.length} 个ID)`;
            const sorted = [...quarantineBin].sort((a, b) => new Date(b.quarantinedAt) - new Date(a.quarantinedAt));
            let html = '';
            sorted.forEach(item => {
                const time = item.quarantinedAt ? new Date(item.quarantinedAt).toLocaleString() : '未知时间';
                const checked = selectedQuarantineIds.has(item.id) ? 'checked' : '';
                html += `
                    <div class="quarantine-item">
                        <input type="checkbox" class="quarantine-checkbox" data-id="${escapeHtml(item.id)}" ${checked}>
                        <div class="info">
                            <span class="name">${escapeHtml(item.name)}</span>
                            <span class="id">${escapeHtml(item.id)}</span>
                            <span class="time">⛔ ${time}</span>
                        </div>
                        <div class="quarantine-actions">
                            <button class="release-btn" data-id="${escapeHtml(item.id)}">🔓 取消隔离</button>
                            <button class="delete-btn" data-id="${escapeHtml(item.id)}">✕ 彻底删除</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 绑定按钮事件
            container.querySelectorAll('.release-btn').forEach(btn => {
                btn.onclick = () => releaseFromQuarantine(btn.dataset.id);

            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = () => permanentlyDeleteFromQuarantine(btn.dataset.id);
            });

            // 绑定复选框事件
            container.querySelectorAll('.quarantine-checkbox').forEach(cb => {
                cb.onchange = function() {
                    const id = this.dataset.id;
                    if (this.checked) {
                        selectedQuarantineIds.add(id);
                    } else {
                        selectedQuarantineIds.delete(id);
                    }
                    updateQuarantineSelectedCount();
                };
                if (selectedQuarantineIds.has(cb.dataset.id)) {
                    cb.checked = true;
                }
            });

            // 如果隔离区批量模式开启，显示操作栏，否则隐藏
            const bar = document.getElementById('quarantineBatchBar');
            if (quarantineBatchMode) {
                bar.classList.add('show');
            } else {
                bar.classList.remove('show');

        /**
         * ============================================================
         * 11. 导入功能（自动跳过回收站和隔离区中的ID）
         * ============================================================
         */

        // 解析原始文本，提取所有ID和歌名（支持一行多个ID）
        function parseRawText(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            const idRegex = /\b(\d{10,})\b/g;
            let globalLineIndex = 0;

            for (let line of lines) {
                line = line.trim();
                if (!line) { globalLineIndex++; continue; }

                const ids = [];
                let match;
                while ((match = idRegex.exec(line)) !== null) {
                    ids.push(match[1]);
                }
                if (ids.length === 0) { globalLineIndex++; continue; }

                // 去除所有ID后剩余部分作为歌名
                let name = line;
                ids.forEach(id => { name = name.replace(id, ''); });
                name = name.replace(/^[\d]+[\.\、\s]+/, '');
                name = name.replace(/^[\d]+[\s]*[\)）]/, '');
                name = name.replace(/^[\|•·\-\s]+/, '');
                name = name.replace(/[\|•·\-]+$/, '');
                name = cleanName(name);
                if (!name) name = '未知歌名';

                // 为每个ID创建条目（共享歌名）
                ids.forEach((id, idx) => {
                    if (result.some(r => r.id === id)) return; // 去重
                    // 智能分类（未匹配则默认“中文流行”）
                    let category = '中文流行';
                    const lower = name.toLowerCase();
                    if (lower.includes('phonk') || lower.includes('drift') || lower.includes('卡点') || lower.includes('dj'))
                        category = 'Phonk/DJ';
                    else if (lower.includes('古风') || lower.includes('国风') || lower.includes('琵琶') || lower.includes('古筝') ||
                        lower.includes('二胡') || lower.includes('箫') || lower.includes('笛') || lower.includes('琴') ||
                        lower.includes('红昭愿') || lower.includes('牵丝戏') || lower.includes('赤伶'))
                        category = '古风国风';
                    else if (lower.includes('搞笑') || lower.includes('音效') || lower.includes('惨叫') || lower.includes('笑声') ||
                        lower.includes('魔性') || lower.includes('鬼畜') || lower.includes('沙雕') || lower.includes('梗'))
                        category = '搞笑音效';
                    else if (lower.includes('周杰伦') || lower.includes('杰伦')) category = '周杰伦';
                    else if (lower.includes('英文') || /[a-zA-Z]/.test(name) && !lower.includes('中文'))
                        category = '英文热门';

                    result.push({
                        id: id,
                        name: name,
                        category: category,
                        lineIndex: globalLineIndex + idx * 0.1
                    });
                });
                globalLineIndex++;
            }
            return result;
        }

        // 导入数据（自动跳过回收站和隔离区中的ID）
        async function importData(rawText) {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            const parsed = parseRawText(rawText);
            if (parsed.length === 0) {
                document.getElementById('importStatus').textContent = '⚠️ 未解析到任何有效条目';
                return;
            }

            const recycleIds = new Set(recycleBin.map(i => i.id));
            const quarantineIds = new Set(quarantineBin.map(i => i.id));
            const toAdd = parsed.filter(i => !recycleIds.has(i.id) && !quarantineIds.has(i.id));
            const skippedRecycle = parsed.filter(i => recycleIds.has(i.id)).length;
            const skippedQuarantine = parsed.filter(i => quarantineIds.has(i.id)).length;

            const existingMap = {};
            songDatabase.forEach(i => { existingMap[i.id] = i; });
            let added = 0, updated = 0;
            toAdd.forEach(newItem => {
                if (existingMap[newItem.id]) {
                    const old = existingMap[newItem.id];
                    if (old.name !== newItem.name || old.category !== newItem.category || old.lineIndex !== newItem.lineIndex) {
                        old.name = newItem.name;
                        old.category = newItem.category;
                        old.lineIndex = newItem.lineIndex;
                        updated++;
                    }
                } else {
                    songDatabase.push(newItem);
                    existingMap[newItem.id] = newItem;
                    added++;
                }
            });

            saveData();
            let msg = `✅ 导入完成！新增 ${added} 首，更新 ${updated} 首`;
            if (skippedRecycle > 0) msg += `，跳过回收站 ${skippedRecycle} 个`;
            if (skippedQuarantine > 0) msg += `，跳过隔离区 ${skippedQuarantine} 个`;
            document.getElementById('importStatus').textContent = msg;
            renderAll();
            setTimeout(() => document.getElementById('importModal').classList.remove('show'), 1500);
        }

        /**
         * ============================================================
         * 12. 其他管理员操作（清空所有、导出备份）
         * ============================================================
         */

        // 清空所有数据（包括回收站和隔离区）
        async function clearAllData() {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            const confirmed = await showConfirm('清空所有', '⚠️ 确定要清空所有数据（包括回收站和隔离区）吗？此操作不可恢复！');
            if (!confirmed) return;
            songDatabase = [];
            recycleBin = [];
            quarantineBin = [];
            saveData();
            renderAll();
            showToast('已清空所有数据');
        }

        // 导出数据为JSON文件（仅导出主数据，不含回收站/隔离区）
        function exportData() {
            if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
            const blob = new Blob([JSON.stringify(songDatabase, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `roblox_ids_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        /**
         * ============================================================
         * 13. 渲染引擎（主列表）
         * ============================================================
         */
        function renderAll() {
            // 更新统计信息
            const uniqueNames = new Set(songDatabase.map(i => i.name));
            document.getElementById('totalGroupCount').textContent = uniqueNames.size;
            document.getElementById('totalIdCount').textContent = songDatabase.length;

            const nameCountMap = {};
            songDatabase.forEach(i => { nameCountMap[i.name] = (nameCountMap[i.name] || 0) + 1; });
            let multiCount = Object.values(nameCountMap).filter(c => c > 1).length;
            document.getElementById('multiGroupCount').textContent = multiCount;

            // 动态生成分类按钮（从数据中提取）
            const tabsContainer = document.getElementById('categoryTabs');
            while (tabsContainer.children.length > 1) tabsContainer.removeChild(tabsContainer.lastChild);
            const categories = new Set(songDatabase.map(i => i.category));
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.dataset.cat = cat;
                btn.textContent = cat;
                btn.setAttribute('role', 'tab');
                tabsContainer.appendChild(btn);
            });

            // 绑定分类切换事件
            const allBtns = tabsContainer.querySelectorAll('button');
            allBtns.forEach(btn => {
                btn.onclick = function() {
                    const cat = this.dataset.cat;
                    if (cat === 'all') {
                        if (showMultiOnly) {
                            showMultiOnly = false;
                            document.getElementById('multiToggleBtn').classList.remove('active');
                        }
                        currentCategory = 'all';
                    } else {
                        currentCategory = cat;
                    }
                    allBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderList();
                };
            });
            allBtns.forEach(b => {
                if (b.dataset.cat === currentCategory) b.classList.add('active');
                else b.classList.remove('active');
            });

            // 搜索输入事件
            document.getElementById('searchInput').oninput = function() {
                currentKeyword = this.value;
                renderList();
            };

            // 多ID切换按钮
            const multiBtn = document.getElementById('multiToggleBtn');
            multiBtn.onclick = function() {
                showMultiOnly = !showMultiOnly;
                this.classList.toggle('active');
                this.setAttribute('aria-pressed', showMultiOnly);
                renderList();
            };
            if (showMultiOnly) {
                multiBtn.classList.add('active');
                multiBtn.setAttribute('aria-pressed', 'true');
            }

            renderList();
        }

        // 根据当前筛选条件渲染歌曲列表
        function renderList() {
            const keyword = currentKeyword.trim().toLowerCase();

            // 1. 过滤条目（分类 + 关键词）
            let filtered = songDatabase.filter(item => {
                const catMatch = currentCategory === 'all' || item.category === currentCategory;
                const kwMatch = !keyword || item.name.toLowerCase().includes(keyword) || item.id.includes(keyword);
                return catMatch && kwMatch;
            });

            // 2. 按歌名分组
            const groupMap = {};
            filtered.forEach(item => {
                if (!groupMap[item.name]) {
                    groupMap[item.name] = { name: item.name, ids: [], categories: new Set(), firstLine: Infinity };
                }
                groupMap[item.name].ids.push(item.id);
                groupMap[item.name].categories.add(item.category);
                if (item.lineIndex < groupMap[item.name].firstLine) {
                    groupMap[item.name].firstLine = item.lineIndex;
                }
            });

            let groups = Object.values(groupMap);
            groups.sort((a, b) => a.firstLine - b.firstLine); // 按原始顺序

            // 3. 多ID筛选
            if (showMultiOnly) {
                groups = groups.filter(g => g.ids.length > 1);
            }

            const container = document.getElementById('songListContainer');
            const empty = document.getElementById('emptyState');

            if (groups.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            // 4. 生成HTML
            let html = '';
            groups.forEach(group => {
                const catStr = Array.from(group.categories).join(' / ');
                const safeName = escapeHtml(group.name);
                const isMulti = group.ids.length > 1;

                let nameHtml = safeName;
                if (isMulti) nameHtml += ` <span class="badge-multi">多ID</span>`;

                let rowsHtml = '';
                group.ids.forEach(id => {
                    const checked = selectedIds.has(id) ? 'checked' : '';
                    rowsHtml += `
                        <div class="id-row">
                            <input type="checkbox" class="id-checkbox" data-id="${escapeHtml(id)}" ${checked}>
                            <span class="id-number">${escapeHtml(id)}</span>
                            <div class="id-actions">
                                <button class="btn-copy-id" data-id="${escapeHtml(id)}">📋 复制</button>
                                <button class="btn-delete-id admin-only" data-name="${safeName}" data-id="${escapeHtml(id)}" title="移入回收站">✕</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="song-group" data-group-name="${safeName}">
                        <div class="group-header">
                            <div class="group-name">${nameHtml}</div>
                            <div class="group-right">
                                <span class="group-category">${escapeHtml(catStr)}</span>
                            </div>
                        </div>
                        <div class="id-list">${rowsHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // 5. 事件绑定（通过委托绑定复制和删除按钮）
            container.onclick = function(e) {
                const target = e.target.closest('button');
                if (!target) return;

                if (target.classList.contains('btn-copy-id')) {
                    e.stopPropagation();
                    copyToClipboard(target.dataset.id, target);
                    showToast('✅ 已复制ID，可搜索歌名查看所有版本');
                    return;
                }

                if (target.classList.contains('btn-delete-id')) {
                    e.stopPropagation();
                    moveToRecycle(target.dataset.name, target.dataset.id);
                    return;
                }
            };

            // 6. 绑定复选框的 change 事件
            container.querySelectorAll('.id-checkbox').forEach(cb => {
                cb.onchange = function() {
                    const id = this.dataset.id;
                    if (this.checked) {
                        selectedIds.add(id);
                    } else {
                        selectedIds.delete(id);
                    }
                    updateSelectedCount();
                };
                if (selectedIds.has(cb.dataset.id)) {
                    cb.checked = true;
                }
            });

            updateSelectedCount();
        }

        /**
         * ============================================================
         * 14. 复制功能（支持剪贴板及后备方案）
         * ============================================================
         */
        function copyToClipboard(text, btn) {
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showCopiedFeedback(btn))
                    .catch(() => fallbackCopy(text, btn));
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showCopiedFeedback(btn);
            } catch (e) {
                alert('复制失败，请手动复制: ' + text);
            }
            document.body.removeChild(ta);
        }

        function showCopiedFeedback(btn) {
            const orig = btn.textContent;
            btn.textContent = '✅ 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = orig;
                btn.classList.remove('copied');
            }, 1500);
        }

        /**
         * ============================================================
         * 15. 页面初始化
         * ============================================================
         */
        document.addEventListener('DOMContentLoaded', function() {
            loadMode();
            loadData();

            // 双击标题切换管理模式
            document.getElementById('mainTitle').addEventListener('dblclick', toggleAdminMode);

            // 导入按钮
            document.getElementById('openImportBtn').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                document.getElementById('importModal').classList.add('show');
                document.getElementById('rawText').value = '';
                document.getElementById('importStatus').textContent = '';
            });
            document.getElementById('cancelImport').addEventListener('click', function() {
                document.getElementById('importModal').classList.remove('show');
            });
            document.getElementById('confirmImport').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                const raw = document.getElementById('rawText').value;
                if (!raw.trim()) {
                    document.getElementById('importStatus').textContent = '⚠️ 请粘贴数据';
                    return;
                }
                importData(raw);
            });

            // 回收站
            document.getElementById('openRecycleBtn').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                document.getElementById('recycleModal').classList.add('show');
                renderRecycleList();
            });
            document.getElementById('closeRecycleBtn').addEventListener('click', function() {
                document.getElementById('recycleModal').classList.remove('show');
            });
            document.getElementById('emptyRecycleBtn').addEventListener('click', emptyRecycleBin);

            // 隔离区
            document.getElementById('openQuarantineBtn').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                document.getElementById('quarantineModal').classList.add('show');
                renderQuarantineList();
                if (quarantineBatchMode) {
                    document.querySelector('#quarantineModal .modal-content').classList.add('quarantine-batch-mode');
                }
            });
            document.getElementById('closeQuarantineBtn').addEventListener('click', function() {
                document.getElementById('quarantineModal').classList.remove('show');
                if (quarantineBatchMode) toggleQuarantineBatchMode(false);
            });
            document.getElementById('emptyQuarantineBtn').addEventListener('click', emptyQuarantineBin);

            // 隔离区批量操作
            document.getElementById('quarantineBatchClearBtn').addEventListener('click', clearQuarantineSelected);
            document.getElementById('quarantineBatchReleaseBtn').addEventListener('click', batchReleaseFromQuarantine);

            // 主列表批量
            document.getElementById('batchToggleBtn').addEventListener('click', function() {
                if (!isAdmin) { showToast('⚠️ 请先进入管理模式'); return; }
                toggleBatchMode();
            });
            document.getElementById('batchClearBtn').addEventListener('click', clearSelected);
            document.getElementById('batchDeleteBtn').addEventListener('click', batchDelete);

            // 导出与清空
            document.getElementById('exportBtn').addEventListener('click', exportData);
            // 注意：清空所有（clearAllData）已在顶部绑定，但独立按钮是“清空所有”，我们使用 clearAllBtn 已绑定

            // 密码弹窗
            document.getElementById('cancelPassword').addEventListener('click', function() {
                document.getElementById('passwordModal').classList.remove('show');
                document.getElementById('passwordError').style.display = 'none';
            });
            document.getElementById('confirmPassword').addEventListener('click', function() {
                verifyPassword(document.getElementById('passwordInput').value);
            });
            document.getElementById('passwordInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('confirmPassword').click();
            });
            document.getElementById('passwordModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                    document.getElementById('passwordError').style.display = 'none';
                }
            });

            // 弹窗外部关闭
            document.getElementById('importModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });
            document.getElementById('recycleModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });
            document.getElementById('quarantineModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });
        });
    </script>
