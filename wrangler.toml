# ============================================================
# 织雾满穗 · Cloudflare Pages 项目配置
# ------------------------------------------------------------
# 说明：
#   1. 本项目的「静态页面」和 `functions/` 目录都在仓库根目录，
#      所以 pages_build_output_dir 填 "."。
#   2. D1 数据库通过下面的 [[d1_databases]] 绑定，绑定名固定为 DB，
#      代码里始终用 `env.DB` 访问（改名会导致所有接口 500）。
#   3. AUTH_HASH / AUTH_TOKEN 是密钥，绝对不能写进本文件、更不能提交到
#      Git；必须在 Cloudflare Pages → Settings → Environment variables
#      里以「加密（Secret）」方式配置，本地预览则写在 .dev.vars 里。
# ============================================================

name = "zhimist-music"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# ------------------------------------------------------------
# D1 绑定（绑定名必须是 DB）
# database_id 请在 Cloudflare 控制台 → Workers & Pages → D1 →
# 选中你的数据库后复制真实的 id 覆盖下面的占位符。
# （用 `npx wrangler d1 create zhimist-db` 创建时会直接打印 id）
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "zhimist-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ------------------------------------------------------------
# 环境变量 / 密钥（示例，不要在此处填写真实值！）
# ------------------------------------------------------------
# AUTH_HASH  ：管理员密码的 SHA-512，小写十六进制（长度 128）
#              生成方式见 README.md「生成 AUTH_HASH」
# AUTH_TOKEN ：会话签名用的长随机串（建议 ≥ 32 字节随机、hex 或 base64）
#              生成方式见 README.md「生成 AUTH_TOKEN」
#
# 在 Cloudflare Pages 后台配置（推荐，加密保存）：
#   Settings → Variables and Secrets → 添加 AUTH_HASH / AUTH_TOKEN → 类型选 Secret
#
# 本地 `npx wrangler pages dev .` 预览时，把这两项写进仓库根目录的
# `.dev.vars`（该文件已被本仓库的 .gitignore 忽略，切勿提交）：
#   AUTH_HASH="把这里换成你的 sha512 小写十六进制"
#   AUTH_TOKEN="把这里换成长随机串"
#
# 注意：三个绑定/密钥（DB、AUTH_HASH、AUTH_TOKEN）缺任意一个，
#       functions/api/_utils.js 的 assertEnv() / 登录接口会直接报错，
#       这是刻意设计的「部署自检」——宁可显式报错，也不要静默失败。
