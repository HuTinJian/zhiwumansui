<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面走丢了 - 织雾满穗</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fdf2f5">

  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('zm_theme');
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', t);
      } catch (e) {}

      /* 精简模式：手机 / 低配设备 / 开了"减少动态效果"时，关掉持续运行的背景动画。
         404 页是自带样式的独立页面，所以这段判断要单独写一份（其它页面在 js/common.js 里）。 */
      try {
        var mq = window.matchMedia;
        var lite = false;
        if (mq) {
          if (mq('(prefers-reduced-motion: reduce)').matches) lite = true;
          else if (mq('(max-width: 768px)').matches) lite = true;
        }
        var cores = navigator.hardwareConcurrency || 0;
        var mem = navigator.deviceMemory || 0;
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn && conn.saveData) lite = true;
        if (cores && cores <= 4) lite = true;
        if (mem && mem <= 4) lite = true;
        if (lite) root.classList.add('lite');
      } catch (e) {}
    })();
  </script>

  <!--
    404 页会被服务器用任意 URL 提供，相对路径不可靠，因此这里完全内联样式，
    并用脚本站点根目录探测来修正站内链接。
  -->
  <style>
    :root {
      --primary: #dc6b82;
      --primary-ink: #a83c56;
      --primary-btn-a: #c7546a;
      --primary-btn-b: #b84460;
      --accent: #e88da1;
      --gold: #d4a06a;
      --bg: #fdf2f5;
      --bg-card: #ffffff;
      --text: #4a3f44;
      --text-light: #6e5f65;
      --text-muted: #7d6972;
      --border: #f0d9de;
      --radius: 20px;
      --radius-pill: 50px;
      --shadow: 0 4px 20px rgba(220, 107, 130, 0.08);
      --shadow-hover: 0 12px 40px rgba(220, 107, 130, 0.15);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
      --glow-1: rgba(240, 163, 180, 0.62);
      --glow-2: rgba(232, 196, 154, 0.5);
      --glow-3: rgba(176, 212, 232, 0.45);
      color-scheme: light;
    }
    [data-theme="dark"] {
      --primary: #ef8ea4;
      --primary-ink: #ffa9bd;
      --primary-btn-a: #d0617a;
      --primary-btn-b: #bf4f67;
      --accent: #f2a0b3;
      --gold: #e0b477;
      --bg: #17121a;
      --bg-card: #241c2a;
      --text: #f2e9ee;
      --text-light: #cdbcc5;
      --text-muted: #a4909a;
      --border: #3a2c36;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.5);
      --glow-1: rgba(178, 74, 106, 0.5);
      --glow-2: rgba(150, 108, 58, 0.42);
      --glow-3: rgba(58, 92, 134, 0.48);
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px 60px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s var(--ease-soft), color 0.4s var(--ease-soft);
    }
    /* 背景柔光层
       注意：这里【不用 filter: blur()】。大面积高斯模糊是手机卡顿的头号原因，
       而径向渐变本身就是柔和的，视觉几乎一样，渲染成本低得多。
       动画也只做 translate（纯位移），不缩放，这样完全交给显卡，不触发重绘。 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(64vw 64vw at 18% 22%, var(--glow-1), transparent 66%),
        radial-gradient(58vw 58vw at 82% 34%, var(--glow-2), transparent 68%),
        radial-gradient(62vw 62vw at 50% 88%, var(--glow-3), transparent 68%);
      animation: driftBg 30s ease-in-out infinite;
      will-change: transform;
    }
    /* 手机上不做漂移动画（一直重绘很费电），静态显示即可 */
    html.lite body::before { animation: none; }
    @keyframes driftBg {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50%      { transform: translate3d(-2%, 3%, 0); }
    }

    .mist { font-size: 2.8rem; margin-bottom: 4px; animation: floatY 4s ease-in-out infinite; }
    .err-code {
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(120deg, var(--primary), var(--accent) 45%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleIn 0.8s var(--ease-bounce) backwards;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      animation: fadeInUp 0.6s var(--ease-out) 0.2s backwards;
    }
    .desc {
      color: var(--text-light);
      font-size: 0.95rem;
      max-width: 460px;
      margin-bottom: 28px;
      animation: fadeInUp 0.6s var(--ease-out) 0.28s backwards;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeInUp 0.6s var(--ease-out) 0.36s backwards;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 26px;
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s var(--ease-bounce), box-shadow 0.3s var(--ease-soft), background 0.3s var(--ease-soft);
    }
    .btn:active { transform: scale(0.93); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-btn-a), var(--primary-btn-b));
      color: #fff;
      box-shadow: 0 6px 16px rgba(220, 107, 130, 0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(220, 107, 130, 0.4); }
    .btn-secondary {
      background: transparent;
      color: var(--text-light);
      border: 2px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary-ink); transform: translateY(-2px); }

    .hint {
      margin-top: 30px;
      font-size: 0.82rem;
      color: var(--text-muted);
      animation: fadeInUp 0.6s var(--ease-out) 0.44s backwards;
    }
    .hint a { color: var(--primary-ink); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-light);
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      box-shadow: var(--shadow);
      transition: transform 0.3s var(--ease-bounce), color 0.3s var(--ease-soft);
    }
    .theme-toggle:hover { color: var(--primary-ink); transform: rotate(-18deg) scale(1.08); }

    @keyframes titleIn {
      0%   { opacity: 0; transform: scale(0.7) translateY(-14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ---------- 精简模式（手机 / 低配设备自动生效） ----------
       关掉所有"一直在跑"的动画：这类动画每秒都在消耗电量和 GPU，
       静态页面完全没必要。 */
    html.lite .mist,
    html.lite .err-code {
      animation: none;
    }
    html.lite .btn,
    html.lite .theme-toggle {
      transition: none;
    }
  </style>
</head>
<body>

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">🌙</button>

  <span class="mist" aria-hidden="true">🌫️</span>
  <div class="err-code">404</div>
  <h1>这片雾里没有你要找的页面</h1>
  <p class="desc">
    链接可能已经失效，或者地址被拼错了。<br>
    不妨回到首页看看，或者把问题反馈给我们。
  </p>

  <div class="actions">
    <a class="btn btn-primary" id="homeLink" href="../index.html">🏠 返回首页</a>
    <button type="button" class="btn btn-secondary" id="backBtn">↩ 返回上一页</button>
    <a class="btn btn-secondary" id="feedbackLink" href="../feedback.html">💬 反馈</a>
  </div>

  <p class="hint">
    如果你确信这是个错误，欢迎在
    <a id="feedbackLinkText" href="../feedback.html">反馈页</a>
    告诉我们当时点的是哪个链接。
  </p>

  <script>
    (function () {
      'use strict';

      var root = document.documentElement;

      /* ---------- 主题 ---------- */
      var btn = document.getElementById('themeToggle');
      function paint() {
        var dark = root.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? '☀️' : '🌙';
      }
      paint();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('zm_theme', next); } catch (e) {}
        paint();
      });

      /* ---------- 返回上一页 ---------- */
      document.getElementById('backBtn').addEventListener('click', function () {
        if (history.length > 1) history.back();
        else location.href = document.getElementById('homeLink').href;
      });

      /* ---------- 修正站内链接 ----------
         404 页可能出现在任意深度、也可能部署在子目录（如 GitHub Pages 的 /repo/），
         因此从当前路径逐级向上探测，找到真正存在 images/favicon.svg 的那一级作为站点根。 */
      var links = {
        homeLink: 'index.html',
        feedbackLink: 'feedback.html',
        feedbackLinkText: 'feedback.html'
      };

      function applyBase(base) {
        Object.keys(links).forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.setAttribute('href', base + links[id]);
        });
        var icon = document.createElement('link');
        icon.rel = 'icon';
        icon.type = 'image/svg+xml';
        icon.href = base + 'images/favicon.svg';
        document.head.appendChild(icon);
      }

      var parts = location.pathname.split('/').filter(Boolean);
      /* 逐级向上：最后一段通常是被请求的文件名或目录名，先去掉 */
      if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) parts.pop();

      var prefixes = [];
      for (var i = parts.length; i >= 0; i--) {
        prefixes.push('/' + parts.slice(0, i).join('/') + (i ? '/' : ''));
      }

      (function probe(index) {
        if (index >= prefixes.length) return;   /* 全部失败：保留相对路径兜底 */
        var prefix = prefixes[index];
        fetch(prefix + 'images/favicon.svg', { method: 'HEAD' })
          .then(function (res) {
            if (res.ok) applyBase(prefix);
            else probe(index + 1);
          })
          .catch(function () { probe(index + 1); });
      })(0);
    })();
  </script>
</body>
</html>
