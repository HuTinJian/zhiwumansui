<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>页面走丢了 - 织雾满穗</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5F0E6">

  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('zm_theme');
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', t);
      } catch (e) {}

      /* 精简模式：手机 / 低配设备 / 开了"减少动态效果"时，关掉持续运行的背景动画。
         404 页是自带样式的独立页面，所以这段判断要单独写一份（其它页面在 js/common.js 里）。 */
      try {
        var mq = window.matchMedia;
        var lite = false;
        if (mq) {
          if (mq('(prefers-reduced-motion: reduce)').matches) lite = true;
          else if (mq('(max-width: 768px)').matches) lite = true;
        }
        var cores = navigator.hardwareConcurrency || 0;
        var mem = navigator.deviceMemory || 0;
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn && conn.saveData) lite = true;
        if (cores && cores <= 4) lite = true;
        if (mem && mem <= 4) lite = true;
        if (lite) root.classList.add('lite');
      } catch (e) {}
    })();
  </script>

  <!--
    404 页会被服务器用任意 URL 提供，相对路径不可靠，因此这里完全内联样式，
    并用脚本站点根目录探测来修正站内链接。
  -->
  <style>
    /* ============================================================
       404 页令牌桥（2026-10-25 中国色重制）
       ------------------------------------------------------------
       背景：404 页是「自带样式的独立页面」，可能被服务器用任意 URL 提供，
       所以它不加载 css/style.css（相对路径不可靠），全局令牌在这里取不到。
       本块只做一件事：把 css/style.css 里的同名全局令牌「值」桥接进来，
       下面所有规则一律引用 var(--令牌)，页面内不再维护第二套粉色色值。
       ⚠️ 色值取自 css/style.css（2026-10-25 中国色板），将来改色请两边一起改。
          阴影按色板用「暖褐单层」（404 只有一个圆形按钮，不需要 style.css 那种
          三层内高光），深色用黑；除此之外不启用第二套颜色。
       只保留圆角 / 缓动 / 字体等非颜色项。
       【回退办法】用 git checkout -- 404.html 恢复，或从
       .verify/backup-theme-20261025/404.html 拷回原文件。
       ============================================================ */
    :root {
      /* 表面与文字（宣纸）：只桥接本页用到的令牌 */
      --bg: #F5F0E6;
      --bg-card: #FFFCF6;
      --text: #221C16;
      --text-light: #544A3E;
      --text-muted: #786B5B;
      --text-on-accent: #FFF8EE;
      --border: #DCD2C0;
      /* 墨 / 朱砂 / 金 */
      --primary: #2C2721;
      --primary-ink: #1B1712;
      --primary-btn-a: #A62E22;
      --primary-btn-b: #8A1F18;
      --accent: #A62E22;
      --gold-ink: #7A571B;
      /* 叠色用 RGB（阴影 / 氛围光），写法：rgba(var(--xxx-rgb), α) */
      --ink-rgb: 34, 28, 22;
      --accent-rgb: 166, 46, 34;
      --gold-rgb: 176, 138, 62;
      /* 阴影：暖褐（不用冷蓝灰）；主按钮另用朱砂光晕 */
      --shadow: 0 4px 20px rgba(var(--ink-rgb), 0.10);
      --shadow-hover: 0 12px 40px rgba(var(--ink-rgb), 0.16);
      /* 氛围光：金 / 朱砂 / 青瓷低透明（与 style.css 的 --aurora-* 同值），
         404 只有这一层底纹，所以单独起 --glow-* 名字给 body::before 用 */
      --aurora-1: rgba(var(--gold-rgb), 0.16);
      --aurora-2: rgba(var(--accent-rgb), 0.10);
      --aurora-3: rgba(74, 115, 104, 0.12);
      --glow-1: var(--aurora-1);
      --glow-2: var(--aurora-2);
      --glow-3: var(--aurora-3);
      /* 非颜色项（原样保留） */
      --radius: 20px;
      --radius-pill: 50px;
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
      color-scheme: light;
    }
    /* 深色 · 墨夜（暖黑，不是蓝黑/纯黑）：同样只桥接全局令牌值，不另设计一套颜色 */
    [data-theme="dark"] {
      --bg: #14110E;
      --bg-card: #201B15;
      --text: #F0E8D8;
      --text-light: #C8BCA8;
      --text-muted: #9C8F7C;
      --text-on-accent: #FFF8EE;
      --border: #3A3228;
      --primary: #E9DFC9;
      --primary-ink: #FFF7E6;
      --primary-btn-a: #B23A2A;
      --primary-btn-b: #8E2218;
      --accent: #E2604A;
      --gold-ink: #E3C47C;
      --accent-rgb: 226, 96, 74;
      --gold-rgb: 216, 181, 102;
      /* 深色阴影用黑：暖黑底上自然投影，不用蓝灰 */
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.5);
      /* 深色氛围光：与 style.css 深色 --aurora-* 同值（更淡，夜里不刺眼） */
      --aurora-1: rgba(var(--gold-rgb), 0.10);
      --aurora-2: rgba(var(--accent-rgb), 0.08);
      --aurora-3: rgba(63, 107, 82, 0.14);
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px 60px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s var(--ease-soft), color 0.4s var(--ease-soft);
    }
    /* 背景柔光层
       注意：这里【不用 filter: blur()】。大面积高斯模糊是手机卡顿的头号原因，
       而径向渐变本身就是柔和的，视觉几乎一样，渲染成本低得多。
       动画也只做 translate（纯位移），不缩放，这样完全交给显卡，不触发重绘。 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(64vw 64vw at 18% 22%, var(--glow-1), transparent 66%),
        radial-gradient(58vw 58vw at 82% 34%, var(--glow-2), transparent 68%),
        radial-gradient(62vw 62vw at 50% 88%, var(--glow-3), transparent 68%);
      animation: driftBg 30s ease-in-out infinite;
      will-change: transform;
    }
    /* 手机上不做漂移动画（一直重绘很费电），静态显示即可 */
    html.lite body::before { animation: none; }
    @keyframes driftBg {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50%      { transform: translate3d(-2%, 3%, 0); }
    }

    .mist { font-size: 2.8rem; margin-bottom: 4px; animation: floatY 4s ease-in-out infinite; }
    /* 404 大字：墨 → 朱砂 → 金（印章感）。三档都取深色令牌，
       保证大字在宣纸底上也够清楚；深色主题自动变亮。
       【回退办法】把渐变三色改回 var(--primary), var(--accent) 45%, var(--gold)。 */
    .err-code {
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(120deg, var(--primary-ink), var(--accent) 46%, var(--gold-ink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleIn 0.8s var(--ease-bounce) backwards;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      animation: fadeInUp 0.6s var(--ease-out) 0.2s backwards;
    }
    .desc {
      color: var(--text-light);
      font-size: 0.95rem;
      max-width: 460px;
      margin-bottom: 28px;
      animation: fadeInUp 0.6s var(--ease-out) 0.28s backwards;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeInUp 0.6s var(--ease-out) 0.36s backwards;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 26px;
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s var(--ease-bounce), box-shadow 0.3s var(--ease-soft), background 0.3s var(--ease-soft);
    }
    .btn:active { transform: scale(0.93); }
    /* 主按钮：朱砂渐变实底 + 奶白字（强调层级第 1 档，「突出就突出」）。
       阴影用朱砂 RGB 令牌，不再用粉色字面量。
       【回退办法】color 改回 #fff，两处阴影改回 rgba(220,107,130,.3/.4)。 */
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-btn-a), var(--primary-btn-b));
      color: var(--text-on-accent);
      box-shadow: 0 6px 16px rgba(var(--accent-rgb), 0.30);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(var(--accent-rgb), 0.40); }
    .btn-secondary {
      background: transparent;
      color: var(--text-light);
      border: 2px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary-ink); transform: translateY(-1px); }

    .hint {
      margin-top: 30px;
      font-size: 0.82rem;
      color: var(--text-muted);
      animation: fadeInUp 0.6s var(--ease-out) 0.44s backwards;
    }
    /* 文本链接统一走朱砂 --accent（色板规定「链接 = accent」）。
       【回退办法】改回 var(--primary-ink)。 */
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-light);
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      box-shadow: var(--shadow);
      transition: transform 0.3s var(--ease-bounce), color 0.3s var(--ease-soft);
    }
    /* 主题按钮悬停：朱砂，跟链接同一套强调色。
       【回退办法】改回 var(--primary-ink)。 */
    .theme-toggle:hover { color: var(--accent); transform: rotate(-18deg) scale(1.08); }

    @keyframes titleIn {
      0%   { opacity: 0; transform: scale(0.7) translateY(-14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ---------- 精简模式（手机 / 低配设备自动生效） ----------
       关掉所有"一直在跑"的动画：这类动画每秒都在消耗电量和 GPU，
       静态页面完全没必要。 */
    html.lite .mist,
    html.lite .err-code {
      animation: none;
    }
    html.lite .btn,
    html.lite .theme-toggle {
      transition: none;
    }
  </style>
</head>
<body>

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">🌙</button>

  <span class="mist" aria-hidden="true">🌫️</span>
  <div class="err-code">404</div>
  <h1>这片雾里没有你要找的页面</h1>
  <!-- 2026-10-05：反馈功能整体下线（反馈页已删），
       这段文案里原来那句「或者把问题反馈给我们」不再提反馈，也不另造新的联系方式 -->
  <p class="desc">
    链接可能已经失效，或者地址被拼错了。<br>
    不妨回到首页看看，也许能从这里找到你想去的地方。
  </p>

  <div class="actions">
    <a class="btn btn-primary" id="homeLink" href="../index.html">🏠 返回首页</a>
    <button type="button" class="btn btn-secondary" id="backBtn">↩ 返回上一页</button>
    <!-- 2026-10-05：原反馈按钮随反馈页一起删掉（站主决定反馈功能下线） -->
    <a class="btn btn-secondary" id="thanksLink" href="../thanks.html">❤️ 鸣谢</a>
  </div>

  <!-- 2026-10-05：原来这里有一行「如果确信是错误，欢迎在反馈页告诉我们」，
       反馈页已经删除，这行连同它的链接一起去掉，页面上不留任何指向反馈页的引用。 -->

  <script>
    (function () {
      'use strict';

      var root = document.documentElement;

      /* ---------- 主题 ---------- */
      var btn = document.getElementById('themeToggle');
      function paint() {
        var dark = root.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? '☀️' : '🌙';
        /* 2026-10-25 中国色：404 不加载 common.js，浏览器状态栏颜色要在本页自己同步。
           【回退办法】删掉下面两行 meta 同步（状态栏会固定在浅色 #F5F0E6）。 */
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#14110E' : '#F5F0E6');
      }
      paint();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('zm_theme', next); } catch (e) {}
        paint();
      });

      /* ---------- 返回上一页 ---------- */
      document.getElementById('backBtn').addEventListener('click', function () {
        if (history.length > 1) history.back();
        else location.href = document.getElementById('homeLink').href;
      });

      /* ---------- 修正站内链接 ----------
         404 页可能出现在任意深度、也可能部署在子目录（如 GitHub Pages 的 /repo/），
         因此从当前路径逐级向上探测，找到真正存在 images/favicon.svg 的那一级作为站点根。 */
      var links = {
        homeLink: 'index.html',
        thanksLink: 'thanks.html'
        /* 2026-10-05：原来那两条指向反馈页的映射（按钮那条 + 正文链接那条）
           随反馈页一起删除，这里不再保留 —— 所以下面 applyBase 也不会再去设置它们 */
      };

      function applyBase(base) {
        Object.keys(links).forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.setAttribute('href', base + links[id]);
        });
        var icon = document.createElement('link');
        icon.rel = 'icon';
        icon.type = 'image/svg+xml';
        icon.href = base + 'images/favicon.svg';
        document.head.appendChild(icon);
      }

      var parts = location.pathname.split('/').filter(Boolean);
      /* 逐级向上：最后一段通常是被请求的文件名或目录名，先去掉 */
      if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) parts.pop();

      var prefixes = [];
      for (var i = parts.length; i >= 0; i--) {
        prefixes.push('/' + parts.slice(0, i).join('/') + (i ? '/' : ''));
      }

      (function probe(index) {
        if (index >= prefixes.length) return;   /* 全部失败：保留相对路径兜底 */
        var prefix = prefixes[index];
        fetch(prefix + 'images/favicon.svg', { method: 'HEAD' })
          .then(function (res) {
            if (res.ok) applyBase(prefix);
            else probe(index + 1);
          })
          .catch(function () { probe(index + 1); });
      })(0);
    })();
  </script>
</body>
</html>
